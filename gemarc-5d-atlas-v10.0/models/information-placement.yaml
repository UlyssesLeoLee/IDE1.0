# models/information-placement.yaml
# IDE1.0 5D 设计图集 — 信息放置矩阵（v10.0 契约）
#
# 规则：
#   - 每类信息只有一个权威位置，不做多轮冲突追加。
#   - 变更信息位置时，必须同步更新本矩阵、导航测试与设计决定记录。
#   - 0D 不产出页面，只作为内部存在性门禁。

meta:
  schema: ide1-5d-atlas/information-placement/v10.0
  version: ide1.0-factgraph-2026-10-23
  source_revision: REV-IDE1
  source_of_truth: models/information-placement.yaml
  change_control: 变更本矩阵必须同时更新 .tooling/verify-refs.mjs 的校验项与 docs/AI_IMPLEMENTATION_HANDOFF.md

placement:
  0D:
    location: 内部存在性门禁，无导航页面
    content: 有 / 无 / 未知 三态判定
    authoritative_source: models/architecture.json 的 verification 字段 + models/evidence.json
    prohibitions:
      - 不得把 Unknown 自动判为存在
      - 不得为 0D 制作装饰性架构图
    evidence_rule: Implemented 必须有 path:startLine-endLine 与 revision

  1D:
    location: Prompt 工作台（生成 / 编辑 / 校验 / 复制 / 导出 / 版本差分 / 链接证据）
    content: 面向「实现 IDE1.0 目标栈」与「维护本图集」两组提示词
    authoritative_source: models/prompts.json
    validation: 引用的 requirementIds / nodeEdgeIds / caseIds / evidenceIds 必须真实存在，否则报硬错误

  2D_canvas:
    location: 全元素无限画布
    content: 需求 / 屏幕 / 模块 / 服务 / 数据 / 边 / 事件 / Case / 证据 / 任务
    authoritative_source: models/architecture.json + models/requirements.json + models/cases.json + models/evidence.json
    capabilities: [Pan/Zoom, Minimap, Search, Layer, Filter, Focus, Group, Collapse, MultiSelect, Undo/Redo, 独立选择 Node/Edge/Port, 关系与需求追踪]

  2D_diagrams:
    location: 独立可展开的专业工程图审查单元（浮窗）
    content: UML 类/组件/包/时序/状态/活动/部署/用例、ER、DFD、BPMN、安全、网络、数据流
    authoritative_source: models/diagram-definitions.json
    rules:
      - 按 diagramType 选择渲染器，未知类型显式失败，不退化成时序图
      - 正式 UML/ER/BPMN 符号不得被宝石或示意箭头替代
      - IDE1.0 无关系型数据库，ER 图只表达会话/文档内存模型与磁盘文件关系

  prototype:
    location: 主导航独立 Prototype 工作区（不新增维度）
    content: 多标签页面、可视编辑（Konva）、真实 DOM 预览、状态与 Case、组件库、设计与测试
    authoritative_source: models/prototype.json
    rules:
      - 真实屏幕必须能追到代码证据；示范屏必须标 Designed
      - 预览必须是真实 HTML 控件，文本输入用原生 input/textarea
      - Action/Guard/State 必须随 Prototype JSON 一起序列化，不能只存 Konva Stage

  3D_scene:
    location: 语义空间（System → Building → Floor → Room → Node/Edge）
    content: IDE1.0 的四个真实层次：前端 / 后端 / OS / 外部工具
    authoritative_source: models/spatial.json
    rules:
      - 容器按实际系统语义投影，不得冒充物理机房
      - 左手语义坐标 +X 右 / +Y 上 / +Z 前，变换集中在 Adapter
      - 每个 Node 必须有 nodeOffsets 与宝石映射，否则 3D 中被静默跳过

  3D_inspector:
    location: 与 3D 选中对象同步的右侧检查器
    content: ER / UML / 时序 / API / 证据 / Case / 追踪矩阵
    authoritative_source: models/traceability.json + models/evidence.json

  4D_scene:
    location: 同一 3D 场景上的逻辑时间与事件
    content: 正常 / 异常 / 边界 / 并发 / 超时 / 重试 / 恢复 / 组合 等 Case
    authoritative_source: models/cases.json + models/causal-rules.json
    rules:
      - 引擎与 Three.js 解耦，动画只回放 Event Trace
      - 相同输入与模型必得同一规范轨迹

  4D_timeline:
    location: 底部时间轴
    content: 回放控制、逻辑事件序号、快照、Trace
    authoritative_source: models/cases.json 的执行结果（由 .tooling/verify-cases.mjs 真跑产生）

  5D_lab:
    location: 同一动态 3D 上的因果实验台
    content: 禁用/改写节点与边、修改守卫/超时/重试、注入资源故障、插入可互动元素、A/B 分支
    authoritative_source: models/scenario-deltas.json
    rules:
      - 干预只作用于模型副本，正式事实图不可变
      - 插入节点必须真正把 A→B 改写为 A→X→B，旧边去留可查
      - 无效果显示 NO_DIFFERENCE；未执行规则显示 UNKNOWN

view_independence:
  statement: Logical / Development / Process / Deployment / Data / Security / Operations / Dependency 视图与 1D–5D 表达维度相互独立
  rule: 切换视图只改变投影方式，不改变事实图、规则或因果结论

trace_chain:
  statement: Requirement ↔ Prompt ↔ BD/DD ↔ Screen/Node/Edge/Port ↔ API/DB/Event ↔ Case ↔ UT/IT/ST/UAT
  authoritative_source: models/traceability.json

gates:
  - .tooling/verify-refs.mjs — 引用一致性（悬空 ID 直接失败）
  - .tooling/verify-cases.mjs — 4D/5D 引擎真跑 + 覆盖回写
  - .tooling/build.mjs — src 语法门禁 + 模型键名门禁（失败即中止，不产出 index.html）

honesty:
  - 覆盖率数字由脚本实跑回写，不预填
  - 测试状态照抄来源文档，未重跑的一律标 NOT_TESTED
  - 文档与实现冲突时两边都记录，代码为事实来源，文档缺口进入 evidence.gaps
