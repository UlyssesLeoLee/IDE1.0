name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        rust: [stable]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            pkg-config \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            -> target

      - name: Code Formatting Check (cargo fmt)
        run: cargo fmt -p ide-fast -p editcore -p nema-codec -p ide-agent-router -- --check

      - name: Workspace Compilation Check (cargo check)
        run: cargo check --workspace

      - name: Strict Linter Gate (cargo clippy -D warnings)
        run: cargo clippy -p editcore -p nema-codec -p ide-agent-router -p ide-fast --all-targets -- -D warnings

      - name: Comprehensive Test Suite (cargo test)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          cargo test -p editcore --no-fail-fast
          cargo test -p nema-codec --no-fail-fast
          cargo test -p ide-agent-router --no-fail-fast
          cargo test -p ide-fast --bin ide-fast --no-fail-fast
