name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.6.9)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  msi:
    name: Build & Publish Windows Release (IDE1.0)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies (Pillow)
        run: pip install Pillow

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate Pop-Art Comic Installer Graphics
        run: python ide-fast/packaging/generate_comic_art.py

      - name: Build IDE1.0 MSI and Portable EXE
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ide-fast/packaging/build-msi.ps1

      - name: Upload Release Bundle to Action Artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ide-release-windows-x64
          path: |
            dist-fast/*.msi
            dist-fast/*.exe
            dist-fast/SHA256SUMS.txt
          retention-days: 30

      - name: Publish Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "dev" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(sed -n 's/version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "Publishing release for tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading release assets..."
            gh release upload "$TAG" dist-fast/*.msi dist-fast/*.exe dist-fast/SHA256SUMS.txt --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" dist-fast/*.msi dist-fast/*.exe dist-fast/SHA256SUMS.txt \
              --title "IDE1.0 $TAG" \
              --generate-notes
          fi

  sign:
    name: Code Signing via SignPath (Optional)
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    needs: msi
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Submit signing request to SignPath
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ide1-0
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed .msi
        uses: actions/upload-artifact@v4
        with:
          name: ide-msi-signed
          path: signed/*.msi

      - name: Attach signed .msi to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" signed/*.msi --clobber
