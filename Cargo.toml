[workspace]
resolver = "2"
members = ["crates/ide-kernel-core", "crates/ide-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
authors = ["Ulysses（一人公司 12 角色 per DEC-008）— Mavis 接手 (per 守门 #10 + 8/27 19:39 JST 授权)"]
repository = "https://github.com/UlyssesLeoLee/IDE1.0"
homepage = "https://github.com/UlyssesLeoLee/IDE1.0/blob/agent/minimaxm3/ulys-191-2/README.md"
documentation = "https://github.com/UlyssesLeoLee/IDE1.0"
readme = "README.md"
description = "IDE1.0 — 纯 Rust AI Native CLI Development Kernel (Stage 3.0 最小骨架 per ULYS-191 §4.2.2)"
keywords = ["ide", "kernel", "cli", "rust", "multica"]
categories = ["development-tools", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"  # 守门 #7
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
# 守门 #11 — 显式 git dep, 锁 rev = ULYS-191.1 (ULYS-224) main HEAD
# §4.5 跨项目 CI 落地后改 crates.io publish 或 path 依赖
aci-emitter = { git = "https://github.com/UlyssesLeoLee/aci-emitter", rev = "df28c56" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
