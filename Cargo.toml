[workspace]
resolver = "2"
members = [
    "crates/kernel-error",
    "crates/kernel-config",
    "crates/kernel-tracing",
    "crates/kernel-eventbus",
    "crates/kernel-session",
    "crates/kernel-capability-registry",
    "crates/kernel-cmd-bus",
    "crates/kernel-core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UlyssesLeoLee/IDE1.0"

[workspace.dependencies]
# Workspace-local crates
kernel-error = { path = "crates/kernel-error" }
kernel-config = { path = "crates/kernel-config" }
kernel-tracing = { path = "crates/kernel-tracing" }
kernel-eventbus = { path = "crates/kernel-eventbus" }
kernel-session = { path = "crates/kernel-session" }
kernel-capability-registry = { path = "crates/kernel-capability-registry" }
kernel-cmd-bus = { path = "crates/kernel-cmd-bus" }
kernel-core = { path = "crates/kernel-core" }

# Third-party — pinned to versions aligned with AD-001 v1.1 §6.x
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
parking_lot = "0.12"
dashmap = "6.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.18", default-features = false }
figment = { version = "0.10", features = ["toml", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = 1