[package]
name = "ide-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IDE1.0 MCP server: headless cross-provider co-editing (CAS + 3-way merge), diff, and editcore tools for AI agents"
keywords = ["mcp", "ide", "diff", "merge", "ai-agent"]
