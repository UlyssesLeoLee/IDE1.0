[lints]
workspace = true

[lib]
name = "ide_mcp"
path = "src/lib.rs"

[[bin]]
name = "ide-mcp"
path = "src/main.rs"

[dependencies]
editcore = { path = "../editcore" }
nema-codec = { path = "../nema-codec" }
serde = { workspace = true }
serde_json = { workspace = true }
