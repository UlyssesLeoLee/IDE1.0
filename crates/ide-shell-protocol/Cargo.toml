[package]
name = "ide-shell-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "IDE1.0 IDE Shell — headless vim-like RPC facade. HTTP/WebSocket/stdio 三协议, AI agent 通过 register_provider 注入补全/inline edit/chat."

[dependencies]
# Workspace 共享 deps (守门 #11 缺标比错标)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# 异步 server (HTTP/WS/stdio 三协议)
tokio = { workspace = true, features = ["process", "io-std"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
# IDE1.0 现有 kernel
ide-kernel-core = { path = "../ide-kernel-core" }
# 复用 ide-shell 提供的 vim-like App 作为底层 (但 protocol 不直接依赖 ide-shell,
# 避免 TUI 依赖拉入 server. 用 facade mode 调用 ide-shell::App 的相同字段约定).
# 实际本笔先实现独立的 headless Vim state (buffer/cursor/modes/keymap), 完整 TUI
# 由后续 brief 决定要不要 shared core.

[lints]
workspace = true
