[package]
name = "ide-shell-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "IDE1.0 IDE Shell — web 渲染 + HTTP server (per ULYS-191 §3 双外观设计, 给 Playwright e2e)"

[dependencies]
# Workspace 共享 deps
serde = { workspace = true }
serde_json = { workspace = true }
# 复用 ide-shell core (mode/input/keymap/app) + web render backend
ide-shell = { path = "../ide-shell" }
# 复用 ide-kernel-core 提供 banner
ide-kernel-core = { path = "../ide-kernel-core" }
# ACI bridge (复用 Stage 2)
aci-emitter = { workspace = true }
# crossterm 仅用作 KeyEvent/KeyModifiers/MouseButton 类型 (与 ide-shell::App::on_key/on_mouse 对接)
crossterm = { workspace = true }

[lints]
workspace = true
