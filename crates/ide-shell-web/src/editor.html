    GREP_STATE.thisFileOnly = $("grep-this-file").checked;
    GREP_STATE.allowOutside = $("grep-outside").checked;
    if (withReplace && $("grep-repl")) GREP_STATE.replace = $("grep-repl").value;

    /* 本文件模式: 条件退化成「只搜这一个文件」—— ファイル名 锁成 basename,
       フォルダー 锁成其所在目录, 两者合起来把范围钉死到该文件。 */
    const thisOnly = $("grep-this-file").checked;
    const effFolders = thisOnly && curDir ? [curDir] : folders;
    const inc = pats.include.slice();
    if (thisOnly && curBase) inc.splice(0, inc.length, curBase);
    // 关闭「包含子文件夹」**不再**靠往 include 里塞 `*` —— 后端现在有 subfolders 字段,
    // 由引擎决定是否下钻, 前端不该用 glob 近似 (那会把 src/a.rs 也排掉)。

    FIND_STATE.needle = q;
    startGrepJob({
      needle: q, caseSensitive: GREP_STATE.caseSensitive, thisOnly,
      folders: effFolders, subfolders: GREP_STATE.subfolders,
      base: {
        pattern: q || "*.*",
        case_sensitive: GREP_STATE.caseSensitive,
        regex: GREP_STATE.regex,
        whole_word: GREP_STATE.wholeWord,
        include_files: inc,
        allow_outside_root: $("grep-outside").checked,
        exclude_files: excFiles.length ? excFiles : null,
        exclude_folders: excDirs.length ? excDirs : null,
        subfolders: GREP_STATE.subfolders,
      },
    });
    status.textContent = "已在「Grep 结果」窗口中搜索 (可继续追加别的条件)";
    closeModal();                                   // Sakura: 条件对话框收起, 结果在独立窗口里边搜边显示
  };
  /* 任一输入框按回车即搜索 (与旧版一致; 新版五个框都要能触发, 否则在 フォルダー 里敲完回车没反应) */
  for (const id of ["grep-input", "grep-files", "grep-folders", "grep-exc-files", "grep-exc-dirs",
                    ...(withReplace ? ["grep-repl"] : [])]) {
    const e = $(id);
    if (e) e.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); runGrep(); }
    });
  }
}

function renderGrepResults(rows, needle, caseSensitive, mount) {

}

/* 把一批命中并入结果容器: 按文件分组 (G-61), 已有的文件组继续往后追加, 组头计数同步更新。
   流式显示 (Grep 结果窗口) 和一次性渲染共用这一份。 */
function grepAppendRows(box, groups, rows, needle, caseSensitive) {
  const hay = caseSensitive ? (x) => x : (x) => x.toLowerCase();
  const ndl = caseSensitive ? needle : needle.toLowerCase();
  for (const m of rows) {
    const path = m.path;
    let g = groups.get(path);
    if (!g) {
      const head = document.createElement("div");
      head.className = "opt-row grep-file-head";
      head.style.cssText = "font-weight:600;cursor:pointer;padding:3px 4px;background:rgba(127,127,127,0.12);";
      head.dataset.grepPath = path;
      const list = document.createElement("div");
      list.className = "grep-file-hits";
      list.dataset.grepPath = path;
      list.style.paddingLeft = "16px";
      head.addEventListener("click", () => { list.style.display = list.style.display === "none" ? "" : "none"; });
      box.appendChild(head);
      box.appendChild(list);
      g = { head, list, n: 0 };
      groups.set(path, g);
    }
    const row = document.createElement("div");
    row.className = "opt-row grep-hit";
    row.dataset.grepPath = path;
    row.dataset.grepLine = String(m.line);
    row.style.cssText = "cursor:pointer;font-family:monospace;white-space:pre;";
    const txt = String(m.text || "");
    let inner = "";
    if (needle) {
      const lower = hay(txt);
      let at = 0;
      while (true) {
        const i = lower.indexOf(ndl, at);
        if (i < 0) { inner += escapeHtml(txt.slice(at)); break; }
        inner += escapeHtml(txt.slice(at, i)) +
          '<mark style="background:var(--blue);color:#000;">' + escapeHtml(txt.substr(i, needle.length)) + "</mark>";
        at = i + Math.max(1, needle.length);
      }
    } else {
      inner = escapeHtml(txt);
    }
    row.innerHTML = m.line + ": " + inner;
    row.title = path + ":" + m.line;
    const jump = () => { closeModal(); gotoPathLine(path, m.line); };      // G-70
    row.addEventListener("click", jump);          // G-71 双击前先接单击
    row.addEventListener("dblclick", jump);       // G-71
    row.tabIndex = 0;
    row.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); jump(); } });  // G-72
    g.list.appendChild(row);
    g.n++;
    g.head.textContent = path + "  (" + g.n + ")";
  }
}

/* ===== Grep 结果窗口 (Sakura: 结果在独立窗口里边搜边显示) =====
   后端 search 是一次性返回, 所以把一次搜索切成若干「分片」(每个一级子目录一片 + 根目录自身的文件一片),
   每片返回就立刻并入窗口; 搜索没结束时随时可以再开 Grep 对话框追加新条件, 新搜索作为新的一节并行进行,
   每节可单独停止。 */
const GREPWIN = { el: null, body: null, jobs: new Set(), seq: 0 };

function ensureGrepWin() {
  if (GREPWIN.el && document.body.contains(GREPWIN.el)) { GREPWIN.el.style.display = "flex"; return GREPWIN; }
  const w = document.createElement("div");
  w.id = "grep-win";
  w.innerHTML =
    '<div id="grep-win-head"><span class="gw-title">Grep 结果</span><span id="grep-win-status"></span>' +
    '<span class="gw-spacer"></span>' +
    '<button class="md-btn" data-gw="add" title="追加新的搜索条件 (搜索未结束也可以)">追加</button>' +
    '<button class="md-btn" data-gw="stop" title="停止所有进行中的搜索">停止</button>' +
    '<button class="md-btn" data-gw="clear" title="清空结果">清空</button>' +
    '<button class="md-btn" data-gw="close" title="关闭 (同时停止搜索)">✕</button></div>' +
    '<div id="grep-results"></div>';
  document.body.appendChild(w);
  GREPWIN.el = w;
  GREPWIN.body = w.querySelector("#grep-results");
  w.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("[data-gw]");
    if (!b) return;
    const k = b.dataset.gw;
    if (k === "add") openGrepDialog(false);
    else if (k === "stop") { for (const j of GREPWIN.jobs) j.cancelled = true; }
    else if (k === "clear") { for (const j of GREPWIN.jobs) j.cancelled = true; GREPWIN.body.innerHTML = ""; GREPWIN.jobs.clear(); updateGrepWinStatus(); }
    else if (k === "close") { for (const j of GREPWIN.jobs) j.cancelled = true; GREPWIN.jobs.clear(); w.style.display = "none"; }
    else if (k === "sec-stop") { const sec = b.closest(".grep-sec"); for (const j of GREPWIN.jobs) if (String(j.id) === sec.dataset.job) j.cancelled = true; }
  });
  // 拖标题栏移动窗口
  const head = w.querySelector("#grep-win-head");
  head.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    const mv = (ev) => { w.style.left = Math.max(0, ev.clientX - dx) + "px"; w.style.top = Math.max(0, ev.clientY - dy) + "px"; w.style.right = "auto"; w.style.bottom = "auto"; };
    const up = () => { document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); };
    document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
  });
  return GREPWIN;
}

function updateGrepWinStatus() {
  const el = document.getElementById("grep-win-status");
  if (!el) return;
  let running = 0, hits = 0;
  for (const j of GREPWIN.jobs) { if (!j.done) running++; hits += j.hits; }
  el.textContent = (running ? "搜索中 " + running + " 项 · " : "") + "命中 " + hits + " 处";
}

async function grepShards(p) {
  const root = stripVerbatim(projectRoot || "");
  if (!p.subfolders || p.thisOnly) return [{ search_folders: p.folders.length ? p.folders : null }];
  const shards = [];
  for (const r of (p.folders.length ? p.folders : [root])) {
    let ents = null;
    try { ents = await invoke("list_dir", { path: r }); } catch (_) { ents = null; }
    if (!Array.isArray(ents)) { shards.push({ search_folders: [r] }); continue; }
    shards.push({ search_folders: [r], subfolders: false });                // 目录自身的文件
    for (const e of ents) if (e.is_dir) shards.push({ search_folders: [stripVerbatim(e.path)] });
  }
  return shards.length ? shards : [{ search_folders: null }];
}

async function startGrepJob(p) {
  const w = ensureGrepWin();
  const job = { id: ++GREPWIN.seq, cancelled: false, done: false, hits: 0, files: new Set(), groups: new Map() };
  GREPWIN.jobs.add(job);
  const sec = document.createElement("div");
  sec.className = "grep-sec";
  sec.dataset.job = String(job.id);
  const cond = "「" + (p.needle || "(文件名)") + "」" + (p.base.include_files && p.base.include_files.length ? " " + p.base.include_files.join(",") : "") +
    (p.folders.length ? " @" + p.folders.join(";") : "");
  sec.innerHTML = '<div class="grep-sec-head"><b>#' + job.id + "</b> " + escapeHtml(cond) +
    ' <span class="gs-state">搜索中…</span><button class="md-btn" data-gw="sec-stop">停止</button></div><div class="grep-sec-body"></div>';
  w.body.appendChild(sec);
  const body = sec.querySelector(".grep-sec-body");
  const state = sec.querySelector(".gs-state");
  const MAX = 5000;
  let err = "";
  try {
    const shards = await grepShards(p);
    for (let i = 0; i < shards.length && !job.cancelled && job.hits < MAX; i++) {
      state.textContent = "搜索中 " + (i + 1) + "/" + shards.length + " · 命中 " + job.hits;
      try {
        const resp = await invoke("search", Object.assign({}, p.base, shards[i], { max_results: MAX - job.hits }));
        const rows = (resp && resp.results) || (Array.isArray(resp) ? resp : []);
        if (rows.length && !job.cancelled) {
          grepAppendRows(body, job.groups, rows, p.needle, p.caseSensitive);
          for (const m of rows) job.files.add(m.path);
          job.hits += rows.length;
          updateGrepWinStatus();
        }
      } catch (e) { err = (e && e.message) || String(e); }
    }
  } catch (e) { err = (e && e.message) || String(e); }
  job.done = true;
  state.textContent = (job.cancelled ? "已停止 · " : err && !job.hits ? "搜索失败: " + err + " · " : "") +
    (job.hits ? "命中 " + job.hits + " 处, " + job.files.size + " 个文件" : (err ? "" : "无匹配"));
  sec.classList.add("done");
  const stop = sec.querySelector('[data-gw="sec-stop"]'); if (stop) stop.remove();
  updateGrepWinStatus();
  setTip("Grep 命中 " + job.hits + " 处");
  return job;
}
window.startGrepJob = startGrepJob;

/* 打开文件并把光标放到指定行 (1-based). openFile 之后光标固定在 0,0,
   这里补上定位 + 滚动可见, 否则从 Grep 结果跳过去还要自己找. */
async function gotoPathLine(path, line) {
  await openFile(stripVerbatim(path));
  const t = getActiveTab();
  if (!t) return;
  const row = Math.max(0, Math.min(t.lines.length - 1, (line | 0) - 1));
  t.cursor = { row, col: 0 };
  renderVim(t);
  setPos("Ln " + (row + 1) + ", Col 1");
  updateCaret(true);
  // 把目标行滚进视野
  scrollRowIntoView(row, "center");
  setTip("跳转到 " + path + ":" + (row + 1));
}

function openGrep() { openGrepDialog(false); }
function openGrepReplace() { openGrepDialog(true); }

// 跳转到行
function openGotoLine() {
  const t = getActiveTab();
  if (!t) return;
  const n = prompt("跳转到行 (1-" + t.lines.length + "):");
  if (!n) return;
  const row = parseInt(n, 10);
  if (isNaN(row) || row < 1) { setTip("行号超出范围"); return; }
  if (row > t.lines.length) { t.cursor = { row: t.lines.length - 1, col: charLen(t.lines[t.lines.length - 1] || "") }; t.sel = null; renderVim(t); setTip("已跳到文件末尾"); return; }   // Sakura: 超出行数 = 跳到文件末尾
  t.cursor = { row: row - 1, col: 0 };
  renderVim(t);
  setPos("Ln " + row + ", Col 1");
}

/* ===== 分屏 / 平铺 ===== */
   // none | h | v | quad
function applySplit() {
  const area = document.getElementById("editor-area");
  const ed = document.getElementById("editor");
  area.classList.remove("split-h", "split-v", "split-quad");
  if (SPLIT.mode !== "none") area.classList.add("split-" + SPLIT.mode);
  // 分屏时同一 tab 内容按行区间分段显示到多个 .split-view
  const t = getActiveTab();
  const panes = area.querySelectorAll(".split-view");
  panes.forEach((p) => p.remove());
  if (SPLIT.mode === "none" || !t) return;
  const n = SPLIT.mode === "quad" ? 4 : 2;
  const per = Math.ceil(t.lines.length / n);
  for (let i = 0; i < n; i++) {
    const view = document.createElement("div");
    view.className = "split-view";
    view.innerHTML = '<div class="split-label">视图 ' + (i + 1) + " · Ln " + (i * per + 1) +
      "-" + Math.min(t.lines.length, (i + 1) * per) + "</div>";
    t.lines.slice(i * per, (i + 1) * per).forEach((line) => {
      const row = document.createElement("div");
      row.className = "hl-row";
      row.innerHTML = Syntax.highlightLine(line, t.language || Syntax.detectLanguage(t.path || ""))
        .map((tk) => (tk.cls ? '<span class="tk-' + tk.cls + '">' + escapeHtml(tk.text) + "</span>" : escapeHtml(tk.text))).join("");
      view.appendChild(row);
    });
    // 显式落格 (行 3 起, 与完整布局里自动落格的结果相同): 标签条/面包屑被隐藏 (display:none) 时, 自动落格会把视图塞进
    // 它们留下的 auto 行 (行 1/2), 而不是 1fr 的行 3+
    const gr = SPLIT.mode === "h" ? 3 + i : SPLIT.mode === "v" ? 3 : 3 + (i >> 1);
    view.style.gridRow = String(gr);
    if (gr > 3) view.dataset.row2 = "";    // 第二排视图: min 布局里用它的上边线当两排之间的分隔 (行间距在 min 下为 0, 见样式表)
    view.style.gridColumn = String(SPLIT.mode === "h" ? 1 : 1 + (i % 2));
    ed.style.display = "none";
    area.appendChild(view);
  }
  setTip("分割: " + SPLIT.mode);
}

function splitView(mode) {
  SPLIT.mode = SPLIT.mode === mode ? "none" : mode;
  applySplit();
}
function tileWindows(mode) {
  // 单窗口应用没有多窗口可平铺, 用「全屏 + 恢复」表达 cascade/tile 的意图
  if (mode === "cascade") openNewWindow();
  else if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
  setTip("平铺 " + mode + " (单窗口模式: " +
    (document.fullscreenElement ? "已全屏" : "已退出全屏") + ")");
}

function macroStart() {
  if (MACRO.recording) { setTip("已在录制中"); return; }
  MACRO.recording = true;
  MACRO.keys = [];
  setTip("● 宏录制中 — 按 Ctrl+Shift+R 停止");
}
function macroStop() {
  if (!MACRO.recording) { setTip("未在录制"); return; }
  MACRO.recording = false;
  setTip("■ 宏已停止 (" + MACRO.keys.length + " 键) — 工具>宏>播放宏 回放");
}
function macroPlay() {
  if (MACRO.keys.length === 0) { setTip("无已录制宏"); return; }
  if (MACRO.playing) { MACRO.playing = false; setTip("宏回放已中断"); return; }
  MACRO.playing = true;
  setTip("▶ 回放 " + MACRO.keys.length + " 键 (再按一次中断)");
  let i = 0;
  const step = () => {
    if (!MACRO.playing || i >= MACRO.keys.length) {
      MACRO.playing = false;
      setTip("宏回放结束");
      return;
    }
    const rec = MACRO.keys[i++];
    edContent.dispatchEvent(new KeyboardEvent("keydown", {
      key: rec.key, ctrlKey: rec.ctrl, shiftKey: rec.shift, altKey: rec.alt, bubbles: true, cancelable: true,
    }));
    setTimeout(step, 60);
  };
  step();
}

// 录制钩子: 在 editor keydown 里挂
function recordKey(e) {
  if (!MACRO.recording || e.key === "F9") return;
  if (MACRO.keys.length < 1000) {
    MACRO.keys.push({ key: e.key, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey });
  }
}

function runPpaMacro() {

// 供 JS 宏使用的受限 API


// 跳转到下一个标签定义 (fn/struct/impl/class/def/func 等)
function tagJump() {
  const t = getActiveTab();
  if (!t) return;
  const lang = t.language || Syntax.detectLanguage(t.path || "");
  const re = /^[ \t]*(?:pub\s+)?(?:async\s+)?(?:export\s+)?(fn|struct|enum|impl|trait|type|func|class|def|function|interface|module|const)\s+([A-Za-z_][A-Za-z0-9_]*)/;
  let idx = -1;
  for (let r = t.cursor.row + 1; r < t.lines.length; r++) {
    if (re.test(t.lines[r])) { idx = r; break; }
  }
  if (idx < 0) {
    for (let r = 0; r < t.cursor.row; r++) if (re.test(t.lines[r])) { idx = r; break; }
  }
  if (idx < 0) { setTip("本文件内未找到标签 (" + Syntax.languageLabel(lang) + ")"); return; }
  t.cursor = { row: idx, col: 0 };

function copyLinesUp() { copyLines(1); }
function copyLinesDown() { copyLines(-1); }
function copyLines(dir) {
  // dir=1 复制到上一行, dir=-1 复制到下一行
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const at = dir === 1 ? t.cursor.row : t.cursor.row + 1;
  t.lines.splice(at, 0, t.lines[t.cursor.row]);
  t.cursor.row = at;
  t.dirty = true;
  renderVim(t);
}

/* ---------- A1-b. Sakura 增删改 (F_CUT_LINE / F_LineCutToStart / F_LineDeleteToStart / F_LineDeleteToEnd)

   本项目原来只有 deleteLine / addLineAbove / addLineBelow / deleteLineUp / deleteLineDown /
   joinWithPrev 这一套自造命令, 和上游 F_* 语义对不上. 这里补齐上游有而本项目缺的,
   键位照抄上游 sakura_core/func/CKeyBind.cpp 的官方默认表:
     Ctrl+E        剪切整行          (F_CUT_LINE,          HLP000174)
     Ctrl+U        剪切到行首        (F_LineCutToStart,    HLP000172)
     Shift+Ctrl+U  删到行首          (F_LineDeleteToStart, HLP000170)
     Shift+Ctrl+K  删到行末          (F_LineDeleteToEnd,   HLP000171)
   裸 Ctrl+K (F_LineCutToEnd 剪切到行末) 让位给本项目已有的「打开文件夹」chord (Ctrl+K O),
   Shift 变体不冲突所以保留 —— 菜单里两条都有入口, 只是「剪切到行末」没快捷键.

   四条各自直接 charSlice 拼行, 不抽公共 setter: 「切掉哪一段、留下哪一段」各不相同
   (到行首留尾部 / 到行末留头部 / 整行整条删), 抽象出来反而更难读. */

// 剪切整行 (F_CUT_LINE, HLP000174): 删掉光标所在行, 文本进剪贴板.
// 删到只剩 1 行时补一个空行 —— 文档必须永远至少有 1 行可编辑 (与既有 deleteLine 一致).

// 剪切到行首 (F_LineCutToStart, HLP000172): 光标到行首之间剪掉.
// col 已在行首时无内容可剪, 直接不动 (Sakura 同: 空选区不产生剪贴板).

// 删到行首 (F_LineDeleteToStart, HLP000170): 剪切到行首但不进剪贴板.

// 删到行末 (F_LineDeleteToEnd, HLP000171): 光标到行末之间删掉, 不动换行符.
// 光标在行末时什么都不删 —— 与上游一致 (Sakura 不在这里吞掉换行, 那是「删除整行」).

// 删到词首 (F_WordDeleteToStart, HLP000166): Ctrl+Backspace.
// 复用 wordLeft —— 那是本项目已经对齐 Sakura 语义的边界函数 (词首, 跨过分隔符).

// 删到词尾 (F_WordDeleteToEnd, HLP000167): 上游绑 Ctrl+Delete.
// ⚠️ 本项目 Ctrl+Delete 原本是「删除下方行」(菜单上写死, 有 UAT 覆盖), 且 Alt+Delete
// 才是上游键位而 Alt+D 是本项目的文件菜单助记 —— 所以这条只提供函数 + 菜单入口, 不抢键位.

/* ---------- A1-c. Sakura 其余增删改 (F_LTRIM / F_RTRIM / F_UNIQ / F_INDENT) ----------

   F_LTRIM / F_RTRIM (HLP000210/211): 删行首/行尾空白. 上游键位 Alt+L / Alt+R 与本项目
   菜单助记冲突, 只做函数 + 菜单入口, 不绑快捷键.
   F_UNIQ (HLP000214): 去重**连续**重复行.
   ⚠️ 本项目已有 dedupeLines, 但那是「全局去重」, 语义和 Sakura 的 uniq 不同 ——
   所以这里补 uniqConsecutiveLines, 不动 dedupeLines 的现有行为 (line-ops 面板在用).
   F_SORT_ASC / F_SORT_DESC: 已有 sortLines 且已是选区限定, 上游键位 Alt+A/Alt+D 与
   菜单助记冲突, 所以只补菜单入口, 不绑快捷键.
   F_INDENT_TAB / F_UNINDENT_TAB (HLP000113): Tab / Shift+Tab 缩进. 本项目 Tab 在 INSERT
   下是「插入 2 空格」, 所以只在**有选区或列块**时把 Tab/Shift+Tab 解释为缩进/反缩进,
   其余模式放行给原逻辑 —— 不抢 Tab 键本身. */

// 删行首空白 (F_LTRIM, HLP000210): 选区内逐行删 ^[ \t]+; 无选区只处理光标行.
function ltrimLines() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const rows = (t.sel && t.sel.r1 !== t.sel.r0)
    ? Array.from({ length: t.sel.r1 - t.sel.r0 + 1 }, (_, i) => t.sel.r0 + i)
    : [t.cursor.row];
  let changed = 0;
  for (const r of rows) {
    const before = t.lines[r] || "";
    const after = before.replace(/^[ \t]+/, "");
    if (after !== before) { t.lines[r] = after; changed++; }
  }
  t.dirty = true;
  renderVim(t);
  setTip(changed ? "已删除 " + changed + " 行行首空白" : "行首无空白可删");
}

// 删行尾空白 (F_RTRIM, HLP000211): 选区内逐行删 [ \t]+$; 无选区只处理光标行.
function rtrimLines() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const rows = (t.sel && t.sel.r1 !== t.sel.r0)
    ? Array.from({ length: t.sel.r1 - t.sel.r0 + 1 }, (_, i) => t.sel.r0 + i)
    : [t.cursor.row];
  let changed = 0;
  for (const r of rows) {
    const before = t.lines[r] || "";
    const after = before.replace(/[ \t]+$/, "");
    if (after !== before) { t.lines[r] = after; changed++; }
  }
  t.dirty = true;
  renderVim(t);
  setTip(changed ? "已删除 " + changed + " 行行尾空白" : "行尾无空白可删");
}

// 去重连续重复行 (F_UNIQ, HLP000214): ⚠️ 只删「连续」重复, 不是全局去重.
// 选区内时只对选区行做连续去重; 无选区时对全文做.
function uniqConsecutiveLines() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  let removed = 0;
  const dedupeRun = (seg) => {
    const out = [];
    let prev = null;
    for (const l of seg) {
      if (l !== prev) { out.push(l); prev = l; } else { removed++; }
    }
    return out;
  };
  if (t.sel && t.sel.r1 !== t.sel.r0) {
    const { r0, r1 } = t.sel;
    const seg = t.lines.slice(r0, r1 + 1);
    t.lines.splice(r0, seg.length, ...dedupeRun(seg));
  } else {
    t.lines = dedupeRun(t.lines);
  }
  t.dirty = true;
  renderVim(t);
  setTip(removed ? "已去重 " + removed + " 行连续重复" : "无连续重复行");
}

// Tab / Shift+Tab = 缩进 / 反缩进 (F_INDENT_TAB / F_UNINDENT_TAB, HLP000113).
// 只在有列块或跨行选区时生效; 无选区时什么都不做 (放行给既有 Tab 逻辑).
// 缩进单位跟随文件: 参与行里只要有一行用 tab 缩进就插 \t, 否则插 2 空格 ——
// 固定插 \t 会让空格缩进的项目出现混排, 而 Sakura 的缩进单位是可在设置里配的.
function indentUnitFor(lines, rows) {
  for (const r of rows) {
    const line = lines[r] || "";
    if (/^\t/.test(line)) return "\t";
    if (/^ +/.test(line)) return "  ";
  }
  return null;
}

function indentSelection(reverse) {
  const t = getActiveTab();
  if (!t) return;
  const multi = !!(t.colSel) || !!(t.sel && t.sel.r1 !== t.sel.r0);
  if (!multi) return;
  const rows = t.colSel
    ? Array.from({ length: colSelRect(t).r1 - colSelRect(t).r0 + 1 }, (_, i) => colSelRect(t).r0 + i)
    : Array.from({ length: t.sel.r1 - t.sel.r0 + 1 }, (_, i) => t.sel.r0 + i);
  // 参与行里没有既有缩进时 (比如选中的都是顶格行), 默认按 2 空格走
  const unit = indentUnitFor(t.lines, rows) || "  ";
  snapshot(t);
  let changed = 0;
  if (t.colSel) {
    const { r0, r1, c0 } = colSelRect(t);
    for (let r = r0; r <= r1; r++) {
      const line = t.lines[r] || "";
      if (reverse) {
        // 只在插入点正好落在缩进单位末尾时才删, 否则会在正中间啃掉正文字符
        const head = charSlice(line, 0, c0);
        if (head.length < unit.length || charSlice(line, c0 - unit.length, c0) !== unit) continue;
        t.lines[r] = charSlice(line, 0, c0) + charSlice(line, c0 + unit.length, charLen(line));
      } else {
        t.lines[r] = charSlice(line, 0, c0) + unit + charSlice(line, c0, charLen(line));
      }
      changed++;
    }
  } else {
    const { r0, r1 } = t.sel;
    for (let r = r0; r <= r1; r++) {
      const line = t.lines[r] || "";
      if (reverse) {
        // 行首是单位的前缀才删, 删完必须正好落在单位边界上 (只删一半会留半个缩进)
        const m = line.match(new RegExp("^((?:" + (unit === "\t" ? "\\t" : " ") + ")+)"));
        if (!m) continue;
        const ind = m[1];
        if (ind.length < unit.length) continue;
        t.lines[r] = charSlice(line, unit.length, charLen(line));
      } else {
        t.lines[r] = unit + line;
      }
      changed++;
    }
  }
  t.dirty = true;
  renderVim(t);
  setTip(reverse ? "反缩进 " + changed + " 行" : "缩进 " + changed + " 行");
}

/* ---------- A2. 剪贴板历史 (传统惯例 最多 20 条) ---------- */
   // {text, at}
const CLIP_MAX = 20;

function pushClip(text) {
  if (!text) return;
  const at = CLIP_HISTORY.findIndex((c) => c.text === text);
  if (at >= 0) CLIP_HISTORY.splice(at, 1);       // 去重后置顶
  CLIP_HISTORY.unshift({ text, at: Date.now() });
  if (CLIP_HISTORY.length > CLIP_MAX) CLIP_HISTORY.pop();
  CLIPBOARD = text;
  writeSystemClipboard(text);
}

function showClipHistory() {
  if (CLIP_HISTORY.length === 0) { setTip("剪贴板历史为空"); return; }
  const rows = CLIP_HISTORY.map((c, i) => {
    const preview = c.text.replace(/\n/g, "⏎").slice(0, 70);
    const when = new Date(c.at).toLocaleTimeString("zh-CN");
    return '<div class="opt-row" data-clip="' + i + '">' + escapeHtml(when + "  " + preview) +
      ' <span style="color:var(--fg-dim)">(' + c.text.length + " 字符)</span></div>";
  }).join("");
  openModal({ title: "剪贴板历史 (" + CLIP_HISTORY.length + ")", bodyHTML: rows,
    buttons: [{ label: "清空", cmd: "clip-clear" }, { label: "关闭", cmd: "modal-close" }] });
}

function restoreClip(i) {
  const c = CLIP_HISTORY[i];
  if (!c) return;
  CLIPBOARD = c.text;
  closeModal();
  setTip("已恢复 " + c.text.length + " 字符");
}
function clearClipHistory() {
  CLIP_HISTORY.length = 0;
  closeModal();
  setTip("剪贴板历史已清空");
}

function zoomBy(delta) {

function initZoomWheel() {

/* ---------- A5. 时间戳 / 日志模式 (插入时自动带时间) ---------- */
  // line | before | after

function stampNow() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const date = d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
  const time = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  if (STAMP.date) return date;
  if (STAMP.time) return time;
  if (STAMP.datetime) return date + " " + time;
  return "";
}

function stampPanel() {
  const html =
    '<div class="opt-row"><label><input type="checkbox" id="st-date" ' + (STAMP.date ? "checked" : "") +
    ' /> 日期 (YYYY/MM/DD)</label></div>' +
    '<div class="opt-row"><label><input type="checkbox" id="st-time" ' + (STAMP.time ? "checked" : "") +
    ' /> 时间 (HH:MM:SS)</label></div>' +
    '<div class="opt-row"><label><input type="checkbox" id="st-dt" ' + (STAMP.datetime ? "checked" : "") +
    ' /> 日期+时间</label></div>' +
    '<div class="opt-row">位置: ' +
      ["line 行首", "before 光标前", "after 光标后"].map((m, i) =>
        '<label><input type="radio" name="st-mode" value="' + ["line", "before", "after"][i] + '"' +
        (STAMP.mode === ["line", "before", "after"][i] ? " checked" : "") + ' /> ' + m + "</label>").join(" ") +
    '</div>' +
    '<div class="opt-row">预览: <code>' + escapeHtml(stampNow() || "(未启用)") + "</code></div>";
  openModal({ title: "时间戳插入", bodyHTML: html, buttons: [{ label: "关闭", cmd: "modal-close" }] });
  ["date", "time", "datetime"].forEach((k) => {
    const el = document.getElementById("st-" + k);
    if (el) el.addEventListener("change", () => {
      STAMP.date = document.getElementById("st-date").checked;
      STAMP.time = document.getElementById("st-time").checked;
      STAMP.datetime = document.getElementById("st-dt").checked;
      stampPanel();
    });
  });
  document.querySelectorAll('input[name="st-mode"]').forEach((r) =>
    r.addEventListener("change", () => { STAMP.mode = r.value; stampPanel(); }));
}

function insertStamp() {
  const text = stampNow();
  if (!text) { stampPanel(); return; }
  const t = getActiveTab();
  if (!t) return;
  const at = stampAt(t);
  if (at === null) { stampPanel(); return; }
  snapshot(t);
  if (STAMP.mode === "line") {
    const indent = (t.lines[t.cursor.row].match(/^[ \t]*/) || [""])[0];
    t.lines[t.cursor.row] = t.lines[t.cursor.row].replace(indent, indent + "[" + text + "] ");
    t.dirty = true;
    renderVim(t);
  } else {
    const line = curLine(t);
    const head = line.slice(0, t.cursor.col), tail = line.slice(t.cursor.col);
    const ins = text + (STAMP.mode === "before" ? " " : "");
    t.lines[t.cursor.row] = head + ins + tail;
    t.cursor.col += charLen(ins);
    t.dirty = true;
    paintActive();
  }
  setTip("已插入时间戳: " + text);
}

function stampAt(t) {
  // 光标行未选中任何字符时, line 模式才有意义; before/after 任意位置可用
  if (STAMP.mode === "line") {
    const line = t.lines[t.cursor.row] || "";
    if (t.cursor.col > 0 && line.slice(0, t.cursor.col).trim() !== "") {
      setTip("行首插入需要光标在行首 (或缩进之后)");
      return null;
    }
  }
  return t.cursor.row;
}

function eolPanel() {
  const t = getActiveTab();
  const cur = t ? docMeta(t).eol : "crlf";
  const rows = ["crlf", "lf", "cr"].map((k) =>
    '<div class="opt-row" data-eol="' + k + '"' + (k === cur ? ' style="color:var(--blue)"' : "") + ">" +
    k.toUpperCase() + (k === cur ? "  ← 当前" : "") + "</div>").join("");
  openModal({ title: "入力改行コード", bodyHTML: rows, buttons: [{ label: "关闭", cmd: "modal-close" }] });
  mdBody.querySelectorAll("[data-eol]").forEach((r) =>
    r.addEventListener("click", () => { closeModal(); setDocEol(r.dataset.eol); }));
}

/* ---------- B3. 行排序 / 去重 / 反转 ---------- */
function sortLines(asc) {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const sel = t.sel;
  if (sel && sel.r1 !== sel.r0) {
    // 只对选区排序 (按光标列做自然排序)
    const key = t.cursor.col;
    const seg = t.lines.slice(sel.r0, sel.r1 + 1)
      .sort((a, b) => cmpAt(a, b, key) * (asc ? 1 : -1));
    t.lines.splice(sel.r0, seg.length, ...seg);
  } else {
    t.lines.sort((a, b) => cmpAt(a, b, 0) * (asc ? 1 : -1));
  }
  t.dirty = true;
  renderVim(t);
  setTip("排序: " + (asc ? "升序" : "降序"));
}

// 数字优先的自然比较 (2 < 10)
function cmpAt(a, b, col) {
  const na = parseFloat(a.slice(col).replace(/[^\d.\\-].*$/, ""));
  const nb = parseFloat(b.slice(col).replace(/[^\d.\\-].*$/, ""));
  if (!isNaN(na) && !isNaN(nb) && na !== nb) return na < nb ? -1 : 1;
  const sa = a.slice(col), sb = b.slice(col);
  return sa < sb ? -1 : sa > sb ? 1 : 0;
}

function dedupeLines() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const seen = new Set();
  const before = t.lines.length;
  t.lines = t.lines.filter((l) => {
    if (seen.has(l)) return false;
    seen.add(l);
    return true;
  });
  t.dirty = true;
  renderVim(t);
  setTip("去重: " + before + " → " + t.lines.length + " 行");
}

function reverseLines() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  t.lines.reverse();
  t.dirty = true;
  renderVim(t);
  setTip("已反转行序");
}

function removeDuplicateSpaces() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  let removed = 0;
  t.lines = t.lines.map((l) => {
    const n = l.replace(/[ \t]{2,}/g, " ").replace(/[ \t]+$/, "");
    if (n !== l) removed++;
    return n;
  });
  t.dirty = true;
  renderVim(t);
  setTip("压缩空白: " + removed + " 行");
}

function lineOpsPanel() {
  openModal({
    title: "行操作",
    bodyHTML:
      '<div class="opt-row" data-lo="sort-asc">升序排序</div>' +
      '<div class="opt-row" data-lo="sort-desc">降序排序</div>' +
      '<div class="opt-row" data-lo="dedupe">删除重复行</div>' +
      '<div class="opt-row" data-lo="reverse">反转行序</div>' +
      '<div class="opt-row" data-lo="squeeze">压缩连续空白并去行尾空格</div>',
    buttons: [{ label: "关闭", cmd: "modal-close" }],
  });
  mdBody.querySelectorAll("[data-lo]").forEach((r) => r.addEventListener("click", () => {
    const a = r.dataset.lo;
    closeModal();
    if (a === "sort-asc") sortLines(true);
    else if (a === "sort-desc") sortLines(false);
    else if (a === "dedupe") dedupeLines();
    else if (a === "reverse") reverseLines();
    else removeDuplicateSpaces();
  }));
}

/* ---------- C1. 多重光标 (Ctrl+点击 / Alt+点击 添加, Esc 退出) ---------- */
/* cursor 集合存在 tab.cursors; 为空时退化为单光标 [t.cursor].
   所有编辑操作 (insertChar/backspace/normalDeleteChar) 遍历这个集合. */

function cursorsOf(t) {
  if (!t) return [];
  if (!t.cursors || t.cursors.length === 0) return [{ row: t.cursor.row, col: t.cursor.col }];
  return t.cursors;
}

function setCursors(t, list) {
  t.cursors = list;
  // 主光标 = list[0]
  if (list.length > 0) t.cursor = { row: list[0].row, col: list[0].col };
}

function addCursor(t, row, col) {
  const cs = cursorsOf(t).slice();
  if (cs.some((c) => c.row === row && c.col === col)) return;
  cs.push({ row, col });
  cs.sort((a, b) => a.row - b.row || a.col - b.col);
  setCursors(t, cs);
}

function nextCursor(t) {
  const cs = cursorsOf(t).slice().sort((a, b) => a.row - b.row || a.col - b.col);
  const at = cs.findIndex((c) => c.row > t.cursor.row ||
    (c.row === t.cursor.row && c.col > t.cursor.col));
  if (at < 0) setCursors(t, [cs[0]]);
  else { setCursors(t, [cs[at]]); }
}

function clearCursors(t) {
  if (t) { t.cursors = []; delete t.cursors; }
}

// 每个光标位置的插入 (多重光标下的字符输入)
function insertCharMulti(ch) {
  const t = getActiveTab();
  if (!t) return;
  const cs = cursorsOf(t).slice().sort((a, b) => b.row - a.row || b.col - a.col);   // 从后往前, 避免位移
  if (cs.length === 1) { insertChar(ch); return; }
  snapshot(t);
  for (const c of cs) {
    while (t.lines.length <= c.row) t.lines.push("");
    const line = t.lines[c.row];
    t.lines[c.row] = line.slice(0, c.col) + ch + line.slice(c.col);
    c.col += ch.length;
  }
  t.dirty = true;
  setCursors(t, cs.reverse());
  renderVim(t);
  setTip(cs.length + " 个光标插入 " + ch);
}

// 多光标退格
function backspaceMulti() {
  const t = getActiveTab();
  if (!t) return;
  const cs = cursorsOf(t);
  if (cs.length === 1) { backspace(); return; }
  snapshot(t);
  const sorted = cs.slice().sort((a, b) => b.row - a.row || b.col - a.col);
  for (const c of sorted) {
    if (c.col > 0) {
      const line = t.lines[c.row];
      t.lines[c.row] = line.slice(0, c.col - 1) + line.slice(c.col);
      c.col -= 1;
    } else if (c.row > 0) {
      const prev = t.lines[c.row - 1];
      c.col = prev.length;
      t.lines[c.row - 1] = prev + t.lines[c.row];
      t.lines.splice(c.row, 1);
    }
  }
  t.dirty = true;
  setCursors(t, sorted.reverse());
  renderVim(t);
  setTip(sorted.length + " 个光标删除");
}

/* ---------- C2. 列选择 (Alt+拖选 / Alt+Shift+方向键) ---------- */
/* 用 t.colSel = {r0, c0, r1, c1} 表示矩形选区. */

function startColumnSelect(row, col) {
  const t = getActiveTab();
  if (!t) return;
  t.sel = null;
  t.colSel = { r0: row, c0: col, r1: row, c1: col };
  // 活动角 = 键盘延伸的起点. 锚点/活动角分离是 Sakura 的列块语义:
  // 从锚点往回拖和从锚点往前走, 上下键的延伸方向不同, 所以不能靠 min/max 推断.
  t.colActiveRow = row;
  t.colActiveCol = col;
  renderVim(t);
  syncColumnSelectUI(t);
}

function extendColumnSelect(row, col) {
  const t = getActiveTab();
  if (!t || !t.colSel) return;
  t.colSel.r1 = row;
  // col < 0 = 只移动纵向边界, 横向范围不变 (上下键在列块里不该改变列跨度).
  if (col >= 0) t.colSel.c1 = col;
  if (col >= 0) t.colActiveCol = col;
  t.colActiveRow = row;
  renderVim(t);
  syncColumnSelectUI(t);
}

/* ---------- C2-1. Alt+方向键 = 纯键盘矩形选取 (Sakura F_UP_BOX 等) ----------
   Sakura 把矩形选区做成两条入口 (HLP000014): 鼠标拖, 或 Shift+F6 之后用方向键.
   本项目原本只有「Alt+拖动」和 Shift+F6, 缺了 Alt+方向键这条官方入口 ——
   而 Alt+方向键才是 Sakura 用户肌肉记忆里最常用的一条 (不用离开 Home 行).

   为什么不复用 edContent keydown 里那段 INSERT 内的方向键分支: 那里要求 colSel 已存在,
   且只在 INSERT 模式下生效. 这里要能在任意模式 (含 NORMAL/vim) 直接起选区. */
function boxMove(dr, dc) {
  const t = getActiveTab();
  if (!t) return;
  if (!t.colSel) startColumnSelect(t.cursor.row, t.cursor.col);
  const lastRow = Math.max(0, t.lines.length - 1);
  const actR = (t.colActiveRow !== undefined) ? t.colActiveRow : t.colSel.r1;
  const actC = (t.colActiveCol !== undefined) ? t.colActiveCol : t.colSel.c1;
  const rect = colSelRect(t);
  let nr = actR;
  let nc = actC;
  // 上下只动行边界, 且不许越过矩形另一端 (Sakura 语义: 收缩到当前范围以内);
  // 左右同理. 不夹的话 Alt+↑ 能把行边界拖到矩形外面, 之后输入会溢出选区.
  if (dr !== 0) nr = dr < 0 ? Math.max(rect.r0, actR + dr) : Math.min(lastRow, actR + dr);
  if (dc !== 0) {
    const maxLen = charLen(t.lines[Math.max(0, Math.min(actR, lastRow))] || "");
    nc = dc < 0 ? Math.max(0, actC + dc) : Math.min(maxLen, actC + dc);
  }
  t.colActiveRow = nr;
  t.colActiveCol = nc;
  extendColumnSelect(nr, nc);
  t.cursor.row = nr;
  t.cursor.col = nc;
  updateCaret(false);
  const r = colSelRect(t);
  setTip("列块 " + (r.r1 - r.r0 + 1) + "行 ×" + Math.max(1, r.c1 - r.c0) + "列");
}

/* Alt+Home / Alt+End = 列边界直接到行首/行末 (F_GOLINETOP_BOX / F_GOLINEEND_BOX).
   行末用 Number.MAX_SAFE_INTEGER 而不是实际长度: colSelRect 会按参与行的最长行
   clamp, 这样末列一定被覆盖到 (Sakura 的 End 语义), 而不是停在当前行的短行尾. */
function boxEdge(toEnd) {
  const t = getActiveTab();
  if (!t) return;
  if (!t.colSel) startColumnSelect(t.cursor.row, t.cursor.col);
  const actR = (t.colActiveRow !== undefined) ? t.colActiveRow : t.colSel.r1;
  const nc = toEnd ? Number.MAX_SAFE_INTEGER : 0;
  t.colActiveCol = nc;
  extendColumnSelect(actR, nc);
  t.cursor.row = actR;
  t.cursor.col = nc === Number.MAX_SAFE_INTEGER ? charLen(t.lines[actR] || "") : 0;
  updateCaret(false);
  const r = colSelRect(t);
  setTip("列块 " + (r.r1 - r.r0 + 1) + "行 ×" + Math.max(1, r.c1 - r.c0) + "列");
}

/* 列块的「活动角」直接移到 (nr, nc): 单词 / 整页 / 文件首尾 这些大步移动共用 */
function boxGoto(nr, nc) {
  const t = getActiveTab();
  if (!t) return;
  if (!t.colSel) startColumnSelect(t.cursor.row, t.cursor.col);
  const lastRow = Math.max(0, t.lines.length - 1);
  nr = Math.max(0, Math.min(lastRow, nr));
  nc = Math.max(0, Math.min(charLen(t.lines[nr] || ""), nc));
  t.colActiveRow = nr; t.colActiveCol = nc;
  extendColumnSelect(nr, nc);
  t.cursor.row = nr; t.cursor.col = nc;
  const lh = parseFloat(getComputedStyle(edContent).lineHeight) || 18;
  if (nr * lh < edContent.scrollTop || (nr + 1) * lh > edContent.scrollTop + edContent.clientHeight) edContent.scrollTop = Math.max(0, nr * lh - edContent.clientHeight / 2);
  updateCaret(false);
  const r = colSelRect(t);
  setTip("列块 " + (r.r1 - r.r0 + 1) + "行 ×" + Math.max(1, r.c1 - r.c0) + "列");
}
function boxWord(dir) {
  const t = getActiveTab(); if (!t) return;
  if (!t.colSel) startColumnSelect(t.cursor.row, t.cursor.col);
  const row = t.colActiveRow !== undefined ? t.colActiveRow : t.colSel.r1, cs = chars(t.lines[row] || "");
  let c = t.colActiveCol !== undefined ? t.colActiveCol : t.colSel.c1;
  const isW = (ch) => /[A-Za-z0-9_-￿]/.test(ch || "");
  if (dir > 0) { while (c < cs.length && isW(cs[c])) c++; while (c < cs.length && !isW(cs[c])) c++; }
  else { while (c > 0 && !isW(cs[c - 1])) c--; while (c > 0 && isW(cs[c - 1])) c--; }
  boxGoto(row, c);
}
function boxFileEdge(toEnd) {
  const t = getActiveTab(); if (!t) return;
  if (!t.colSel) startColumnSelect(t.cursor.row, t.cursor.col);
  const col = t.colActiveCol !== undefined ? t.colActiveCol : t.colSel.c1;
  boxGoto(toEnd ? t.lines.length - 1 : 0, col);
}
function boxPage(dir, half) {
  const t = getActiveTab(); if (!t) return;
  if (!t.colSel) startColumnSelect(t.cursor.row, t.cursor.col);
  const lh = parseFloat(getComputedStyle(edContent).lineHeight) || 18;
  const rows = Math.max(1, Math.floor(edContent.clientHeight / lh) - 1) * (half ? 0.5 : 1);
  const row = t.colActiveRow !== undefined ? t.colActiveRow : t.colSel.r1, col = t.colActiveCol !== undefined ? t.colActiveCol : t.colSel.c1;
  boxGoto(row + dir * Math.max(1, Math.floor(rows)), col);
}

/* 列块归一化: r0<=r1, c0<=c1, 且所有边界夹在文档范围内. */
function colSelRect(t) {
  const cs = t.colSel;
  const lastRow = Math.max(0, t.lines.length - 1);
  const r0 = Math.max(0, Math.min(cs.r0, cs.r1, lastRow));
  const r1 = Math.max(r0, Math.min(Math.max(cs.r0, cs.r1), lastRow));
  // 列边界可能落在行尾之外 (End 键), 取所有参与行的最长长度, 再夹住.
  let maxLen = 0;
  for (let r = r0; r <= r1; r++) maxLen = Math.max(maxLen, charLen(t.lines[r] || ""));
  const c0 = Math.max(0, Math.min(cs.c0, cs.c1, maxLen));
  const c1 = Math.max(c0, Math.min(Math.max(cs.c0, cs.c1), maxLen));
  return { r0, r1, c0, c1 };
}

/* 列块输入: 把 text 里的每一行分别插入到对应行的列块起点.
   - text 含 \n = 多行内容按行分配 (Sakura 的「一次性给多行添加不同内容」)
   - text 不含 \n = 同一份内容插入到每一行 (最常见的批量加前缀 / 加引号场景)
   - 短行会自动补空格再插入, 保证列对齐 (C-06); 不会截断已有内容. */
function columnInsert(text) {
  const t = getActiveTab();
  if (!t || !t.colSel) return;
  const { r0, r1, c0, c1 } = colSelRect(t);
  const parts = String(text).split("\n");
  snapshot(t);
  // 选区里已有的内容要被覆盖掉 (Sakura: 在矩形选区里输入 = 先删掉选中的矩形内容, 再每行插入), 不是插在它前面
  if (c1 > c0) {
    for (let r = r0; r <= r1; r++) {
      const l = t.lines[r] || "";
      t.lines[r] = charSlice(l, 0, c0) + charSlice(l, c1, charLen(l));
    }
  }
  for (let r = r0; r <= r1; r++) {
    const add = parts[r - r0] !== undefined ? parts[r - r0] : parts[parts.length - 1];
    if (!add) continue;
    const line = t.lines[r] || "";
    // 短行补空格: 不然插入点会随行长漂移, 列块就对不齐了.
    const padded = charLen(line) < c0 ? line + " ".repeat(c0 - charLen(line)) : line;
    t.lines[r] = charSlice(padded, 0, c0) + add + charSlice(padded, c0, charLen(padded));
  }
  const adv = Math.max(1, charLen(parts[0] || ""));   // 插入点右移「刚插入的字符数」列 (IME 一次上屏多个字时也对), 可以接着连续输入
  t.colSel = { r0, c0: c0 + adv, r1, c1: c0 + adv };
  t.dirty = true;
  renderVim(t);
  updateCaret(false);
  syncColumnSelectUI(t);
  setTip("列块插入 " + (r1 - r0 + 1) + " 行");
}

/* 列块退格: 每一行在列块起点前删掉一个字符. */
function columnBackspace() {
  const t = getActiveTab();
  if (!t || !t.colSel) return;
  const { r0, r1, c0, c1 } = colSelRect(t);
  if (c1 > c0) { columnDelete(); t.colSel = { r0, c0, r1, c1: c0 }; syncColumnSelectUI(t); renderVim(t); return; }   // 有选中的矩形内容: 退格 = 删掉它 (保留插入点)
  snapshot(t);
  for (let r = r0; r <= r1; r++) {
    const line = t.lines[r] || "";
    if (charLen(line) <= c0) continue;
    t.lines[r] = charSlice(line, 0, c0 - 1) + charSlice(line, c0, charLen(line));
  }
  t.colSel = { r0, c0: Math.max(0, c0 - 1), r1, c1: Math.max(0, c0 - 1) };
  t.dirty = true;
  renderVim(t);
  updateCaret(false);
  syncColumnSelectUI(t);
}

function clearColumnSelect(t) {
  if (t) t.colSel = null;
  syncColumnSelectUI(t);
}

function columnSelectedText(t) {
  const cs = t.colSel;
  if (!cs) return "";
  const { r0, r1, c0, c1 } = colSelRect(t);
  const out = [];
  for (let r = r0; r <= r1; r++) {
    const line = t.lines[r] || "";
    // 塌缩列块 (c1 === c0) 取该列单个字符; 否则取 [c0, c1) 区间.
    // 用 charSlice 而非 String.slice: 后者按 UTF-16 码元切, 会在代理对上劈开半个字符.
    out.push(c1 === c0 ? "" : charSlice(line, c0, c1));
  }
  return out.join("\n");
}
// Sakura: 矩形复制到剪贴板时每一行都以换行结尾 (含最后一行)
const columnClipText = (t) => columnSelectedText(t) + "\n";

// 列块删除 (整块挖空)
function columnDelete() {
  const t = getActiveTab();
  if (!t || !t.colSel) return;
  const { r0, r1, c0, c1 } = colSelRect(t);
  snapshot(t);
  for (let r = r0; r <= r1; r++) {
    const line = t.lines[r] || "";
    t.lines[r] = charSlice(line, 0, c0) + charSlice(line, c1, charLen(line));
  }
  t.colSel = null; t.cursor = { row: r0, col: Math.min(c0, charLen(t.lines[r0] || "")) };   // Sakura: 删除后光标在矩形左上角
  t.dirty = true;
  renderVim(t);
  setTip("列块已删除 (" + (r1 - r0 + 1) + "行 ×" + (c1 - c0) + "列)");
}

// 列块替换 (每行不同内容用 \n 分隔)
function columnPrompt() {
  const t = getActiveTab();
  if (!t || !t.colSel) { setTip("先用 Alt+拖选 建立列块选区"); return; }
  const cur = columnSelectedText(t);
  const text = prompt("列块替换为 (多行用换行分隔):", cur);
  if (text === null) return;
  const parts = text.split("\n");
  snapshot(t);
  const { r0, r1, c0, c1 } = colSelRect(t);
  const width = c1 - c0;
  for (let r = r0; r <= r1; r++) {
    const line = t.lines[r] || "";
    // 替换文本不足宽度时补空格, 保持列对齐; 超宽则截断 (与 Sakura 的等宽替换一致).
    const repl = (parts[r - r0] !== undefined ? parts[r - r0] : "").padEnd(width).slice(0, width);
    t.lines[r] = charSlice(line, 0, c0) + repl + charSlice(line, c1, charLen(line));
  }
  t.colSel = null;
  t.dirty = true;
  renderVim(t);
  syncColumnSelectUI(t);
  setTip("列块已替换");
}

/* ---------- C3. 自动补全 (Ctrl+Space / Tab 触发) ---------- */
/* 无 LSP; 基于当前文件已出现的标识符 + 语言关键字, 做前缀匹配. */

function completionCandidates(t, prefix) {
  const lang = t.language || Syntax.detectLanguage(t.path || "");
  const seen = new Map();
  // 关键字优先
  (Syntax.KEYWORDS[lang] || []).forEach((k) => seen.set(k, "kw"));
  // 标准库/内建常用项 (关键字表不含 clone/println 这类)
  (Syntax.BUILTINS[lang] || []).forEach((k) => { if (!seen.has(k)) seen.set(k, "bi"); });
  // 当前文件里的标识符
  for (const line of t.lines) {
    for (const m of line.matchAll(/[A-Za-z_][A-Za-z0-9_]{2,}/g)) {
      if (!seen.has(m[0])) seen.set(m[0], "id");
    }
  }
  const p = prefix.toLowerCase();
  const rank = { kw: 0, bi: 1, id: 2 };
  return [...seen.keys()]
    .filter((w) => w.toLowerCase().startsWith(p) && w !== prefix)
    .sort((a, b) => rank[seen.get(a)] - rank[seen.get(b)] || a.length - b.length)
    .slice(0, 40);
}



async function showCompletion() {
  const t = getActiveTab();
  if (!t) return;
  const line = t.lines[t.cursor.row] || "";
  const m = /[A-Za-z_][A-Za-z0-9_]*$/.exec(line.slice(0, t.cursor.col));
  const prefix = m ? m[0] : "";
  const list = completionCandidates(t, prefix);
  if (list.length === 0) { setTip("无补全候选 (前缀: " + (prefix || "空") + ")"); return; }
  COMPLETE_STATE = { list, idx: 0, prefix };
  renderCompletionPopup();
}

function renderCompletionPopup() {
  // 每次按键都会重建浮层: 先记下旧浮层的滚动偏移, 新浮层建好后恢复, 再保证当前项可见 (否则 Ctrl+N 翻过第 11 项后高亮行滚出视野).
  const old = document.getElementById("completion-popup");
  const keepScroll = old ? old.scrollTop : 0;
  old?.remove();
  const t = getActiveTab();
  if (!t || COMPLETE_STATE.list.length === 0) return;
  const pop = document.createElement("div");
  pop.id = "completion-popup";
  pop.className = "show";
  COMPLETE_STATE.list.forEach((cand, i) => {
    const row = document.createElement("div");
    row.className = "cmp-row" + (i === COMPLETE_STATE.idx ? " active" : "");
    row.textContent = cand;
    row.addEventListener("click", () => { COMPLETE_STATE.idx = i; applyCompletion(); });
    row.addEventListener("mouseenter", () => {
      COMPLETE_STATE.idx = i;
      pop.querySelectorAll(".cmp-row").forEach((r, j) => r.classList.toggle("active", j === i));
    });
    pop.appendChild(row);
  });
  document.getElementById("editor-area").appendChild(pop);
  // 定位到光标下方
  const r = edContent.getBoundingClientRect();
  pop.style.top = (r.top + 24 + t.cursor.row * 18 - edContent.scrollTop) + "px";
  pop.style.left = (r.left + 8 + t.cursor.col * 7) + "px";
  // 夹在 #ed-content 内 (不是 #editor-area: 它还包含 50px 的页签条和面包屑, 编辑区矮时浮层会盖住页签、面包屑和光标行):
  // 光标行下方放得下就放下方, 否则取下方/上方中较大的一侧, 并把 max-height 收到那一侧的空间 (最小 40px, 最大 220px); 靠右时左移 (不再被 #app 的 overflow:clip 截掉).
  const lineTop = r.top + 4 + t.cursor.row * 18 - edContent.scrollTop;
  const bottom = r.top + edContent.clientHeight;
  const below = bottom - 4 - (lineTop + 20), above = lineTop - (r.top + 4);
  pop.style.maxHeight = "none";
  const nat = Math.min(220, pop.scrollHeight + 2);
  let hh, top;
  if (below >= nat || below >= above) { hh = Math.max(40, Math.min(220, below)); top = lineTop + 20; }
  else { hh = Math.max(40, Math.min(nat, above)); top = lineTop - hh; }
  // 光标行滚出可视区时仍夹回 #ed-content 内 (沿用"永不出屏"的行为); 高度也不超过 #ed-content 的可用高度
  hh = Math.min(hh, Math.max(40, edContent.clientHeight - 8));
  top = Math.max(r.top + 4, Math.min(top, bottom - 4 - hh));
  pop.style.maxHeight = hh + "px";
  pop.style.top = top + "px";
  const q = pop.getBoundingClientRect();
  if (q.right > window.innerWidth - 4) {
    pop.style.left = Math.max(4, window.innerWidth - 4 - q.width) + "px";
  }
  pop.scrollTop = keepScroll;
  const act = pop.querySelector(".cmp-row.active");
  if (act) {
    if (act.offsetTop < pop.scrollTop) pop.scrollTop = act.offsetTop;
    else if (act.offsetTop + act.offsetHeight > pop.scrollTop + pop.clientHeight) pop.scrollTop = act.offsetTop + act.offsetHeight - pop.clientHeight;
  }
}

function applyCompletion() {
  const t = getActiveTab();
  const cand = COMPLETE_STATE.list[COMPLETE_STATE.idx];
  if (!t || !cand) return;
  const line = t.lines[t.cursor.row] || "";
  const head = line.slice(0, t.cursor.col).replace(/[A-Za-z_][A-Za-z0-9_]*$/, "");
  const tail = line.slice(t.cursor.col);
  t.lines[t.cursor.row] = head + cand + tail;
  t.cursor.col = charLen(head) + charLen(cand);
  t.dirty = true;
  renderVim(t);
  document.getElementById("completion-popup")?.remove();
  COMPLETE_STATE = { list: [], idx: -1, prefix: "" };
}

function completionNext(delta) {
  if (COMPLETE_STATE.list.length === 0) return false;
  COMPLETE_STATE.idx = (COMPLETE_STATE.idx + delta + COMPLETE_STATE.list.length) % COMPLETE_STATE.list.length;
  renderCompletionPopup();
  return true;
}

// 在当前文件里查找定义行 (gotoDefinition 的本地版)
function gotoDefinitionLocal() {
  const t = getActiveTab();
  if (!t) return;
  const line = t.lines[t.cursor.row] || "";
  const m = /[A-Za-z_][A-Za-z0-9_]*$/.exec(line.slice(0, t.cursor.col));
  if (!m) { setTip("光标处无标识符"); return; }
  const sym = m[0];
  const re = new RegExp("(^|[^A-Za-z0-9_])(fn|struct|enum|impl|trait|type|func|class|def|function|interface|const|let)\\s+" +
    sym + "\\b");
  for (let r = 0; r < t.lines.length; r++) {
    if (re.test(t.lines[r])) {
      t.cursor = { row: r, col: Math.max(0, t.lines[r].indexOf(sym)) };
      renderVim(t);
      setTip("定义 @ Ln " + (r + 1) + ": " + t.lines[r].trim().slice(0, 50));
      return;
    }
  }
  // 退化: 找首次出现
  for (let r = 0; r < t.lines.length; r++) {
    if ((t.lines[r] || "").includes(sym)) {
      t.cursor = { row: r, col: t.lines[r].indexOf(sym) };
      renderVim(t);
      setTip("首次出现 @ Ln " + (r + 1));
      return;
    }
  }
  setTip("未找到 " + sym + " 的定义");
}

// ===== 最近项目 (「最近使用」) =====
const RECENT_KEY = "ide1.0.recent.v1";
const RECENT_MAX = 12;

function recentList() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }
  catch (_) { return []; }
}
function pushRecent(path) {
  if (!path) return;
  const list = recentList().filter((r) => r.path !== path);
  list.unshift({ path, at: Date.now() });
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX))); }
  catch (_) { /* 隐私模式: 存储不可用, 只是不记「最近使用」, 不能让打开/保存因此失败 */ }
}
function clearRecent() {
  localStorage.removeItem(RECENT_KEY);
  closeModal();
  setTip("最近项目已清空");
  const box = document.querySelector("[data-submenu='recent'] .submenu-dropdown");
  if (box) {
    const empty = box.querySelector(".menu-empty");
    if (empty) empty.textContent = "无最近文件";
  }
}
function showRecent() {
  const list = recentList();
  if (list.length === 0) { setTip("无最近项目"); return; }
  const rows = list.map((r, i) => {
    const when = new Date(r.at).toLocaleString("zh-CN");
    return '<div class="opt-row" data-recent="' + i + '">' + escapeHtml(when + "  " + r.path) + "</div>";
  }).join("");
  openModal({ title: "最近项目 (" + list.length + ")", bodyHTML: rows,
    buttons: [{ label: "清空历史", cmd: "recent-clear" }, { label: "关闭", cmd: "modal-close" }] });
  mdBody.querySelectorAll("[data-recent]").forEach((el) =>
    el.addEventListener("click", () => {
      const r = list[parseInt(el.dataset.recent, 10)];
      closeModal();
      if (r) openFile(r.path);
    }));
}

// ===== Help =====
function showHelp() {
  try {
    // atob() 只解 base64, 返回 latin-1 字节串; 必须再按 UTF-8 解码,
    // 否则中文 wiki 全是 "æ®..." 乱码.
    const bin = atob(WIKI_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const txt = new TextDecoder("utf-8").decode(bytes);
    openModal({ title: "IDE1.0 — 完整 wiki", body: txt, buttons: [{ label: "关闭", cmd: "modal-close" }] });
  } catch (e) {
    openModal({ title: "帮助", body: String(e) });
  }
}

// ===== Command router =====
// 所有 [data-cmd] 统一走 dispatchCommand (switch-case 单一事实来源).
// 之前这里是一份影子 router, 只认旧命名且 toggle-bottom 分支会 click 自己 -> 死循环,
// 同时抢在 .menu-row 委托之前, 导致 dispatchCommand 永远收不到命令.
document.addEventListener("click", (e) => {
  // 菜单行有自己的委托 (处理嵌套 submenu), 这里跳过避免双派发
  if (e.target.closest(".menu-row")) return;
  const btn = e.target.closest("[data-cmd]");
  if (!btn) return;
  // menu-item 是菜单容器 (点它只展开下拉, 真正的命令在 .menu-row 上),
  // 所以要排除. 但 open-btn 是**真按钮** —— 欢迎页的"打开文件夹"就靠它,
  // 之前一起被排除掉了, 导致欢迎页按钮点了没反应 (用例: 项目打不开,
  // #side-body 一直显示"未打开项目").
  if (btn.classList.contains("menu-item")) return;
  dispatchCommand(btn.dataset.cmd);
});

// ===== Global keyboard =====
// Ctrl+K chord 状态 (菜单 "打开文件夹 (Ctrl+K O)" 的声明需要它).
let ctrlKChord = false;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
  if (e.key === "F1") { e.preventDefault(); showHelp(); }
  if (e.key === "F12") { e.preventDefault(); gotoDefinitionLocal(); }
  // 书签: Ctrl+F2 加/删书签, F2 跳下一个, Shift+F2 上一个.
  // 菜单里标了这些快捷键 (data-shortcut="Ctrl+F2") 但键盘没接 ——
  // 与 dd 同类问题: 声明了但没实现.
  if (e.key === "F2") {
    e.preventDefault();
    if (e.shiftKey) bookmarkPrev(); else bookmarkNext();
    return;
  }
  if (e.ctrlKey && e.key === "F2") { e.preventDefault(); toggleBookmark(); return; }

  // Alt / Ctrl+Alt + 方向键 + Home/End = 矩形选区 (Sakura F_UP_BOX ~ F_GOLINEEND_BOX).
  // 必须放在下面的 Ctrl 分支**之前**: 那里的 `e.ctrlKey && !e.shiftKey` 会把
  // Ctrl+Alt+↑ 当普通 Ctrl 键处理掉, 而 Ctrl+Shift+U/E/K 那几个新键位也接不到
  // (它们带 Shift, 那个分支本来就漏了 Shift 变体).
  if (e.altKey && !e.metaKey) {
    if (e.shiftKey && !e.ctrlKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {   // 上移/下移行 (Ctrl+Shift+↑↓ 归 Sakura 的选 2 行)
      e.preventDefault(); moveLines(e.key === "ArrowUp" ? -1 : 1); return;
    }
    const step = e.ctrlKey ? 2 : 1;   // Ctrl+Alt+↑↓ = 矩形上下移 2 行 (F_UP2_BOX / F_DOWN2_BOX)
    if (e.key === "ArrowUp")    { e.preventDefault(); boxMove(-step, 0); return; }
    if (e.key === "ArrowDown")  { e.preventDefault(); boxMove(step, 0); return; }
    if (e.key === "ArrowLeft")  { e.preventDefault(); if (e.ctrlKey) boxWord(-1); else boxMove(0, -1); return; }       // Ctrl+Alt+←→ = 单词 (F_WORDLEFT_BOX / F_WORDRIGHT_BOX)
    if (e.key === "ArrowRight") { e.preventDefault(); if (e.ctrlKey) boxWord(1); else boxMove(0, 1); return; }
    if (e.key === "Home")       { e.preventDefault(); if (e.ctrlKey) boxFileEdge(false); else boxEdge(false); return; }   // Ctrl+Alt+Home/End = 文件首/尾 (F_GOFILETOP_BOX)
    if (e.key === "End")        { e.preventDefault(); if (e.ctrlKey) boxFileEdge(true); else boxEdge(true); return; }
    if (e.key === "PageUp")     { e.preventDefault(); boxPage(-1, e.ctrlKey); return; }                                // Alt+PgUp/PgDn 整页, Ctrl+Alt 半页
    if (e.key === "PageDown")   { e.preventDefault(); boxPage(1, e.ctrlKey); return; }
  }

  // Ctrl+Shift 增删系列 (Sakura F_CUT_LINE / F_LineCutToStart / F_LineDeleteToStart /
  // F_LineDeleteToEnd), 键位照抄上游 CKeyBind.cpp 默认表:
  //   Ctrl+U 剪切到行首 / Shift+Ctrl+U 删到行首 / Shift+Ctrl+K 删到行末 / Shift+Ctrl+E 删除整行.
  // Ctrl+K 是「打开文件夹」的 chord 前缀 (菜单声明 Ctrl+K O), 加 Shift 不冲突,
  // 所以「删到行末」保住了上游键位 —— 只有裸 Ctrl+K 被占用.
  if (e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === "e") { e.preventDefault(); deleteLine(); return; }   // F_DELETE_LINE, 与 Ctrl+D 同语义
    if (k === "u") { e.preventDefault(); deleteToLineStart(); return; }   // F_LineDeleteToStart = 删, 不是剪
    if (k === "k") { e.preventDefault(); deleteToLineEnd(); return; }
  }

  if (e.ctrlKey && e.key.toLowerCase() === "s") { e.preventDefault(); saveByKey(e); }
  if (e.ctrlKey && e.shiftKey) {
    const k = e.key.toLowerCase();
    if (k === "f") { e.preventDefault(); showSidePane("search"); return; }
    if (k === "r") { e.preventDefault(); macroStop(); return; }   // 与菜单一致: 开始/停止切换
    // Ctrl+Shift+O = 大纲 (与视图菜单 data-shortcut 一致). 原先绑的是 openFolder(),
    // 而 "打开文件夹" 已有 菜单行 + Ctrl+K O —— 快捷键与菜单声明矛盾, 菜单栏显示的
    // Ctrl+Shift+O 按下去却打开文件夹 (web-editor.spec 大纲用例 红 的根因).
    if (k === "o") { e.preventDefault(); showOutline(); return; }
    // ⚠️ 这三条原本写在下面的 `e.ctrlKey && !e.shiftKey` 分支里, 而它们全都要 Shift ——
    // 那条分支进不去, 所以 Ctrl+Shift+Up/Down/Backspace 一直是**死代码**
    // (菜单上写着「上移行 / 下移行 / 删除上方行」, 实际按了没反应).
    // 移到这个分支才真正生效.
    if (e.key === "Backspace") { e.preventDefault(); deleteLineUp(); return; }
  }
  if (e.ctrlKey && !e.shiftKey) {
    const k = e.key.toLowerCase();
    // Ctrl+K 是 chord 前缀 (菜单里 "打开文件夹 (Ctrl+K O)" 的声明一直无实现).
    // 顺序说明: chord 分支必须在极简布局 Ctrl+O 之前, 否则 Ctrl+K O 会被后者截走.
    if (ctrlKChord) {
      ctrlKChord = false;
      if (k === "o") { e.preventDefault(); openFolder(); return; }
      return;
    }
    // Sakura 增删改 (无 Shift 变体): Ctrl+U 剪切到行首 / Ctrl+E 剪切整行 /
    // Ctrl+Backspace 删到词首. 必须排在 Ctrl+K chord 之后 —— 否则 Ctrl+K 会被
    // 提前吃掉, 而 Ctrl+Backspace 的 e.key 是 "Backspace" 不是字母, 不参与字母匹配.
    if (k === "u") { e.preventDefault(); cutToLineStart(); return; }
    if (k === "e") { e.preventDefault(); cutLine(); return; }
    if (e.key === "Backspace") { e.preventDefault(); deleteToWordStart(); return; }
    // 极简布局的 Ctrl+N 新建 / Ctrl+O 打开 (菜单上标了这两个快捷键). 补全列表正显示时 Ctrl+N 让给「下一个候选」(编辑区那边已处理)
    if (!e.altKey && layoutPreset() === "min") {
      if (k === "n" && COMPLETE_STATE.list.length === 0) { e.preventDefault(); createNewFile(); return; }
      if (k === "o") { e.preventDefault(); promptOpenFile(); return; }
    }
    if (k === "f") { e.preventDefault(); openFind(); return; }
    if (k === "h") { e.preventDefault(); openReplace(); return; }
    if (k === "g") { e.preventDefault(); openGrep(); return; }
    if (k === "j" && e.shiftKey) { e.preventDefault(); joinWithPrev(); return; }
    if (k === "j") { e.preventDefault(); openGotoLine(); return; }
    if (k === "0") { e.preventDefault(); setFontSize(14); return; }
    if (k === "=" || k === "+") { e.preventDefault(); zoomBy(1); return; }
    if (k === "-") { e.preventDefault(); zoomBy(-1); return; }
    if (e.shiftKey && k === "v") { e.preventDefault(); showClipHistory(); return; }
    if (e.shiftKey && k === "d") { e.preventDefault(); copyLinesUp(); return; }
    // (Ctrl+Shift 的三个键位 — 上移行 / 下移行 / 删除上方行 — 已移到上面那个
    //  e.ctrlKey && e.shiftKey 分支; 这条分支里带 Shift 的判断本来就永远进不去.)
    if (e.key === "Delete") { e.preventDefault(); deleteToWordEnd(); return; }       // Sakura: Ctrl+Del = 删除到单词右端
    if (k === "a") { e.preventDefault(); selectAllText(); return; }
    if (k === "c") { e.preventDefault(); copySelection(); return; }
    if (k === "x") { e.preventDefault(); cutSelection(); return; }
    if (k === "v") { return; }   // 由 paste 事件处理 (系统剪贴板)
    if (k === "w") { e.preventDefault(); if (activeTabId && confirmClose(getActiveTab())) closeTab(activeTabId); return; }
    if (k === ",") { e.preventDefault(); openSettings(); return; }
  }
  if (e.shiftKey && !e.ctrlKey && !e.altKey) {
    if (e.key === "F3") { e.preventDefault(); findPrev(); return; }
    if (e.key === "F4") { e.preventDefault(); findNext(); return; }
    // Shift+F6 = 列块选区模式 (Sakura 的标准入口; Alt+拖动 是等价的手势).
    // 光标已在列块里时再按 = 退出, 与 Sakura 的开关语义一致.
    if (e.key === "F6") {
      e.preventDefault();
      const tv = getActiveTab();
      if (!tv) return;
      if (tv.colSel) { clearColumnSelect(tv); setMode("INSERT"); edContent.focus({ preventScroll: true }); setTip("已退出列块模式"); }
      else { startColumnSelect(tv.cursor.row, tv.cursor.col); setMode("INSERT"); setTip("列块模式: Shift+F6 退出, 方向键选区, 直接输入批量插入"); }
      renderVim(tv);
      return;
    }
  }
  if (e.key === "F3") { e.preventDefault(); findNext(); return; }
  if (e.ctrlKey && e.key === "`") {
    // Ctrl+` = 终端开关: 折叠时展开并切到 Terminal; 已展开时也切回 Terminal.
    // 不做「再次按下即折叠」—— 折叠交给面板上的「折叠」按钮 (data-cmd=bottom-toggle).
    e.preventDefault();
    const bp = document.getElementById("bottom-panel");
    if (bp) bp.setAttribute("data-collapsed", "false");
    switchBottomPane("terminal-pane");     // min 布局下面板整块隐藏: 里面会先把它亮出来
  }
  if (e.key === "Escape") edContent.focus({ preventScroll: true });
});


/* ===== Sakura 键盘移动 / 范围选择 / 选区替换式编辑 / 覆盖模式 / 系统剪贴板 =====
   对标 CKeyBind.cpp 默认键位: ←→↑↓ Home End PgUp PgDn, Ctrl+←→ (单词) Ctrl+Home/End (文首/文末)
   Ctrl+PgUp/PgDn (半页) Ctrl+↑↓ (滚动一行) Shift+上述 = 范围选择, Shift+Ctrl+↑↓ = 选 2 行,
   Ins = 插入/覆盖, Ctrl+Ins/Shift+Ins/Shift+Del = 复制/粘贴/剪切. */
let OVERWRITE = false;
let SYS_CLIP_OK = true;       // navigator.clipboard.writeText 成功过吗 (失败就以程序内部剪贴板为准)

function toggleOverwrite() {
  OVERWRITE = !OVERWRITE;
  const el = document.getElementById("s-ovr");
  if (el) el.textContent = OVERWRITE ? "上書" : "挿入";
  setTip(OVERWRITE ? "覆盖模式" : "插入模式");
}

function selNonEmpty(t) { return !!(t.sel && !(t.sel.r0 === t.sel.r1 && t.sel.c0 === t.sel.c1)); }

// 选区的锚点: 优先用记下的 selAnchor, 否则由选区和光标位置推出 (Ctrl+A / 鼠标选出来的没有记)
function selAnchorOf(t) {
  if (t.selAnchor && selNonEmpty(t)) return t.selAnchor;
  if (!selNonEmpty(t)) return { row: t.cursor.row, col: t.cursor.col };
  const s0 = t.sel, endCol = s0.c1 === Infinity ? charLen(t.lines[s0.r1] || "") : s0.c1;
  const cursorAtEnd = t.cursor.row === s0.r1 && t.cursor.col === endCol;
  return cursorAtEnd ? { row: s0.r0, col: s0.c0 } : { row: s0.r1, col: endCol };
}

// 键盘导航 / 选区编辑. 返回 true = 已处理 (调用方 return).
function handleEditNavKey(e, t, vim) {
  const k = e.key, ctrl = e.ctrlKey, shift = e.shiftKey || !!t.selMode;
  if (k === "Insert") {
    e.preventDefault();
    if (ctrl && !shift) copySelection(); else if (shift && !ctrl) navigator.clipboard ? pasteFromSystemOrInternal() : pasteClipboard(); else toggleOverwrite();
    return true;
  }
  if (k === "Delete" && shift && !ctrl) { e.preventDefault(); cutSelection(); return true; }

  const NAV = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"];
  if (!NAV.includes(k)) {
    // 不是导航键: 有选区时, 输入/删除/回车 先替换(删掉)选区, 然后让原有逻辑继续插入
    if (selNonEmpty(t) && !ctrl) {
      if (k === "Backspace" || k === "Delete") { e.preventDefault(); runEdit(k === "Backspace" ? "backspace" : "delete"); return true; }
      if (k === "Tab") {
        e.preventDefault();
        if (t.sel.r0 !== t.sel.r1) { if (shift) indentSelection(true); else indentSelection(false); return true; }
        deleteSelection(t); t.selAnchor = null; insertCharMulti(vim ? "  " : "\t"); return true;
      }
      if (k === "Enter" || (k.length === 1 && !e.metaKey)) { replaceSelection(t); }
    }
    if (!/^(Shift|Control|Alt|Meta|CapsLock)$/.test(k)) delete t.goalCol;
    return false;
  }

  // Ctrl+↑↓ = 文本滚动一行 (光标不动): 纯视图操作, 留在前端
  if ((k === "ArrowUp" || k === "ArrowDown") && ctrl && !shift) {
    e.preventDefault();
    edContent.scrollTop += (k === "ArrowUp" ? -1 : 1) * (parseFloat(getComputedStyle(edContent).lineHeight) || 18);
    return true;
  }
  // 其余移动 / 范围选择的语义在 Rust (editcore::nav), 前端交上光标周围几行与选区, 套回结果
  e.preventDefault();
  runNav(t, vim, { key: k, ctrl, shift });
  return true;
}

// 移动请求: 只带光标周围需要的几行 (±2 行 / 末行 / PageUp·Down 的目标行), 不传整篇
function navRequest(t, key, ctrl, shift) {
  const last = Math.max(0, t.lines.length - 1), { row, col } = t.cursor, page = pageRows();
  const need = new Set([row - 2, row - 1, row, row + 1, row + 2, last]);
  if (key === "PageUp" || key === "PageDown") need.add(Math.max(0, Math.min(last, row + (key === "PageUp" ? -1 : 1) * (ctrl ? Math.max(1, Math.floor(page / 2)) : page))));
  const rows = [...need].filter((r) => r >= 0 && r <= last).map((r) => [r, t.lines[r] || ""]);
  const had = selNonEmpty(t);
  const sel = had ? [t.sel.r0, t.sel.c0, t.sel.r1, t.sel.c1 === Infinity ? charLen(t.lines[t.sel.r1] || "") : t.sel.c1] : null;
  const a = shift ? selAnchorOf(t) : null;
  return { key, ctrl, shift, row, col, goal_col: t.goalCol === undefined ? null : t.goalCol, sel, anchor: a ? [a.row, a.col] : null, total_rows: t.lines.length, rows, page_rows: page };
}
function runNav(t, vim, k) {
  return enqueueInput(async () => {
    if (getActiveTab() !== t) return;
    const had = selNonEmpty(t);
    let res;
    try { res = await invoke("nav_step", navRequest(t, k.key, k.ctrl, k.shift)); }
    catch (err) { setTip("移动失败: " + err.message); return; }
    if (!res || res.row === undefined) return;
    if (res.goal_col === null || res.goal_col === undefined) delete t.goalCol; else t.goalCol = res.goal_col;
    t.cursor = { row: res.row, col: res.col };
    t.sel = res.sel ? { r0: res.sel[0], c0: res.sel[1], r1: res.sel[2], c1: res.sel[3] } : null;
    t.selAnchor = res.anchor ? { row: res.anchor[0], col: res.anchor[1] } : null;

    updateCaret(true);

  });
}

/* 输入顺序闸门: 经桥执行的移动是异步的, 它没落地之前到来的按键 / 输入不能抢先执行 (否则会在旧光标处插字).
   闸门开着时 (有未完成的桥操作), 后到的 keydown / beforeinput 先拦下排队, 前一个落地后按原顺序重放。 */
const INPUT_Q = []; let INPUT_BUSY = false, INPUT_REPLAY = false;
let INPUT_N = 0, OPCHAIN = Promise.resolve();
function enqueueInput(fn) {
  INPUT_N++; INPUT_BUSY = true;                       // 同步置位: 之后到的按键立刻被闸门拦下
  const p = OPCHAIN.then(async () => {
    try { await fn(); }
    finally { INPUT_N--; if (INPUT_N === 0) { INPUT_BUSY = false; await drainInput(); } }
  });
  OPCHAIN = p.catch(() => {});
  return trackOp(p);
}
async function drainInput() {
  while (INPUT_Q.length && !INPUT_BUSY) {
    const ev = INPUT_Q.shift();
    INPUT_REPLAY = true;
    try { replayInput(ev); } catch (_) { /* 单个事件失败不影响后面的 */ } finally { INPUT_REPLAY = false; }
    if (INPUT_BUSY) return;   // 重放又启动了桥操作: 它结束时自己的 drain 会接着处理队列
  }
}
function replayInput(ev) {
  if (ev.type === "keydown") edContent.dispatchEvent(new KeyboardEvent("keydown", { key: ev.key, code: ev.code, ctrlKey: ev.ctrlKey, shiftKey: ev.shiftKey, altKey: ev.altKey, metaKey: ev.metaKey, bubbles: true, cancelable: true }));
  else edContent.dispatchEvent(new InputEvent("beforeinput", { data: ev.data, inputType: ev.inputType, bubbles: true, cancelable: true }));
}
for (const type of ["keydown", "beforeinput"]) {
  edContent.addEventListener(type, (e) => {
    if (INPUT_REPLAY || !(INPUT_BUSY || INPUT_Q.length)) return;
    if (type === "keydown" && /^(Shift|Control|Alt|Meta|CapsLock)$/.test(e.key)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    INPUT_Q.push({ type, key: e.key, code: e.code, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey, data: e.data, inputType: e.inputType });
  }, true);
}

// 系统剪贴板: 复制时同时写系统剪贴板 (别的程序能粘), 粘贴走浏览器的 paste 事件 (不需要权限弹窗)
function writeSystemClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { SYS_CLIP_OK = true; }, () => { SYS_CLIP_OK = false; });
    } else SYS_CLIP_OK = false;
  } catch (_) { SYS_CLIP_OK = false; }
}
function pasteFromSystemOrInternal() {
  try {
    navigator.clipboard.readText().then((s) => pasteText(s || CLIPBOARD), () => pasteClipboard());
  } catch (_) { pasteClipboard(); }
}
document.addEventListener("paste", (e) => {
  const tgt = e.target;
  if (tgt && tgt.closest && tgt.closest("input, textarea, [contenteditable=true]")) return;   // 对话框输入框用浏览器默认粘贴
  const t = getActiveTab();
  if (!t) return;
  e.preventDefault();
  let text = "";
  try { text = e.clipboardData ? e.clipboardData.getData("text/plain") : ""; } catch (_) {}
  if (!SYS_CLIP_OK || !text) text = CLIPBOARD || text;
  pasteText(text);
});


/* ===== 日文 / 中文输入法 (IME) =====
   #ed-content 是 contenteditable="plaintext-only": 浏览器因此为它弹出 IME 候选窗、做组合输入 (预编辑文字
   直接显示在光标处)。除组合输入外的所有浏览器自带编辑 (输入、删除、拖放、撤销…) 都在 beforeinput 里拦掉,
   文档仍然只由我们的命令修改。组合结束 (compositionend) 时: 把浏览器塞进 DOM 的预编辑文字重绘掉,
   再把上屏文字当作一次普通插入 (走撤销栈, 替换选区, 多光标…)。 */
let IME_ACTIVE = false;

// t.cursor 对应的 DOM 位置 (和 caretRect 同一套换算; 整篇单文本节点 / 每行一个 .hl-row 两种形态)
function domPointAt(t, row = t.cursor.row, col = t.cursor.col) {
  const line = t.lines[row] || "";
  const u = u16Index(line, col);
  const only = edContent.firstChild;
  if (only && only.nodeType === 3 && edContent.childNodes.length === 1) {
    let off = u;
    for (let r = 0; r < row; r++) off += (t.lines[r] || "").length + 1;
    return { node: only, off: Math.min(off, only.length) };
  }
  const rowEl = rowElAt(row);
  if (!rowEl) return null;
  const tw = document.createTreeWalker(rowEl, NodeFilter.SHOW_TEXT);
  let rem = u, n, node = null, off = 0;
  while ((n = tw.nextNode())) { node = n; if (rem <= n.length) { off = rem; break; } rem -= n.length; off = n.length; }
  return node ? { node, off } : { node: rowEl, off: 0 };
}

if (edContent) {
  edContent.addEventListener("compositionstart", () => {
    const t = getActiveTab();
    IME_ACTIVE = true;
    if (!t) return;
    if (t.colSel) { t.colSel = null; syncColumnSelectUI(t); }
    if (selNonEmpty(t)) { replaceSelection(t); paintActive(); }   // 输入法上屏要替换选区: 先清掉
    const pt = domPointAt(t);
    if (pt) { const sel = getSelection(), rg = document.createRange(); rg.setStart(pt.node, pt.off); rg.collapse(true); sel.removeAllRanges(); sel.addRange(rg); }
    const c = document.getElementById("caret"); if (c) c.classList.remove("on");     // 预编辑期间用浏览器自己的插入符
  });
  edContent.addEventListener("compositionend", (e) => {
    IME_ACTIVE = false;
    const t = getActiveTab();
    const data = e.data || "";
    try { getSelection().removeAllRanges(); } catch (_) {}
    if (!t) return;
    paintActive();                                 // 丢掉浏览器塞进 DOM 的预编辑文字, 回到由 t.lines 驱动的画面
    for (const ch of chars(data)) insertCharMulti(ch);
    updateCaret(true);
  });
  // 有 keydown 紧跟的 insertText 说明按键已由键盘处理器决定过去留 (比如 Vim NORMAL 的前缀键), 不是「没有 keydown 的输入」
  let lastKeydownAt = -1e9, lastKeydownKey = "";
  document.addEventListener("keydown", (ev) => { lastKeydownAt = performance.now(); lastKeydownKey = ev.key; }, true);
  edContent.addEventListener("beforeinput", (e) => {
    if (e.inputType === "insertCompositionText" || e.inputType === "deleteCompositionText" || e.inputType === "insertFromComposition") return;   // 只放行输入法组合
    e.preventDefault();                           // 其余浏览器自带编辑一律拦截 (文档只由我们的命令修改)
    // 没有对应 keydown 的文字输入 (语音输入 / 手写 / 软键盘 / 某些输入法直接上屏 / 自动化 insertText): 当作普通输入插入, 不能丢
    if (e.inputType === "insertText" && e.data && !IME_ACTIVE && !(performance.now() - lastKeydownAt < 120 && lastKeydownKey === e.data)) {
      const t = getActiveTab();
      if (!t) return;
      if (t.colSel) { columnInsert(e.data); return; }
      if (selNonEmpty(t)) replaceSelection(t);
      for (const ch of chars(e.data)) insertCharMulti(ch);
    }
  });
}

  "A-;": "insert-date", "A-:": "insert-time",

function cmdLabelOfCombo(c) {

  parts.sort((a, b) => order.indexOf(a) - order.indexOf(b));

// ---- DIFF ----
function diffLines(a, b) {
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let sa = a.length, sb = b.length; while (sa > p && sb > p && a[sa - 1] === b[sb - 1]) { sa--; sb--; }
  const A = a.slice(p, sa), B = b.slice(p, sb), n = A.length, m = B.length;
  if (!n && !m) return [];
  if (!n || !m || n * m > 4e6) return [{ a0: p, a1: p + n, b0: p, b1: p + m }];
  const w = m + 1, dp = new Uint32Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i * w + j] = A[i] === B[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
  const hunks = []; let i = 0, j = 0, cur = null;
  const flush = () => { if (cur) { hunks.push(cur); cur = null; } };
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { flush(); i++; j++; continue; }
    if (!cur) cur = { a0: p + i, a1: p + i, b0: p + j, b1: p + j };
    if (j < m && (i >= n || dp[i * w + j + 1] >= dp[(i + 1) * w + j])) { j++; cur.b1 = p + j; } else { i++; cur.a1 = p + i; }
  }
  flush();
  return hunks;
}

  if (hunks.length) diffList();
}

const TAG_DEF_RE = "^\\s*(?:pub(?:\\([a-z]+\\))?\\s+)?(?:async\\s+)?(?:export\\s+)?(?:fn|function|class|struct|enum|trait|interface|def|type|const|impl|mod)\\s+([A-Za-z_][A-Za-z0-9_]*)";

  const m = new Map();

    if (!m.has(p[0])) m.set(p[0], []);

  }

  const rows = (resp && resp.results) || (Array.isArray(resp) ? resp : []);
  const base = stripVerbatim(root).replace(/[\\/]+$/, "");
  const re = new RegExp(TAG_DEF_RE);

  let n = 0;
  for (const r of rows) {
    const mm = re.exec(String(r.text || "")); if (!mm) continue;
    let f = stripVerbatim(r.path); if (f.toLowerCase().startsWith(base.toLowerCase())) f = f.slice(base.length).replace(/^[\\/]+/, "");

  if (inTauri && window.__TAURI_INTERNALS__) await window.__TAURI_INTERNALS__.invoke("terminal_input", { id: SQLWIN.id, data: text });
  else await fetchApi("/api/terminal_input", { body: { id: SQLWIN.id, data: text } });
}
async function sqlwinPoll() {
  if (!SQLWIN.id || TERM_CHANNEL === "event") return;
  try { const j = await fetchTerminalOutput(SQLWIN.id); if (j && j.chunks) for (const c of j.chunks) sqlwinSink(c); } catch (_) {}
  SQLWIN.timer = setTimeout(sqlwinPoll, 150);
}
function sqlwinEnsureUI() {
  if (SQLWIN.el && document.body.contains(SQLWIN.el)) return SQLWIN.el;
  const w = document.createElement("div");
  w.id = "sql-win";
  w.innerHTML = '<div id="sql-win-head"><span>SQL*Plus</span><span class="gw-spacer"></span>' +
    '<button class="md-btn" data-sw="run" title="执行当前文件 (@文件)">実行</button><button class="md-btn" data-sw="clear">清屏</button>' +
    '<button class="md-btn" data-sw="stop" title="结束会话">终了</button><button class="md-btn" data-sw="close">✕</button></div>' +
    '<pre id="sql-out"></pre><input id="sql-in" placeholder="输入 SQL / 命令, 回车发送 (connect user/pass@db)" spellcheck="false">';
  document.body.appendChild(w);
  SQLWIN.el = w; SQLWIN.out = w.querySelector("#sql-out");
  w.addEventListener("click", async (e) => {
    const b = e.target.closest && e.target.closest("[data-sw]"); if (!b) return;
    const k = b.dataset.sw;
    if (k === "run") sqlplusRunFile();
    else if (k === "clear") SQLWIN.out.textContent = "";
    else if (k === "stop") await sqlwinStop();
    else if (k === "close") w.classList.remove("on");
  });
  const inp = w.querySelector("#sql-in");
  inp.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") { e.preventDefault(); const v = inp.value; inp.value = ""; sqlwinSink(v + "\n"); await sqlwinSend(v + "\r"); }
    else if (e.key === "Escape") { w.classList.remove("on"); edContent.focus({ preventScroll: true }); }
  });
  const head = w.querySelector("#sql-win-head");
  head.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    const mv = (ev) => { w.style.left = Math.max(0, ev.clientX - dx) + "px"; w.style.top = Math.max(0, ev.clientY - dy) + "px"; w.style.bottom = "auto"; };
    const up = () => { document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); };
    document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
  });
  return w;
}
async function sqlwinStop() {
  clearTimeout(SQLWIN.timer);
  if (SQLWIN.id) {
    TERM_SINKS.delete(SQLWIN.id);
    try { if (inTauri && window.__TAURI_INTERNALS__) await window.__TAURI_INTERNALS__.invoke("terminal_close", { id: SQLWIN.id }); else await fetchApi("/api/terminal_close", { body: { id: SQLWIN.id } }); } catch (_) {}
    SQLWIN.id = null;
    sqlwinSink("\n[会话已结束]\n");
  }
}
async function sqlwinOpen() {
  const w = sqlwinEnsureUI(); w.classList.add("on");
  if (!SQLWIN.id) {
    if (inTauri) await setupTerminalChannel();
    try {
      const info = await invoke("terminal_create", {});
      SQLWIN.id = info.id; TERM_SINKS.set(info.id, sqlwinSink);
      sqlwinSink("[" + info.id + " " + (info.shell || "") + "]\n");
      if (TERM_CHANNEL !== "event") sqlwinPoll();
      if (SQLWIN.autostart) await sqlwinSend("sqlplus /nolog\r");
    } catch (e) { sqlwinSink("会话创建失败: " + ((e && e.message) || e) + "\n"); }
  }
  w.querySelector("#sql-in").focus();
}
async function sqlplusRunFile() {
  const t = getActiveTab(); if (!t || !t.path) { setTip("先保存文件"); return; }
  // 路径会被送进交互式 shell/SQL*Plus: 含引号 / 分隔符 / 控制字符的文件名可能逃出引号注入命令, 一律拒绝
  if (/["&|<>^%`$;'\r\n\0]/.test(t.path)) { setTip("文件路径含特殊字符, 为安全起见不执行"); return; }
  await sqlwinOpen();
  if (!SQLWIN.id) return;
  sqlwinSink("@" + t.path + "\n");
  await sqlwinSend('@"' + t.path + '"\r');
  setTip("已在 SQL*Plus 窗口中执行: " + t.path);
}
Object.assign(CFG_CMDS, { "sqlplus-activate": sqlwinOpen, "sqlplus-run": sqlplusRunFile });
window.SQLWIN = SQLWIN;

function placeSubmenu(row) {
  const sub = row && row.querySelector(":scope > .submenu-dropdown");
  if (!sub) return;
  const rr = row.getBoundingClientRect(), vw = innerWidth, vh = innerHeight, pad = 6;
  sub.classList.add("placed");
  sub.style.maxHeight = (vh - pad * 2) + "px";
  const w = sub.offsetWidth, h = sub.offsetHeight;
  let left = rr.right - 2;
  if (left + w > vw - pad) left = Math.max(pad, rr.left - w + 2);               // 右边放不下: 翻到父菜单左边
  let top = rr.top - 4;
  if (top + h > vh - pad) top = Math.max(pad, vh - pad - h);                      // 下边放不下: 上移
  sub.style.left = left + "px"; sub.style.top = top + "px";
  const a = sub.getBoundingClientRect();                                           // 祖先有 backdrop-filter 等时 fixed 相对祖先: 按实际偏差校正
  if (Math.abs(a.left - left) > 1) sub.style.left = (left + (left - a.left)) + "px";
  if (Math.abs(a.top - top) > 1) sub.style.top = (top + (top - a.top)) + "px";
}
document.addEventListener("mouseover", (e) => { const r = e.target.closest && e.target.closest(".menu-row.menu-submenu"); if (r) placeSubmenu(r); }, true);
new MutationObserver((muts) => { for (const m of muts) { const t = m.target; if (t.classList && t.classList.contains("menu-submenu") && t.classList.contains("kb-open")) placeSubmenu(t); } })
  .observe(document.getElementById("menubar"), { attributes: true, subtree: true, attributeFilter: ["class"] });

function setUiLang(l) {
  if (UI_LANGS.indexOf(l) < 0) return;
  UI_LANG = l;
  try { localStorage.setItem("ide10.lang", l); } catch (_) {}
  document.documentElement.setAttribute("lang", l === "zh" ? "zh-CN" : l);
  buildMenus();
  try { applyMenuShortcuts(); } catch (_) {}
  try { updateMenuChecks(); } catch (_) {}
  try { applyUiStrings(); } catch (_) {}
  setTip(tr("ui.langChanged"));
}

// --- ファイル メニュー ---
function createNewFile() {
  if (layoutPreset() === "min") {          // 极简布局: 像 Sakura 一样直接开一个无标题文档, 不问文件名 (保存时才起名)
    const t = createUntitledDoc();
    setTip("已新建: " + t.name);
    return;
  }
  const name = prompt("新建文件名 (相对项目根):");
  if (!name || !projectRoot) { setTip("请先打开项目"); return; }
  const path = stripVerbatim(projectRoot) + "\\" + name;
  openFile(path).then(() => setTip("已新建: " + name));
}

function saveActiveAs() {
  const t = getActiveTab();
  if (!t) return;
  // 无标题文档 / 极简布局: 另存为 = 起名保存, 标签改绑到新文件. 完整布局的有名文档保持老行为 (只写一份副本, 标签不变)
  if (t.untitled || layoutPreset() === "min") return saveAsFlow(t);
  const name = prompt("另存为 (项目根内相对路径):", t.path.split(/[\\\/]/).pop());
  if (!name) return;
  const path = stripVerbatim(projectRoot || "") + "\\" + name;
  invoke("write_file", { path, content: t.lines.join("\n") }).then(() => {
    setTip("已另存为: " + name);
  }).catch((e) => openModal({ title: "另存失败", body: e.message }));
}

async function saveAll() {
  const dirty = [...TABS.values()].filter((t) => t.dirty);
  if (dirty.length === 0) { setTip("无未保存修改"); return; }
  let ok = 0, fail = 0, skip = 0;
  for (const t of dirty) {
    if (t.untitled) {      // 没有路径可写: 切到它, 走另存为 (取消就跳过)
      setActiveTab(t.id);
      if (await saveAsFlow(t, true)) ok++; else skip++;
      continue;
    }
    try { await writeDoc(t.path, t); t.dirty = false; ok++; }
    catch (e) { fail++; setTip("保存失败 " + t.path + ": " + e.message); }
  }
  renderTabs();
  setTip("已保存 " + ok + " 个文件" + (fail ? ", 失败 " + fail : "") + (skip ? ", 跳过 " + skip : ""));
}

function closeActiveTab() {
  const closeBtn = document.querySelector(".tab.active .tab-close");
  if (closeBtn) closeBtn.click();
  else setTip("无活动标签");
}

function closeAllTabs() {
  if (layoutPreset() === "min") {
    // 极简布局: 真的关掉全部 (下面按钮点击的写法只能关第一个: 关一个就重建标签条, 其余按钮节点已脱离文档),
    // 最后一个关掉时 closeTab 会补一个空白无标题文档; 有未保存修改的文档先统一确认一次
    const dirty = [...TABS.values()].filter((t) => t.dirty).length;
    if (dirty && !confirm(dirty + " 个文档有未保存修改, 全部关闭会丢失. 继续?")) return;
    [...TABS.keys()].forEach(closeTab);
    setTip("关闭全部标签");
    return;
  }
  document.querySelectorAll(".tab .tab-close").forEach(btn => btn.click());
  setTip("关闭全部标签");
}

async function reloadActive() {
  const t = getActiveTab();
  if (!t) { setTip("无活动标签"); return; }
  if (t.untitled) { setTip("无标题文档没有对应的文件, 无法重新载入"); return; }
  if (t.dirty && !confirm(t.path + " 有未保存修改, 重新载入会丢失. 继续?"))
    return;
  const lines = await invoke("read_file", { path: stripVerbatim(t.path) });
  t.lines = String(lines.content ?? lines).split("\n");
  if (lines && typeof lines === "object") { applyDocMeta(t, lines); updateDocStatus(t); }
  t.dirty = false;
  t.sel = null;
  t.undo = [];
  t.redo = [];
  renderVim(t);
  setTip("已重新载入: " + t.path);
}
