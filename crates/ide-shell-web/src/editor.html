let pendingZ = false;   // z 前缀 (zc/zo/zM/zR)
let pendingD = false;   // d 前缀 (dd 删行)
let pendingDTimer = null;
    // 内部剪贴板 (浏览器剪贴板 API 需要用户手势, 不可靠)

function newId() {
  return "t" + (++maxTabId);
}
window.newId = newId;

// ===== char 语义层 =====
//
// 光标列 (t.cursor.col) 一律按 **char** (code point) 计数, 与 Rust 内核
// (editcore::cursor::LogicPos / DocLine::char_len) 保持一致.
//
// 为什么要这一层: JS 的 String.length / slice / indexOf 都按 UTF-16
// code unit 计数, 而补充平面字符 (emoji、CJK 扩展 B 的补字如 𠮷/𡈽,
// 日文人名常用字) 是 surrogate pair, 占 2 个 code unit. 直接用 .length
// 算光标列会在这些字符上错位, 表现为"光标跳过一个字"或"退格删半个字".
//
// 日语常用汉字多在 BMP 内 (unit == char), 所以这个 bug 在日文测试里
// 不显眼 —— 但它是真实的, 且会与 Rust 内核产生不一致.

// 字符串 -> char 数组 (一次性展开, 后续按下标操作).
function chars(s) { return Array.from(s); }

// char 列 -> UTF-16 下标 (给 slice / indexOf 用).
function u16Index(str, charCol) {
  if (charCol <= 0) return 0;
  let u = 0, c = 0;
  for (const _ of str) {
    if (c === charCol) return u;
    u += _.length;   // 注意: 这里 _.length 是该字符的 UTF-16 长度 (1 或 2)
    c++;
  }
  return u;
}

// 字符数组按 char 列切片 (等价于 Python/Rust 的 s[a:b] on chars).
function charSlice(str, from, to) {
  return chars(str).slice(from, to).join("");
}

// 行的 char 长度.
function charLen(str) { return chars(str).length; }

// 把整行按 char 展开成数组 (供逐字编辑).
function charArray(str) { return chars(str); }

function getActiveTab() { return TABS.get(activeTabId); }

// 文档名 / 脏标记的两个落点: 极简布局下标签条常被隐藏, 看不到标签上的小圆点, 所以另外放在
// 状态栏文件名前 (data-dirty, ● 由 CSS 只在 min 画) 和窗口标题里. 完整布局的标题保持 "IDE1.0".
function syncDocChrome() {
  const t = getActiveTab();
  const sf = document.getElementById("s-file");
  if (sf) sf.dataset.dirty = t && t.dirty ? "on" : "off";
  const title = layoutPreset() === "min" && t ? (t.dirty ? "● " : "") + (t.name || "") + " - IDE1.0" : "IDE1.0";
  if (document.title !== title) document.title = title;
}

function tabGroupOf(t) { return (t && t.group) || 1; }
function renderTabs() {
  // 整条重建会把横向滚动位置清零; 先记下来, 重建后还原, 再保证活动标签在可视范围内
  // (标签溢出时, 否则打开的文件落在条外, 看不出哪个标签是当前的).
  const keepLeft = tabsEl.scrollLeft;
  tabsEl.innerHTML = "";
  const curGrp = tabGroupOf(TABS.get(activeTabId));
  for (const [id, t] of TABS) {
    if (tabGroupOf(t) !== curGrp) continue;               // 标签分组: 只显示当前组的标签
    const tab = document.createElement("button");
    tab.className = "tab" + (id === activeTabId ? " active" : "") + (t.dirty ? " tab-dirty" : "");
    tab.dataset.tabId = id;
    tab.innerHTML = escapeHtml(t.name) + '<span class="tab-close" data-tab-close="' + id + '" title="关闭">×</span>';
    tabsEl.appendChild(tab);
  }
  tabsEl.scrollLeft = keepLeft;
  const act = tabsEl.querySelector(".tab.active");
  if (act) {
    // 只动标签条自己的 scrollLeft (scrollIntoView 会顺带滚动祖先容器)
    const sr = tabsEl.getBoundingClientRect(), ar = act.getBoundingClientRect();
    if (ar.left < sr.left) tabsEl.scrollLeft += ar.left - sr.left;
    else if (ar.right > sr.right) tabsEl.scrollLeft += ar.right - sr.right;
  }
  updateMenuChecks();     // 「标签栏」的勾选取决于文档数 (tabs=auto 时 >=2 个才显示)
  syncDocChrome();
}

function renderBreadcrumb() {
  breadcrumb.innerHTML = "";
  const at = TABS.get(activeTabId);
  if (!at) return;
  // 无标题文档没有路径: 面包屑就是它的名字
  const parts = at.untitled ? [at.name] : at.path.split(/[\\\/]/).filter(Boolean);
  if (parts[0] && parts[0].endsWith(":")) parts.shift();
  parts.forEach((p, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      breadcrumb.appendChild(sep);
    }
    const c = document.createElement("span");
    c.className = "crumb" + (i === parts.length - 1 ? " current" : "");
    c.textContent = p;
    breadcrumb.appendChild(c);
  });
}

function setActiveTab(id) {
  activeTabId = id;
  renderTabs();
  renderBreadcrumb();
  const t = TABS.get(id);
  if (t) {
    setFile(t.path || t.name || "");     // 无标题文档没有路径, 显示它的名字
    setPos("Ln " + (t.cursor.row + 1) + ", Col " + (t.cursor.col + 1));
    setMode("NORMAL");
    // 走 renderVim: token 高亮 + 折叠标记 + 状态栏语言, 纯文本路径见 paintActive
    renderVim(t);
    updateDocStatus(t);
  }
  edContent.focus({ preventScroll: true });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch];
  });
}

// Rust 端 list_dir/read_file 会回 Windows verbatim 前缀 \\?\,
// 前端统一剥掉再往下传, 否则后续 invoke 的路径校验会对不上.
function stripVerbatim(p) {
  return String(p).replace(/^\\\\\?\\/, "");
}


/* ===== 文件编码 / BOM / 换行 (每个文档各自记一份, 保存时原样写回) =====
   后端 read_file 返回 {content(LF), encoding, bom, eol, mixed_eol, lossy}; write_file 收 {encoding, bom, eol, force}.
   以前全程只认 UTF-8, 换行是一个全局变量 FILE_EOL (切标签就串了)。 */
const CHARSETS = ["UTF-8", "SJIS", "EUC-JP", "JIS", "Unicode", "UnicodeBE", "Latin1", "CESU-8", "UTF-7", "GBK", "Big5", "EUC-KR"];
function docMeta(t) { return { encoding: t.encoding || "UTF-8", bom: t.bom || "none", eol: t.eol || "crlf" }; }
function applyDocMeta(t, res) {
  t.encoding = res.encoding || "UTF-8"; t.bom = res.bom || "none"; t.eol = res.eol || "crlf";
  t.mixedEol = !!res.mixed_eol; t.lossy = !!res.lossy;
}
// 保存到 path. 目标编码表示不了某些字符时 (后端报 UNMAPPABLE) 问用户: 仍然保存 (变成 ?) 还是取消.
async function writeDoc(path, t) {
  const spec = Object.assign({ path, content: t.lines.join("\n") }, docMeta(t));
  try {
    return await invoke("write_file", spec);
  } catch (e) {
    if (String(e.message).startsWith("UNMAPPABLE:")) {
      const parts = e.message.split(":");
      if (!confirm(parts.slice(2).join(":") + "\n\n仍然以 " + spec.encoding + " 保存吗? (这些字符会变成 ?)\n取消 = 不保存, 可改用 UTF-8 / Unicode 再保存。")) {
        const err = new Error("已取消保存 (有字符无法用 " + spec.encoding + " 表示)"); err.cancelled = true; throw err;
      }
      return await invoke("write_file", Object.assign(spec, { force: true }));
    }
    throw e;
  }
}
function updateDocStatus(t) {
  const enc = document.getElementById("s-enc"), eol = document.getElementById("s-eol");
  if (!enc || !eol) return;
  if (!t) { enc.textContent = ""; eol.textContent = ""; return; }
  const m = docMeta(t);
  enc.textContent = m.encoding + (m.bom !== "none" ? " BOM" : "");
  eol.textContent = m.eol.toUpperCase() + (t.mixedEol ? "*" : "");
  enc.title = "文字コードセット: " + m.encoding + " (点击指定/重新打开)";
  eol.title = "入力改行コード: " + m.eol.toUpperCase() + (t.mixedEol ? " (文件里混用了多种换行)" : "") + " (点击切换)";
}
// 以指定编码重新打开当前文件 (Sakura F_FILE_REOPEN_*)
async function reopenWithEncoding(label) {
  const t = getActiveTab();
  if (!t) return;
  if (t.untitled) { setTip("无标题文档没有对应的文件, 无法重新打开"); return; }
  if (t.dirty && !confirm(t.name + " 有未保存修改, 重新打开会丢失. 继续?")) return;
  try {
    const res = await invoke("read_file", { path: stripVerbatim(t.path), encoding: label });
    t.lines = String(res.content ?? "").split("\n");
    applyDocMeta(t, res);
    t.dirty = false; t.sel = null; t.undo = []; t.redo = [];
    renderVim(t); updateDocStatus(t);
    setTip("已按 " + label + " 重新打开" + (res.lossy ? " (有无法解码的字节, 已替换为 ?)" : ""));
  } catch (e) { setTip("重新打开失败: " + e.message); }
}
function setSaveEncoding(label, bom) {
  const t = getActiveTab();
  if (!t) return;
  t.encoding = label;
  t.bom = bom !== undefined ? bom : ((label === "Unicode" || label === "UnicodeBE") ? (label === "Unicode" ? "utf16le" : "utf16be") : (t.bom && /^utf16/.test(t.bom) ? "none" : (t.bom || "none")));
  t.dirty = true; renderTabs(); updateDocStatus(t);
  setTip("保存编码: " + label + (t.bom !== "none" ? " (带 BOM)" : ""));
}
function charsetPanel() {
  const t = getActiveTab();
  if (!t) return;
  const cur = docMeta(t);
  const rows = CHARSETS.map((c) =>
    '<div class="opt-row" style="display:flex;gap:8px;align-items:center"><span style="flex:1;' + (c === cur.encoding ? 'color:var(--blue)' : '') + '">' + escapeHtml(c) + (c === cur.encoding ? "  ← 当前" : "") + '</span>' +
    '<button class="md-btn" data-reopen="' + c + '">以此重新打开</button>' +
    '<button class="md-btn" data-saveenc="' + c + '">保存时使用</button></div>').join("");
  const bomRow = '<div class="opt-row"><label><input type="checkbox" id="cs-bom"' + (cur.bom === "utf8" ? " checked" : "") + (cur.encoding === "UTF-8" ? "" : " disabled") + '> UTF-8 带 BOM</label></div>';
  openModal({ title: "文字コードセット指定", bodyHTML: '<div class="empty-hint">当前: ' + escapeHtml(cur.encoding + (cur.bom !== "none" ? " + BOM" : "") + " / " + cur.eol.toUpperCase()) + "</div>" + bomRow + rows, buttons: [{ label: "关闭", cmd: "modal-close" }] });
  mdBody.querySelectorAll("[data-reopen]").forEach((b) => b.addEventListener("click", () => { closeModal(); reopenWithEncoding(b.dataset.reopen); }));
  mdBody.querySelectorAll("[data-saveenc]").forEach((b) => b.addEventListener("click", () => { closeModal(); setSaveEncoding(b.dataset.saveenc); }));
  const bomEl = document.getElementById("cs-bom");
  if (bomEl) bomEl.addEventListener("change", () => { t.bom = bomEl.checked ? "utf8" : "none"; t.dirty = true; renderTabs(); updateDocStatus(t); });
}
function setDocEol(label) {
  const t = getActiveTab();
  if (!t || !EOLS[label]) return;
  t.eol = label; t.mixedEol = false; t.dirty = true; renderTabs(); updateDocStatus(t);
  setTip("入力改行コード: " + label.toUpperCase() + " (保存时生效)");
}

async function openFile(path) {
  const tPath = stripVerbatim(path);
  try {
    const res = await invoke("read_file", { path: tPath });
    // Rust 端返回 { name, path, content } 对象 (不是裸字符串)
    const text = res && typeof res === "object" ? res.content : res;
    const id = "t" + (++maxTabId);
    // 极简布局: 还没动过的空白无标题文档被打开的文件顶替 (否则白白多出一个标签, 标签条也跟着冒出来)
    const prev = getActiveTab();
    if (layoutPreset() === "min" && prev && prev.untitled && !prev.dirty && prev.lines.length === 1 && prev.lines[0] === "") TABS.delete(prev.id);
    TABS.set(id, {
      id,
      path: tPath,
      name: (res && res.name) || tPath.split(/[\\\/]/).pop(),
      cursor: { row: 0, col: 0 },
      dirty: false,
      lines: String(text ?? "").split("\n"),
      undo: [],
      redo: [],
    });
    if (res && typeof res === "object") applyDocMeta(TABS.get(id), res);
    setActiveTab(id);
    pushRecent(tPath);
    if (res && res.mixed_eol) setTip("已打开: " + tPath + " (注意: 文件里混用了多种换行, 保存时统一为 " + String(res.eol).toUpperCase() + ")");
    else if (res && res.lossy) setTip("已打开: " + tPath + " (有无法按 " + res.encoding + " 解码的字节, 已替换; 可试「文字コードセット指定」)");
    else setTip("已打开: " + tPath);
  } catch (e) {
    setTip("打开失败: " + e.message);
  }
}

// ===== 无标题文档 + 工作目录 + 另存为 =====
// 无标题文档的 path 是 "" (不是 null): 老代码里 t.path.split(...) / detectLanguage(t.path || "") 照常工作, 语言就是 Plain.
function untitledName() {
  const used = new Set([...TABS.values()].filter((t) => t.untitled).map((t) => t.name));
  if (!used.has("无标题")) return "无标题";
  for (let n = 2; ; n++) if (!used.has("无标题 " + n)) return "无标题 " + n;
}

function createUntitledDoc() {
  const id = "t" + (++maxTabId);
  const t = { id, path: "", name: untitledName(), untitled: true, cursor: { row: 0, col: 0 }, dirty: false, lines: [""], undo: [], redo: [], encoding: PREFS.defaultEncoding || "UTF-8", bom: "none", eol: PREFS.defaultEol || "crlf" };
  TABS.set(id, t);
  setActiveTab(id);
  return t;
}

// 后端的文件读写全都限定在「项目根」内; 没打开项目时 (极简布局的常态) 先按默认根建立一个, 和「打开文件夹」是同一套机制.
// web: 服务端默认根 (GET /api/pick_folder, 服务端同时把它设为项目根; 不能走 invoke("pick_folder"): 那会 POST, 后端只认 GET).
// 桌面: 原生文件夹选择器 (取消 => null, 它自己会设项目根).
let ROOT_PENDING = null;
function ensureWorkingRoot() {
  if (projectRoot) return Promise.resolve(projectRoot);
  if (!ROOT_PENDING) {
    ROOT_PENDING = (async () => {
      try {
        const p = await (inTauri ? invoke("pick_folder") : fetchApi("/api/pick_folder", { method: "GET" }));
        if (!p) { setTip("已取消"); return null; }
        projectRoot = p;
        // 侧栏正显示「未打开项目」时刷新一下; 不会为此把隐藏的侧栏亮出来
        if (layoutFlag("sideBar") && currentSidePane === "explorer") renderExplorer();
        return projectRoot;
      } catch (e) {
        setTip("无法确定工作目录: " + e.message);
        return null;
      }
    })().finally(() => { ROOT_PENDING = null; });
  }
  return ROOT_PENDING;
}

// 用 root 自己的分隔符拼路径 (Windows 根用反斜杠, 其余用正斜杠); 绝对路径原样交给后端沙箱去校验
function joinPath(root, rel) {
  rel = String(rel).trim();
  if (/^([A-Za-z]:)?[\\\/]/.test(rel)) return rel;
  const r = stripVerbatim(root);
  const sep = r.indexOf("\\") >= 0 ? "\\" : "/";
  return r.replace(/[\\\/]+$/, "") + sep + rel.replace(/^[\\\/]+/, "").replace(/[\\\/]/g, sep);
}

// 文件是否已存在: 列父目录比对文件名 (read_file 有 4MB 上限且 web 端拿不到错误正文, 不适合拿来探测)
async function pathExists(path) {
  const cut = Math.max(path.lastIndexOf("/"), path.lastIndexOf("\\"));
  const base = path.slice(cut + 1).toLowerCase();
  try { return (await invoke("list_dir", { path: path.slice(0, cut) })).some((e) => String(e.name).toLowerCase() === base); }
  catch (_) { return false; }
}

// 另存为: 保证有工作目录 -> 问文件名 -> 写盘 -> 成功后这个标签改绑到新文件 (真实路径/名字/语言, 不再脏).
// Ctrl+S 会让 saveActive 跑两遍 (编辑区 keydown + 冒泡到 document), 所以 BUSY 必须在任何 await 之前同步占住, 第二遍直接返回;
// 释放要推迟到下一个宏任务: 用户在 prompt 里点了取消时本函数会同步返回, 立刻释放的话冒泡过来的第二遍会再弹一次 prompt.
// batch=true: 「全部保存」依次给几个无标题文档起名, 后一个不能被前一个刚留下的 BUSY 挡掉
let SAVE_AS_BUSY = false;
async function saveAsFlow(t, batch) {
  if (SAVE_AS_BUSY && !batch) return false;
  SAVE_AS_BUSY = true;
  try {
    const root = projectRoot || await ensureWorkingRoot();
    if (!root) return false;
    const dir = stripVerbatim(root);
    const input = prompt("另存为 (" + dir + " 内的文件名或相对路径):", t.untitled ? "无标题.txt" : t.name);
    const name = input && input.trim();
    if (!name) return false;
    const path = joinPath(dir, name);
    if (path !== t.path && await pathExists(path) && !confirm(name + " 已存在, 覆盖?")) return false;
    try {
      await writeDoc(path, t);
    } catch (e) {
      if (e.cancelled) { setTip(e.message); return false; }
      openModal({ title: "另存失败", body: e.message });
      return false;
    }
    // 写成功: 改绑. 标签在 await 期间可能已不是当前标签 (切走/被关), 所以只改 t, 编辑区重绘只在它仍是当前标签时做
    t.path = path;
    t.name = path.split(/[\\\/]/).pop();
    t.untitled = false;
    t.dirty = false;
    if (Syntax.detectLanguage(path) !== "plain") delete t.language;   // 按新扩展名重新识别语言 (认不出就保留手动选的)
    renderTabs();
    if (t.id === activeTabId) {
      renderBreadcrumb();
      setFile(path);
      renderVim(t);
      edContent.focus({ preventScroll: true });
    }
    if (layoutFlag("sideBar") && currentSidePane === "explorer") renderExplorer();   // 新文件出现在文件树里
    pushRecent(path);
    setTip("已保存: " + path);
    return true;
  } catch (e) {
    setTip("另存失败: " + e.message);
    return false;
  } finally {
    setTimeout(() => { SAVE_AS_BUSY = false; }, 0);
  }
}

// --- 编辑核心: 行/字符级插入删除 + undo/redo ---
// edContent 是普通 div (非 contenteditable), 所以所有文本变更都走这里,
// 保证 t.lines 始终是唯一真源, 再重绘到 DOM.
function curLine(t) {
  while (t.cursor.row >= t.lines.length) t.lines.push("");
  return t.lines[t.cursor.row];
}

function snapshot(t) {
  // tab 可能来自外部 (UAT 直接 tabs.set), 不一定带 undo/redo 栈 — 惰性补齐,
  // 否则 t.undo.push 直接 TypeError, 整个 keydown handler 静默失效.
  if (!t.undo) t.undo = [];
  if (!t.redo) t.redo = [];
  if (!t.folded) t.folded = new Set();
  if (!t.baseLines || !t.dirty) t.baseLines = t.lines.slice();          // 干净状态下的第一次改动前 = 基线 (用于「变更行」)
  if (t.skipSnapAt && performance.now() - t.skipSnapAt < 80) { t.skipSnapAt = 0; return; }   // 「替换选区」= 删除 + 输入 算同一步撤销 (删除时已经记过)
  t.undo.push({ lines: t.lines.slice(), cursor: { ...t.cursor } });
  if (t.undo.length > 200) t.undo.shift();
  t.redo.length = 0;
}
function replaceSelection(t) { if (deleteSelection(t)) t.skipSnapAt = performance.now(); t.selAnchor = null; }

function clampCursor(t) {
  if (t.cursor.row < 0) t.cursor.row = 0;
  if (t.cursor.row >= t.lines.length) t.cursor.row = t.lines.length - 1;
  // char 长度 (非 UTF-16 code unit) —— 见 chars()/charLen() 的说明.
  const len = charLen(t.lines[t.cursor.row]);
  if (t.cursor.col < 0) t.cursor.col = 0;
  if (t.cursor.col > len) t.cursor.col = len;
}


/* 在**已高亮的 token 流**上按字符列切三段 (前 / 选区 / 后), 保留语法配色.
   不能对 rendered (HTML 字符串) 直接 charSlice —— 那会从 <span> 中间劈开, 产出破损标签.
   做法: 按 token 边界消费字符数, 只在 token 边界开口/闭合 span. */
function splitHighlighted(toks, c0, c1) {
  let pos = 0;
  let pre = "", mid = "", post = "";
  const emit = (tk) => {
    const n = charLen(tk.text);
    const segStart = pos, segEnd = pos + n;
    pos = segEnd;
    const html = tk.cls ? '<span class="tk-' + tk.cls + '">' + escapeHtml(tk.text) + "</span>" : escapeHtml(tk.text);
    if (segEnd <= c0) { pre += html; return; }
    if (segStart >= c1) { post += html; return; }
    // token 与选区相交: 按字符切成 最多 3 段 (前段并入 pre, 中段包进 mid, 后段并入 post)
    const cut0 = Math.max(c0 - segStart, 0);
    const cut1 = Math.min(c1 - segStart, n);
    if (cut0 > 0) pre += escapeHtml(charSlice(tk.text, 0, cut0));
    mid += '<span class="col-sel-active">' + escapeHtml(charSlice(tk.text, cut0, cut1)) + "</span>";
    if (cut1 < n) post += escapeHtml(charSlice(tk.text, cut1, n));
  };
  for (const tk of toks) emit(tk);
  return { pre, mid, post };
}

/* 在 token 流上按字符列切两段 (前 / 后), 用于插光标标记 (不动已有配色). */
function splitAt(toks, at) {
  let pos = 0;
  let pre = "", post = "";
  for (const tk of toks) {
    const n = charLen(tk.text);
    const s = pos; pos += n;
    if (pos <= at) { pre += tk.cls ? '<span class="tk-' + tk.cls + '">' + escapeHtml(tk.text) + "</span>" : escapeHtml(tk.text); continue; }
    if (s >= at) { post += tk.cls ? '<span class="tk-' + tk.cls + '">' + escapeHtml(tk.text) + "</span>" : escapeHtml(tk.text); continue; }
    const cut = at - s;
    pre += tk.cls ? '<span class="tk-' + tk.cls + '">' + escapeHtml(charSlice(tk.text, 0, cut)) + "</span>" : escapeHtml(charSlice(tk.text, 0, cut));
    post = (tk.cls ? '<span class="tk-' + tk.cls + '">' + escapeHtml(charSlice(tk.text, cut, n)) + "</span>" : escapeHtml(charSlice(tk.text, cut, n))) + post;
  }
  return { pre, post };
}

function paintActive() {
  const t = getActiveTab();
  if (!t) return;
  clampCursor(t);
  // 重绘会替换子节点, 焦点会掉回 body, 后续按键就不再进 keydown handler.
  // 之前是否持有焦点, 重绘后补回去.
  const hadFocus = document.activeElement === edContent;
  if (vwActive(t)) {                               // 大文件: 走窗口化渲染 (每次只画可视窗口附近的行)
    renderVim(t);
    updateCaretColumn();
    renderTabs();
    if (hadFocus) edContent.focus({ preventScroll: true });
    return;
  }
  if (VW.on) { VW.on = false; edContent.classList.remove("vwin"); }
  edContent.replaceChildren(document.createTextNode(t.lines.join("\n")));
  gutter.textContent = t.lines.map((_, i) => i + 1).join("\n");
  updateCaretColumn();
  renderTabs();
  if (hadFocus) edContent.focus({ preventScroll: true });
  updateCaret(true);
}

// ===== 光标 (非模态时画一根闪烁的竖线) =====
// #ed-content 是不可编辑的 div, 本来没有插入符. Vim 开着时靠状态栏 Ln/Col + 模式标签, 不画; 非模态 (缺省, 像 Sakura) 必须看得见光标在哪.
// 位置按 t.cursor 算: 找到该行对应的文本节点, 用折叠的 Range 取矩形, 所以 CJK / emoji / 自动换行 / 横向滚动都按真实排版.
function caretRect(t) {
  const row = t.cursor.row, line = t.lines[row] || "";
  const u = u16Index(line, t.cursor.col);        // col 是 code point 列, DOM 偏移按 UTF-16
  let node = null, off = 0;
  const only = edContent.firstChild;
  if (only && only.nodeType === 3 && edContent.childNodes.length === 1) {   // paintActive: 整篇一个文本节点, 行以 \n 相连
    node = only;
    for (let r = 0; r < row; r++) off += (t.lines[r] || "").length + 1;
    off += u;
  } else {                                       // renderVim: 每行一个 .hl-row / .fold-row, 里面是 token span
    const rowEl = rowElAt(row);
    if (!rowEl) {
      if (VW.on) {                               // 窗口外的行: 按行高算位置 (给「光标跟随」用, 滚过去之后窗口会补画)
        const h = edContent.getBoundingClientRect(), cs = getComputedStyle(edContent);
        return { left: h.left + (parseFloat(cs.paddingLeft) || 0) - edContent.scrollLeft, height: 18,
                 top: h.top + (parseFloat(cs.paddingTop) || 0) + row * (VW.lh || 18) - edContent.scrollTop };
      }
      return null;
    }
    const tw = document.createTreeWalker(rowEl, NodeFilter.SHOW_TEXT);
    let rem = u, n;
    while ((n = tw.nextNode())) {
      node = n;
      if (rem <= n.length) { off = rem; break; }
      rem -= n.length; off = n.length;
    }
    if (!node) { const b = rowEl.getBoundingClientRect(); return { left: b.left, top: b.top, height: b.height || 18 }; }   // 空行没有文本节点
  }
  const rg = document.createRange();
  rg.setStart(node, Math.min(off, node.length));
  rg.collapse(true);
  const rs = rg.getClientRects();
  const b = rs.length ? rs[0] : rg.getBoundingClientRect();
  if (!b.width && !b.height && !b.left && !b.top) {          // 浏览器没给出矩形 (整篇单文本节点里的空行): 按行高估算
    const h = edContent.getBoundingClientRect(), cs = getComputedStyle(edContent);
    return { left: h.left + (parseFloat(cs.paddingLeft) || 0) - edContent.scrollLeft, height: 18,
             top: h.top + (parseFloat(cs.paddingTop) || 0) + row * 18 - edContent.scrollTop };
  }
  const h = b.height || 18;                      // Range 矩形是字形盒 (14px 字约 15px 高), 光标取整行高 18, 垂直居中, 这样有字行和空行一样高
  return { left: b.left, top: b.top - (18 - h) / 2, height: 18 };
}
let caretKey = "";
// follow=true (改了文本 / 移了光标): 光标跑出可视区就把编辑区滚过去 (Vim 关时文本长过一屏, 否则看不到在打什么);
// follow=false (滚动 / 改尺寸): 只重新定位, 不能把用户滚走的位置又拽回来
function updateCaret(follow) {
  const el = document.getElementById("caret");
  if (!el) return;
  const t = getActiveTab();
  if (!t || !t.cursor || LAYOUT.vimOn()) { el.classList.remove("on"); return; }
  let r = caretRect(t);
  if (!r) { el.classList.remove("on"); return; }
  const host = edContent.getBoundingClientRect();
  if (follow) {
    const bottom = host.top + edContent.clientHeight, right = host.left + edContent.clientWidth;
    if (r.top < host.top) edContent.scrollTop += r.top - host.top - 4;
    else if (r.top + r.height > bottom) edContent.scrollTop += r.top + r.height - bottom + 4;
    if (r.left < host.left) edContent.scrollLeft += r.left - host.left - 24;
    else if (r.left > right - 8) edContent.scrollLeft += r.left - right + 24;
    if (vwActive(t)) vwSync(t);                  // 滚动后可视区可能越出窗口: 先补画, 再取光标矩形
    r = caretRect(t) || r;
  }
  const inView = r.top + r.height > host.top && r.top < host.top + edContent.clientHeight &&
                 r.left >= host.left && r.left <= host.left + edContent.clientWidth;
  if (!inView) { el.classList.remove("on"); return; }
  const ed = document.getElementById("editor").getBoundingClientRect();
  el.style.left = (r.left - ed.left) + "px";
  el.style.top = (r.top - ed.top) + "px";
  el.style.height = r.height + "px";
  el.classList.add("on");
  const key = r.left + "," + r.top;
  if (key !== caretKey) {                        // 位置变了 = 正在输入/移动: 重启闪烁, 保持常亮一个周期
    caretKey = key;
    el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  }
}

// 在 INSERT 模式下插入一个字符, 推进光标, 标脏
function insertChar(ch) {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const line = curLine(t);
  // 按 char 切分再插入 —— ch 可能是 surrogate pair (emoji / CJK 扩展 B 补字),
  // 用 UTF-16 下标切会算错.
  const arr = charArray(line);
  // 覆盖模式 (Ins): 行内还有字符时吃掉光标后的一个字符
  const skip = OVERWRITE && t.cursor.col < arr.length ? 1 : 0;
  t.lines[t.cursor.row] =
    arr.slice(0, t.cursor.col).join("") + ch + arr.slice(t.cursor.col + skip).join("");
  t.cursor.col += chars(ch).length;
  t.dirty = true;
  paintActive();
}

// 光标左右移动 —— char 语义 (col 是 code point 下标, 不是 UTF-16).
// clamp 到当前行的 char 长度, 避免移出界.
function moveCaretRight(t) {
  if (!t) return;
  const row = t.cursor.row;
  const len = charLen(curLine(t));
  if (t.cursor.col < len) t.cursor.col += 1;
  else if (row + 1 < t.lines.length) { t.cursor.row = row + 1; t.cursor.col = 0; }
}

function moveCaretLeft(t) {
  if (!t) return;
  if (t.cursor.col > 0) t.cursor.col -= 1;
  else if (t.cursor.row > 0) {
    t.cursor.row -= 1;
    t.cursor.col = charLen(t.lines[t.cursor.row]);
  }
}

// 光标上下移动 —— char 语义, 跨行保持 col 位置 (必要时夹取).
function moveCaretUp(t) {
  if (!t) return;
  if (t.cursor.row > 0) {
    t.cursor.row -= 1;
    const len = charLen(t.lines[t.cursor.row]);
    t.cursor.col = Math.min(t.cursor.col, len);
  }
}

function moveCaretDown(t) {
  if (!t) return;
  if (t.cursor.row + 1 < t.lines.length) {
    t.cursor.row += 1;
    const len = charLen(t.lines[t.cursor.row]);
    t.cursor.col = Math.min(t.cursor.col, len);
  }
}

// ================================================================
// Sakura 光标移动命令集 (docs/SPA-02 §2, 对标 HLP000220 ~ HLP000263)
//
// Sakura 的移动命令有一条统一规则, 缺了它就不算对标:
//   **有选区时, 移动命令 = 收缩选区到起点/终点**, 而不是移动光标丢弃选区.
//   例如「行末へ移動」在有选区时把选区收到行末, 无选区才移动光标.
//   我们原来的 moveCaret* 没有这个分支, 与 Sakura 行为不一致.
//
// 所有命令都在 char (码点) 语义下工作, 不碰 UTF-16 码元 (与 chars/charSlice 同一套).
// ================================================================

// 单词边界判定: 字母/数字/下划线算"单词字符", 其余算分隔符.
// 日文没有空格分词, 但 Sakura 用的是同一套「非单词字符即边界」规则,
// 对日文来说就是按空格/标点断词 —— 与 Sakura 行为一致.
function isWordChar(c) {
  return !!c && /[\p{L}\p{N}_]/u.test(c);
}

// 单词右边界: 跳到**当前单词的右端**.
// Sakura 语义 (HLP000223「単語の右端に移動」+ 其提示): 光标在单词**内部或之前**时,
// 移到该词的末尾; 光标已在词尾时再按才进到下一个词. 例 "I have a pen."
// 光标在 "a" 前 -> 右移到 "a" 之后 (词尾), 不是直接跳到 "pen".
// 注意区分与「次の単語へ」类命令 —— Sakura 没有那个命令, 它就是这个行为.
function wordRight(line, from) {
  // Sakura (实测 S_WordRight): 词内 -> 跳过本词再跳过后面的分隔符, 落在下一个词的词首; 已在分隔符上 -> 直接到下一个词首
  const a = charArray(line);
  let i = Math.max(0, Math.min(from, a.length));
  if (i >= a.length) return a.length;
  if (isWordChar(a[i])) while (i < a.length && isWordChar(a[i])) i++;
  while (i < a.length && !isWordChar(a[i])) i++;
  return i;
}

function wordLeft(line, from) {
  const a = charArray(line);
  let i = Math.max(0, Math.min(from, a.length));
  while (i > 0 && !isWordChar(a[i - 1])) i--;
  while (i > 0 && isWordChar(a[i - 1])) i--;
  return i;
}

// 段落边界: 空行为分界, 没有空行时整篇算一段 (Sakura HLP000262/263 语义).
function paraNext(t, fromRow) {
  let r = fromRow;
  // 当前段末尾
  while (r + 1 < t.lines.length && (t.lines[r] || "").trim() !== "") r++;
  // 跳过空行
  while (r + 1 < t.lines.length && (t.lines[r] || "").trim() === "") r++;
  return Math.min(r, t.lines.length - 1);
}
function paraPrev(t, fromRow) {
  let r = fromRow;
  while (r > 0 && (t.lines[r] || "").trim() === "") r--;
  while (r > 0 && (t.lines[r - 1] || "").trim() === "") r--;
  while (r > 0 && (t.lines[r - 1] || "").trim() !== "") r--;
  return Math.max(0, r);
}

// 一页 = 编辑区可视行数 (由真实高度算出, 不写死).
function pageRows() {
  const el = document.getElementById("editor");
  const h = el ? el.clientHeight : 0;
  const row = edContent.querySelector(".hl-row");
  const lineH = row ? row.getBoundingClientRect().height || 18 : 18;
  return Math.max(1, Math.floor(h / lineH) - 1);
}

/* 通用移动入口. mode: 行/字/段落/页/文首尾; dir: +1/-1; half: 半页.
   有选区时按 Sakura 规则先收缩选区 (Sakura HLP000234 ~ HLP000243):
   「(選択)」前缀的命令 = 把光标移到选区的**后端/前端**并清掉选区**, 而不是丢弃选区移动光标.
   方向: dir > 0 (末方向: 行末/词右/下/文末) 取选区**终点**;
        dir < 0 (首方向: 行首/词左/上/文首) 取选区**起点**. */
function legacyMove(t, mode, dir, half) {
  if (!t) return;
  if (t.sel) {
    const { r0, c0, r1, c1 } = t.sel;
    const toEnd = dir > 0;
    const row = toEnd ? r1 : r0;
    const rawCol = toEnd ? c1 : c0;
    // 终点列可能是 Infinity (选到行尾), 夹到实际行宽
    const col = Math.max(0, Math.min(rawCol === Infinity ? charLen(t.lines[row] || "") : rawCol,
                                       charLen(t.lines[row] || "")));
    t.cursor = { row, col };
    t.sel = null;
    renderVim(t);
    updateCaret(true);
    setPos("Ln " + (row + 1) + ", Col " + (col + 1));
    return;
  }
  const lastRow = Math.max(0, t.lines.length - 1);
  const cur = curLine(t);
  switch (mode) {
    case "line": {                       // 行首/行末
      t.cursor.col = dir > 0 ? charLen(cur) : 0;
      break;
    }
    case "word": {                       // 单词左/右
      const c = dir > 0 ? wordRight(cur, t.cursor.col) : wordLeft(cur, t.cursor.col);
      if (dir > 0 && t.cursor.col >= charLen(cur) && t.cursor.row < lastRow) { t.cursor.row++; t.cursor.col = firstWordCol(t.lines[t.cursor.row] || ""); }
      else t.cursor.col = c;
      break;
    }
    case "para": {
      t.cursor.row = dir > 0 ? paraNext(t, t.cursor.row) : paraPrev(t, t.cursor.row);
      t.cursor.col = Math.min(t.cursor.col, charLen(t.lines[t.cursor.row] || ""));
      break;
    }
    case "page": {
      const step = half ? Math.max(1, Math.floor(pageRows() / 2)) : pageRows();
      t.cursor.row = Math.max(0, Math.min(lastRow, t.cursor.row + dir * step));
      t.cursor.col = Math.min(t.cursor.col, charLen(t.lines[t.cursor.row] || ""));
      break;
    }
    case "doc": {                        // 文首/文末
      if (dir > 0) { t.cursor = { row: lastRow, col: charLen(t.lines[lastRow] || "") }; }
      else t.cursor = { row: 0, col: 0 };
      break;
    }
    case "line2": {                      // 上下 2 行 (Sakura 的「２行ごと」)
      t.cursor.row = Math.max(0, Math.min(lastRow, t.cursor.row + dir * 2));
      t.cursor.col = Math.min(t.cursor.col, charLen(t.lines[t.cursor.row] || ""));
      break;
    }
  }
  renderVim(t);
  updateCaret(true);
  setPos("Ln " + (t.cursor.row + 1) + ", Col " + (t.cursor.col + 1));
  // 移动后把光标滚进视野
  scrollRowIntoView(t.cursor.row, "nearest");
}

// 退格: 合并到上一行 / 行内删除


// NORMAL 模式单字符操作
function normalDeleteChar() {
  const t = getActiveTab();
  if (!t) return;
  snapshot(t);
  const line = curLine(t);
  if (t.cursor.col < line.length) {
    t.lines[t.cursor.row] = line.slice(0, t.cursor.col) + line.slice(t.cursor.col + 1);
  } else if (t.cursor.row < t.lines.length - 1) {
    t.lines[t.cursor.row] = line + t.lines[t.cursor.row + 1];
    t.lines.splice(t.cursor.row + 1, 1);
  } else {
    t.undo.pop();
    return;
  }
  t.dirty = true;
  paintActive();
}


function doUndo() {
  const t = getActiveTab();
  if (!t || t.undo.length === 0) return;
  t.redo.push({ lines: t.lines.slice(), cursor: { ...t.cursor } });
  const s = t.undo.pop();
  t.lines = s.lines;
  t.cursor = s.cursor;
  t.sel = null; t.selAnchor = null;   // Sakura: 撤销 / 重做之后没有选区
  t.dirty = true;
  paintActive();
}

function doRedo() {
  const t = getActiveTab();
  if (!t || t.redo.length === 0) return;
  t.undo.push({ lines: t.lines.slice(), cursor: { ...t.cursor } });
  const s = t.redo.pop();
  t.lines = s.lines;
  t.cursor = s.cursor;
  t.sel = null; t.selAnchor = null;   // Sakura: 撤销 / 重做之后没有选区
  t.dirty = true;
  paintActive();
}

// Ctrl+S 家族的键盘入口. 极简布局里菜单标的 Ctrl+Shift+S = 另存为、Ctrl+Alt+S = 全部保存, 都要真的走对应命令 (无标题文档靠它起名);
// 完整布局保持老样子 (一律普通保存). 编辑区和 document 两处 keydown 会先后处理同一个事件, Shift / Alt 变体用事件上的标记只处理一次, 免得弹两遍文件名
function saveByKey(e) {
  if (layoutPreset() === "min" && (e.shiftKey || e.altKey)) {
    if (e.__saveHandled) return;
    e.__saveHandled = true;
    if (e.altKey && !e.shiftKey) { dispatchCommand("tmp-wrap"); return; }        // Sakura: Ctrl+Alt+S = 指定桁で折り返す
    if (e.altKey && e.shiftKey) saveAll(); else saveActiveAs();
    return;
  }
  saveActive();
}

async function saveActive() {
  const t = getActiveTab();
  if (!t) return false;
  if (t.untitled) return saveAsFlow(t);     // 无标题文档没有路径可写: 保存 = 另存为
  try {
    await writeDoc(t.path, t);
    t.dirty = false;
    renderTabs();
    setTip("已保存");
    return true;
  } catch (e) {
    if (e.cancelled) { setTip(e.message); return false; }
    openModal({ title: "保存失败", body: e.message });
    return false;
  }
}

// 极简布局: 关掉有未保存修改的文档前先确认 (唯一的无标题文档没有文件可找回, Ctrl+W 一下就丢光了). 完整布局保持原样直接关.
// 只挂在用户入口上 (标签 ✕ / Ctrl+W / 关闭全部), closeTab 本身不问, 内部流程 (:wq 保存后关闭 等) 不受影响
function confirmClose(t) {
  if (layoutPreset() !== "min" || !t || !t.dirty) return true;
  return confirm(t.name + " 有未保存修改, 关闭会丢失. 继续?");
}

function closeTab(id) {
  TABS.delete(id);
  if (activeTabId === id) activeTabId = null;
  if (TABS.size === 0) {
    if (layoutPreset() === "min") {
      // 极简布局永远留一个文档: 像 Sakura 关掉最后一个文档后仍是可输入的空白编辑区, 不回欢迎页
      createUntitledDoc();
    } else {
      // 关掉最后一个标签要回到欢迎页 —— 否则编辑器区是一片空白, 用户
      // 既看不到文件名也找不到"打开文件夹"的入口, 像是卡死了.
      // (实测: closeTab 只清了内容, 没调 showWelcome)
      showWelcome();
      setFile("无活动");
      setPos("Ln 1, Col 1");
    }
  } else {
    setActiveTab([...TABS.keys()][0]);
  }
  renderTabs();
  renderBreadcrumb();
}

if (tabsEl) tabsEl.addEventListener("click", (e) => {
  const closeBtn = e.target.closest("[data-tab-close]");
  if (closeBtn) {
    e.stopPropagation();
    if (confirmClose(TABS.get(closeBtn.dataset.tabClose))) closeTab(closeBtn.dataset.tabClose);
    return;
  }
  const tab = e.target.closest(".tab");
  if (tab) setActiveTab(tab.dataset.tabId);
});

// 真实键盘处理: NORMAL 只吃单键动作, INSERT 走字符输入.
// edContent 不是 contenteditable, 所以所有变更由 t.lines + paintActive 驱动.
// Ctrl+点击 = 加一个光标; Alt+点击/拖动 = 列块选区 (Sakura Shift+F6 的等价物之一)

/* 屏幕坐标 -> (行, 列).
   两种 DOM 形态都要认: 打字时整篇是**一个文本节点** (paintActive, 行以 \n 相连), 有选区/列块/Vim 时是每行一个 .hl-row (renderVim).
   以前这里只认后一种, 而且把已经排除在编辑区之外的行号栏宽度又减了一次、还漏了 8px 内边距:
   结果普通打字状态下点击/拖选/Alt 拖选完全无效, 有 .hl-row 时列号也整体偏 4 列.
   现在: 先用浏览器自己的 caretRangeFromPoint 取命中的字符位置 (CJK / emoji / 变宽字体都准),
   只有「落在行尾之外」的虚拟列 (矩形选择允许点到行尾右侧) 才用字符宽度折算. */
let _cwCache = { font: "", w: 0 };
function monoCharWidth() {
  const cs = getComputedStyle(edContent);
  if (_cwCache.font === cs.font && _cwCache.w) return _cwCache.w;
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" + cs.font + ";letter-spacing:" + cs.letterSpacing;
  probe.textContent = "0".repeat(40);
  document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 40;
  probe.remove();
  _cwCache = { font: cs.font, w: w || 8 };
  return _cwCache.w;
}
// 把浏览器返回的 Range 端点换成 (行, 列[码点])
function posFromCaretRange(rg) {
  const node = rg && rg.startContainer;
  if (!node || node.nodeType !== 3 || !edContent.contains(node)) return null;
  const off = rg.startOffset;
  if (edContent.childNodes.length === 1 && edContent.firstChild === node) {      // 整篇一个文本节点
    const text = node.data;
    let row = 0;
    for (let i = text.indexOf("\n"); i >= 0 && i < off; i = text.indexOf("\n", i + 1)) row++;
    const lineStart = text.lastIndexOf("\n", off - 1) + 1;
    return { row, col: charLen(text.slice(lineStart, off)) };
  }
  let el = node;
  while (el && el.parentNode !== edContent) el = el.parentNode;                // 找到所在的 .hl-row / .fold-row
  if (!el) return null;
  if (el.classList && (el.classList.contains("vs-top") || el.classList.contains("vs-bot"))) return null;     // 点在占位上
  const row = rowOfEl(el);
  let col = 0;
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = tw.nextNode())) {
    if (n === node) { col += charLen(n.data.slice(0, off)); break; }
    col += charLen(n.data);
  }
  return { row, col };
}
function posFromEvent(e, virtualCols) {
  const t = getActiveTab();
  if (!t) return null;
  const lastRow = Math.max(0, t.lines.length - 1);
  let hit = null;
  if (document.caretRangeFromPoint) hit = posFromCaretRange(document.caretRangeFromPoint(e.clientX, e.clientY));
  const cs = getComputedStyle(edContent);
  const rect = edContent.getBoundingClientRect();
  const lineH = parseFloat(cs.lineHeight) || 18;
  let row, col;
  if (hit) {
    row = hit.row; col = hit.col;
  } else {                                           // 退路: 纯算术 (等宽 ASCII 准确)
    const chW = monoCharWidth();
    row = Math.floor((e.clientY - rect.top - parseFloat(cs.paddingTop) + edContent.scrollTop) / lineH);
    col = Math.round((e.clientX - rect.left - parseFloat(cs.paddingLeft) + edContent.scrollLeft) / chW);
  }
  row = Math.max(0, Math.min(lastRow, row));
  const len = charLen(t.lines[row] || "");
  col = Math.max(0, col);
  if (virtualCols && hit && col >= len) {
    // 点在行尾右侧: 用行尾的屏幕位置折算出虚拟列 (矩形选择可以选到行尾之外)
    const rg = document.caretRangeFromPoint(e.clientX, e.clientY);
    const endX = rg ? rg.getBoundingClientRect().left : 0;
    const extra = rg && e.clientX > endX ? Math.round((e.clientX - endX) / monoCharWidth()) : 0;
    col = len + Math.max(0, extra);
  } else {
    col = Math.min(col, len);
  }
  return { row, col };
}

/* 拖动状态: null = 没在拖. 拖动中用 window 监听, 否则指针滑出编辑区就断. */
let colDrag = null;     // Alt 拖 = 矩形选择
let selDrag = null;     // 普通拖 = 范围选择

function normalizeSel(a, b) {                         // 按文档顺序 (起点在前), 起点==终点则无选区
  if (a.row === b.row && a.col === b.col) return null;
  const fwd = a.row < b.row || (a.row === b.row && a.col <= b.col);
  const s0 = fwd ? a : b, s1 = fwd ? b : a;
  return { r0: s0.row, c0: s0.col, r1: s1.row, c1: s1.col };
}

edContent.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  const tv = getActiveTab();
  if (!tv) return;
  const rect = edContent.getBoundingClientRect();
  if (e.clientX - rect.left > edContent.clientWidth || e.clientY - rect.top > edContent.clientHeight) return;   // 点在滚动条上
  const p = posFromEvent(e, e.altKey);
  if (!p) return;
  const { row, col } = p;
  if (e.altKey) {
    e.preventDefault();
    edContent.focus({ preventScroll: true });
    startColumnSelect(row, col);
    // 之前只有按下没有拖动: Alt+拖只能点出一个 1x1 的块, 拖不出矩形.
    // 记下拖动态, 由 window 上的 mousemove/mouseup 收尾.
    colDrag = { anchorRow: row, anchorCol: col };
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    addCursor(tv, row, col);
    renderVim(tv);
    setTip(cursorsOf(tv).length + " 个光标");
    return;
  }
  // 普通点击: 落光标; 按住不放拖动 = 范围选择; Shift+点击 = 从当前光标扩到点击处
  e.preventDefault();
  edContent.focus({ preventScroll: true });
  const hadMark = !!(tv.sel || tv.colSel || (tv.cursors && tv.cursors.length > 1));
  const anchor = e.shiftKey ? { row: tv.cursor.row, col: tv.cursor.col } : { row, col };
  if (tv.cursors && tv.cursors.length > 1) clearCursors(tv);
  tv.colSel = null;
  syncColumnSelectUI(tv);
  tv.cursor = { row, col };
  tv.sel = normalizeSel(anchor, { row, col });
  tv.selAnchor = anchor;
  selDrag = { anchor };
  if (tv.sel || hadMark) renderVim(tv); else { setPos("Ln " + (row + 1) + ", Col " + (col + 1)); updateCaret(false); }
});

if (typeof window !== "undefined") {
  window.addEventListener("mousemove", (e) => {
    if (colDrag) {
      const p = posFromEvent(e, true);
      if (!p) return;
      e.preventDefault();
      extendColumnSelect(p.row, p.col);
      return;
    }
    if (selDrag) {
      const tv = getActiveTab();
      const p = tv && posFromEvent(e, false);
      if (!p) return;
      e.preventDefault();
      if (p.row === tv.cursor.row && p.col === tv.cursor.col) return;
      tv.cursor = { row: p.row, col: p.col };
      tv.sel = normalizeSel(selDrag.anchor, p);
      renderVim(tv);
      setPos("Ln " + (p.row + 1) + ", Col " + (p.col + 1));
    }
  });
  window.addEventListener("mouseup", () => {
    if (selDrag) selDrag = null;
    if (!colDrag) return;
    colDrag = null;
    const t = getActiveTab();
    if (t && t.colSel) {
      const { r0, r1, c0, c1 } = colSelRect(t);
      // 拖完直接把光标对齐到列块右下角, 接着就能打字 / 继续拖.
      t.cursor.row = r1;
      t.cursor.col = c1;
      renderVim(t);
      setTip("列块 " + (r1 - r0 + 1) + "行 ×" + Math.max(1, c1 - c0) + "列");
    }
  });
}
// 行号栏跟随正文滚动 (#gutter 是 overflow:hidden, 不同步则 300 行文件滚到底时旁边仍是 1-37)
edContent.addEventListener("scroll", () => { if (VW.on || vwActive(getActiveTab())) vwSync(getActiveTab()); gutter.scrollTop = edContent.scrollTop; updateCaret(false); });
// 编辑区尺寸变了 (开关侧栏 / 行号 / 缩略图 / 拖窗口) 光标的屏幕位置跟着变; 自动换行会换行点
if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => updateCaret(false)).observe(edContent);

if (edContent) edContent.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229 || e.key === "Process" || IME_ACTIVE) return;   // 输入法组合中: 交给输入法
  try { recordKey(e); } catch (_) { /* 录制不影响主流程 */ }
  const t = getActiveTab();
  // Vim 关闭时不看 #s-mode (静态标记里写着 data-mode="NORMAL", 启动后头几个键会被当成 vim 命令吞掉), 直接是 INSERT
  const vim = LAYOUT.vimOn();
  const mode = vim ? (document.getElementById("s-mode").dataset.mode || "NORMAL") : "INSERT";
  if (t && !t.undo) { t.undo = []; t.redo = []; }
  if (t && !t.folded) t.folded = new Set();
  if (t && !t.dirty) t.dirty = false;

  // Sakura 键盘移动 / 范围选择 / 选区替换式编辑 / Ins 覆盖 (列块和 Alt 组合另有处理)
  if (t && mode === "INSERT" && !e.altKey && !e.metaKey && !t.colSel && handleEditNavKey(e, t, vim)) return;

  if (e.ctrlKey) {
    const k = e.key.toLowerCase();
    if (k === "s") { e.preventDefault(); saveByKey(e); return; }
    if (k === "n") {
      e.preventDefault();
      // 极简布局下 Ctrl+N 是「新建」(没有补全列表时); 事件冒泡到 document 的处理器里才真正建文档, 这里不能重复建
      if (layoutPreset() !== "min" || COMPLETE_STATE.list.length) completionNext(1);
      return;
    }
    if (k === "p") { e.preventDefault(); completionNext(-1); return; }
    if (k === "z") { e.preventDefault(); doUndo(); return; }
    if (k === "y") { e.preventDefault(); doRedo(); return; }
    // 下面原本那个无条件 return 会吞掉**所有** Ctrl 组合, 但 document 上的处理器才是
    // 大部分快捷键的真正落点 (Ctrl+U / Ctrl+E / Ctrl+Backspace / Ctrl+Shift+K …).
    // 不放行的话, Sakura 增删改那批键位在编辑区获得焦点时按了没反应.
    // 只放行 Sakura 系列 + Ctrl+Delete (本项目原有的「删除下方行」走 document 的快捷键);
    // 其余 Ctrl 键维持原来的「吞掉」行为, 免得补全 / 宏之类被文档层抢走.
    const editorKey = (!e.shiftKey && (k === "u" || k === "e" || e.key === "Backspace"))
      || (e.shiftKey && (k === "u" || k === "k"))
      || (e.shiftKey && (e.key === "Backspace" || e.key === "ArrowUp" || e.key === "ArrowDown"));
    const isPaste = !e.shiftKey && k === "v";     // 留给 paste 事件 (读系统剪贴板)
    if (!editorKey && e.key !== "Delete" && !isPaste) { e.preventDefault(); }
    return;
  }

  if (e.key === "Escape") {
    const tv = getActiveTab();
    document.getElementById("completion-popup")?.remove();
    COMPLETE_STATE = { list: [], idx: -1, prefix: "" };
    if (tv) {
      if (tv.cursors && tv.cursors.length > 1) { clearCursors(tv); setTip("已退出多光标"); }
      else if (tv.colSel) { clearColumnSelect(tv); setTip("已退出列选择"); }
      else if (tv.sel) tv.sel = null;
      renderVim(tv);
    }
    setMode("NORMAL");
    e.preventDefault();
    return;
  }

  if (mode === "INSERT") {
    // Alt+方向键 / Alt+Home / Alt+End = 矩形选取 (Sakura F_UP_BOX 等), 一律归全局的
    // boxMove/boxEdge. 必须在**这个 if 之前**就放行:
    //  1) 列块还没建立时 (第一次按 Alt+↓), 下面的 colSel 分支进不去, 事件会掉到
    //     末尾的普通 moveCaretDown —— 光标被普通移动一行, 之后 boxMove 再从移动后的
    //     行起锚, 结果第一次就跨了 2 行 (实测 r0=1 而不是 0).
    //  2) 列块已存在时, 下面那段会再扩一次格, 一次按键变两格.
    if (e.altKey && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    // 列块选区优先接管一切文本编辑: 在列块里打任何字符 / 回车 / 退格 / Delete,
    // 都作用在**每一行**的同一列上, 而不是只作用在光标那一行 (Sakura Shift+F6 行为).
    // 这是「一次性给多行同一位置添加内容」的能力入口.
    if (t && t.colSel) {
      // 列块内的方向键: 上下只动**活动角**那一行的边界, 左右只动列边界.
      // 活动角 = 键盘最后碰过的那个角 (Sakura 语义: 上下键永远从当前活动角延伸,
      // 不管锚点在哪一侧). 用 t.cursor 记录活动角, 而不是拿 min/max 推断 ——
      // 推断会在 r0===r1 时把 Math.min(Math.max(r0,r1), r1+1) 算成 min(0,1)=0, 卡死不动.
      const rect = colSelRect(t);
      const actR = (t.colActiveRow !== undefined) ? t.colActiveRow : rect.r1;
      const actC = (t.colActiveCol !== undefined) ? t.colActiveCol : rect.c1;
      const lastRow = Math.max(0, t.lines.length - 1);
      let nr = actR, nc = actC, moved = true;
      if (e.key === "ArrowLeft") nc = Math.max(0, actC - 1);
      else if (e.key === "ArrowRight") nc = actC + 1;
      else if (e.key === "ArrowUp") nr = Math.max(rect.r0, actR - 1);
      else if (e.key === "ArrowDown") nr = Math.min(lastRow, actR + 1);
      else if (e.key === "Home") nc = 0;
      else if (e.key === "End") nc = Number.MAX_SAFE_INTEGER;
      else moved = false;
      // (Alt+方向键 的情况已经在本 if 入口处 return 了, 不会走到这里)
      if (moved) {
        e.preventDefault();
        t.colActiveRow = nr;
        t.colActiveCol = nc;
        extendColumnSelect(nr, nc);
        t.cursor.row = nr;
        t.cursor.col = Math.min(nc, Number.MAX_SAFE_INTEGER);
        updateCaret(false);
      }
      if (e.key === "Enter") { e.preventDefault(); columnInsert("\n"); return; }
      if (e.key === "Tab") { e.preventDefault(); columnInsert("\t"); return; }
      if (e.key === "Backspace") { e.preventDefault(); columnBackspace(); return; }
      if (e.key === "Delete") { e.preventDefault(); columnDelete(); return; }
      if (!moved && e.key.length === 1 && !(e.ctrlKey || e.metaKey) && !(e.altKey && !vim)) {
        e.preventDefault(); columnInsert(e.key); return;
      }
      return;
    }
    if (e.shiftKey && e.key === "Tab") { e.preventDefault(); indentSelection(true); return; }   // Shift+Tab = 反缩进 (F_UNINDENT_TAB)
    if (e.key === "Tab") { e.preventDefault(); insertCharMulti(vim ? "  " : "\t"); return; }   // Sakura: Tab 插入 TAB 字符
    if (e.key === "Backspace") { e.preventDefault(); backspaceMulti(); return; }
    if (e.key === "Enter") { e.preventDefault(); insertNewline(); return; }
    if (e.key === "Delete") { e.preventDefault(); runEdit("delete"); return; }
    // Ctrl+Space 补全 (非 Vim INSERT 模式也应触发) —— SPA-03 §9 fix: Ctrl+Space 补全是死代码
    if (e.ctrlKey && e.key === " ") { e.preventDefault(); showCompletion(); return; }
    // 非模态编辑器的基本功 (Sakura 用户的肌肉记忆): Home / End. Vim 开着时 INSERT 保持原样
    if (!vim && t && e.key === "Home") { e.preventDefault(); t.cursor.col = 0; paintActive(); return; }
    if (!vim && t && e.key === "End") { e.preventDefault(); t.cursor.col = charLen(curLine(t)); paintActive(); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); if (t) { moveCaretLeft(t); paintActive(); } return; }
    if (e.key === "ArrowRight") { e.preventDefault(); if (t) { moveCaretRight(t); paintActive(); } return; }
    if (e.key === "ArrowUp") { e.preventDefault(); if (t) { moveCaretUp(t); paintActive(); } return; }
    if (e.key === "ArrowDown") { e.preventDefault(); if (t) { moveCaretDown(t); paintActive(); } return; }
    if (e.ctrlKey && e.key === " ") { e.preventDefault(); showCompletion(); return; }
    // 非模态下 Alt+字母是菜单助记键 (Alt+F 开文件菜单), 不能同时往文档里打一个字母; Vim 开着时保持原行为
    if (e.key.length === 1 && (vim || !(e.altKey || e.metaKey))) { e.preventDefault(); insertCharMulti(e.key); return; }
    return;
  }

  if (e.ctrlKey && e.key === " ") { e.preventDefault(); showCompletion(); return; }
  if (e.key === "F12") { e.preventDefault(); gotoDefinitionLocal(); return; }

  // --- NORMAL / VISUAL ---
  // 列块选区在 NORMAL 模式下也支持直接字符插入 (每行同列插入) —— SPA-03 §9 fix
  if (t && t.colSel) {
    if (e.key.length === 1 && !(e.ctrlKey || e.metaKey || e.altKey)) {
      e.preventDefault(); columnInsert(e.key); return;
    }
    if (e.key === "Backspace") { e.preventDefault(); columnBackspace(); return; }
    if (e.key === "Delete") { e.preventDefault(); columnDelete(); return; }
    if (e.key === "Enter") { e.preventDefault(); columnInsert("\n"); return; }
    if (e.key === "Tab") { e.preventDefault(); columnInsert("\t"); return; }
  }
  const nav = {
    ArrowLeft: [-1, 0], h: [0, -1], ArrowUp: [-1, 0], k: [-1, 0],
    ArrowRight: [0, 1], l: [0, 1], ArrowDown: [1, 0], j: [1, 0],
  };
  if (t) {
    if (nav[e.key]) {
      e.preventDefault();
      const [dr, dc] = nav[e.key];
      if (dr !== 0) {
        if (dr > 0) moveCaretDown(t); else moveCaretUp(t);
      } else if (dc !== 0) {
        if (dc > 0) moveCaretRight(t); else moveCaretLeft(t);
      }
      // VISUAL: 移动即扩展选区
      if (mode === "VISUAL" && t.sel) {
        t.sel.r1 = t.cursor.row;
        t.sel.c1 = t.cursor.col + (nav[e.key][1] < 0 ? 0 : 1);
        renderVim(t);
      } else {
        paintActive();
      }
      return;
    }
    if (e.key === "0") { e.preventDefault(); t.cursor.col = 0; paintActive(); return; }
    if (e.key === "$") { e.preventDefault(); t.cursor.col = charLen(curLine(t)); paintActive(); return; }
    if (e.key === "G") { e.preventDefault(); t.cursor.row = t.lines.length - 1; t.cursor.col = 0; paintActive(); return; }
    if (e.key === "x") { e.preventDefault(); normalDeleteChar(); return; }
    if (e.key === "u") { e.preventDefault(); doUndo(); return; }
    // dd = 删除当前行. deleteLine() 早就写好了但没接到键盘上 ——
    // NORMAL 模式只实现了 0 $ G x u z, dd/D/C 之类双键命令全部缺失,
    // 而 dd 是 vim / 传统编辑器最基础的操作.
    // pendingD 用超时兜底: 800ms 内没等到第二个 d 就当单键 d 处理 (无操作).
    if (e.key === "d") {
      e.preventDefault();
      if (pendingD) {
        pendingD = false;
        clearTimeout(pendingDTimer);
        deleteLine();
        setTip("已删除行");
      } else {
        pendingD = true;
        clearTimeout(pendingDTimer);
        pendingDTimer = setTimeout(() => { pendingD = false; }, 800);
      }
      return;
    }
    // p = 在当前行下粘贴 (yank 需要剪贴板, 这里用系统剪贴板不可靠,
    // 改为复制到 tab 内的 clipboard 槽, p 从那里取)
    if (e.key === "p") {
      e.preventDefault();
      const line = curLine(t);
      t.undo.push({ lines: t.lines.slice(), cursor: { ...t.cursor } });
      t.lines.splice(t.cursor.row + 1, 0, line);
      t.cursor.row += 1;
      t.dirty = true;
      paintActive();
      setTip("已粘贴行");
      return;
    }
    if (e.key === "z" && pendingZ) {
      e.preventDefault();
      const k = e.key;
      pendingZ = false;
      if (k === "c") { foldAtCursor(t); renderVim(t); return; }
      if (k === "o") { unfoldAtCursor(t); renderVim(t); return; }
      if (k === "M") { foldAll(t); renderVim(t); return; }
      if (k === "R") { unfoldAll(t); renderVim(t); return; }
    }
    if (e.key === "z") { e.preventDefault(); pendingZ = true; setTimeout(() => { pendingZ = false; }, 800); return; }
    // 任意其它键都应清掉 dd 的挂起状态, 否则 pendingD 会一直等第二个 d
    pendingD = false;
  }
  if (e.key === "i" || e.key === "a" || e.key === "o" ||
      e.key === "I" || e.key === "A" || e.key === "O") {
    // Vim 语义: a 光标后, A 行尾, I 行首非空白, o/O 在下/上开新行
    if (t && t.cursor) {
      const line = t.lines[t.cursor.row] || "", n = charLen(line), k = e.key;
      if (k === "a") t.cursor.col = Math.min(n, t.cursor.col + 1);
      else if (k === "A") t.cursor.col = n;
      else if (k === "I") t.cursor.col = charLen((line.match(/^[ \t]*/) || [""])[0]);
      else if (k === "o") { e.preventDefault(); setMode("INSERT"); addLineBelow(); return; }
      else if (k === "O") { e.preventDefault(); setMode("INSERT"); addLineAbove(); return; }
    }
    setMode("INSERT");
    e.preventDefault();
    return;
  }
  if (e.key === "v") {
    setMode("VISUAL");
    if (t) t.sel = { r0: t.cursor.row, c0: t.cursor.col, r1: t.cursor.row, c1: t.cursor.col + 1 };
    e.preventDefault();
    return;
  }
});

// 目录懒加载: 首次点击拉子项并插入到该节点之后
async function toggleTreeDir(node) {
  if (node.dataset.expanded === "1") {
    // 已展开 -> 收起
    let n = node.nextElementSibling;
    while (n && n.classList.contains("tree-child")) {
      const nx = n.nextElementSibling;
      n.remove();
      n = nx;
    }
    node.dataset.expanded = "";
    node.classList.add("tree-collapsed");
    return;
  }
  const path = node.dataset.path;
  node.dataset.expanded = "1";
  node.classList.remove("tree-collapsed");
  let entries;
  try {
    entries = await invoke("list_dir", { path });
  } catch (e) {
    setTip("展开失败: " + e.message);
    node.dataset.expanded = "";
    node.classList.add("tree-collapsed");
    return;
  }
  const frag = document.createDocumentFragment();
  for (const e of entries) {
    const child = document.createElement("div");
    child.className = "tree-node tree-child" + (e.is_dir ? " tree-folder tree-collapsed" : " tree-file");
    child.innerHTML = '<span class="tree-icon">' + (e.is_dir ? "\u{1F4C1}" : "\u{1F4C4}") + "</span>" + escapeHtml(e.name);
    child.dataset.path = stripVerbatim(e.path);
    child.dataset.name = e.name;
    child.style.setProperty("--depth", String((parseInt(node.style.getPropertyValue("--depth"), 10) || 0) + 1));
    if (e.is_dir) child.addEventListener("click", () => toggleTreeDir(child));
    else child.addEventListener("click", () => openFile(child.dataset.path));
    frag.appendChild(child);
  }
  node.after(frag);
}

// Extensions 面板: 目前没有插件运行时, 给出明确占位 + 配置入口说明
function renderExtensions(host) {
  host = host || sideBody;
  host.innerHTML =
    '<div class="sb-section">扩展</div>' +
    '<div class="empty-hint">尚无已安装扩展<br><br>' +
    '扩展面板为占位实现。editcore 已有 wasm 插件加载骨架<br>' +
    '(crates/editcore/src/plugin.rs), 接入后此处列出已装扩展.</div>';
}

// ===== Side bar =====
let currentSidePane = "explorer";

// opts.reveal === false: 只切换内容不亮出侧栏 (启动时的初始渲染; 其余调用方都是用户要看这个面板, 侧栏隐藏就先亮出来)
function showSidePane(name, opts) {
  if (!(opts && opts.reveal === false)) revealRegion("sideBar");
  currentSidePane = name;
  document.querySelectorAll(".act-btn").forEach((b) => b.classList.toggle("active", b.dataset.pane === name));
  renderSideBar();
}

// 每个 pane 渲染成 <div id="<name>-pane.active">, 这样 #scm-pane.active /
// #search-pane.active 这类断言成立, 也保持「同一时刻只有一个 pane active」的语义.
const SIDE_PANES = {
  explorer:   { title: "资源管理器", render: renderExplorer },
  search:     { title: "搜索",       render: renderSearch },
  scm:        { title: "源代码管理", render: renderScm },
  outline:    { title: "大纲",       render: renderOutline },
  extensions: { title: "扩展",       render: renderExtensions },
};

function renderSideBar() {
  DRAWER.leftStale = false;      // 内容刚画过: 极简布局里左抽屉紧随其后的「展开刷新」不必再拉一遍 list_dir
  sideTabsEl.innerHTML = Object.keys(SIDE_PANES).map((key) => {
    const def = SIDE_PANES[key];
    const cls = key === currentSidePane ? "side-tab active" : "side-tab";
    return '<button class="' + cls + '" data-side-tab="' + key + '">' + def.title + "</button>";
  }).join("");
  // 只渲染当前 pane; 旧契约要求 #<name>-pane.active 存在
  const active = document.createElement("div");
  active.id = currentSidePane + "-pane";
  active.className = "side-pane active";
  sideBody.replaceChildren(active);
  const def = SIDE_PANES[currentSidePane];
  if (def) def.render(active);
}

if (sideTabsEl) sideTabsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-side-tab]");
  if (b) showSidePane(b.dataset.sideTab);
})

// #sb-project-name: 单击 = 重开文件夹选择流程, Shift+单击 = 仅刷新文件树
if (sideBody) sideBody.addEventListener("click", (e) => {
  const nameEl = e.target.closest("#sb-project-name");
  if (!nameEl) return;
  if (e.shiftKey) {
    renderExplorer();          // 重新拉 list_dir
    setTip("已刷新文件树");
  } else {
    openFolder();              // 重走打开项目流程
  }
});;

document.querySelectorAll(".act-btn").forEach((btn) => {
  btn.addEventListener("click", () => showSidePane(btn.dataset.pane));
});

async function renderExplorer(host) {
  host = host || sideBody;
  if (!projectRoot) {
    // 极简布局没有工具栏: 给一个真按钮 (全局 [data-cmd] 委托会派发 open-folder), 和欢迎页的「打开文件夹」是同一个命令
    host.innerHTML = layoutPreset() === "min"
      ? '<div class="empty-hint">未打开项目<br><br><button class="md-btn primary" data-cmd="open-folder" data-tip="打开文件夹 (Ctrl+Shift+O)">打开文件夹</button></div>'
      : '<div class="empty-hint">未打开项目<br><br>点工具栏「打开文件夹」导入项目</div>';
    return;
  }
  // 项目根行: 单击 = 换项目, Shift+单击 = 刷新树 (替代旧的 打开/刷新 两个按钮)
  host.innerHTML =
    '<div id="sb-project-name" data-tip="点击换项目 · Shift+点击刷新文件树" title="点击换项目 · Shift+点击刷新文件树">' +
    escapeHtml(String(stripVerbatim(projectRoot)).split(/[\\\/]/).pop() || stripVerbatim(projectRoot)) +
    "</div>";
  try {
    const entries = await invoke("list_dir", { path: stripVerbatim(projectRoot) });
    for (const e of entries) {
      const node = document.createElement("div");
      node.className = "tree-node" + (e.is_dir ? " tree-folder" : " tree-file");
      node.innerHTML = '<span class="tree-icon">' + (e.is_dir ? "\u{1F4C1}" : "\u{1F4C4}") + "</span>" + escapeHtml(e.name);
      node.dataset.path = stripVerbatim(e.path);
      node.dataset.name = e.name;
      if (e.is_dir) {
        // 目录: 懒加载展开 (再点一次收起)
        node.classList.add("tree-collapsed");
        node.addEventListener("click", () => toggleTreeDir(node));
      } else {
        node.addEventListener("click", () => openFile(node.dataset.path));
      }
      host.appendChild(node);
    }
  } catch (e) {
    host.innerHTML += '<div class="empty-hint">读取失败: ' + escapeHtml(e.message) + "</div>";
  }
}

function renderSearch(host) {
  host = host || sideBody;
  host.innerHTML = '<input id="search-input" placeholder="搜索文件..." style="width:100%;padding:4px 6px;background:#3c3c3c;color:white;border:1px solid #555;border-radius:3px;font:inherit;" />' +
    '<div id="search-results" style="margin-top:8px;"></div>';
  const input = document.getElementById("search-input");
  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const q = input.value.trim();
      if (!q) return;
      try {
        // search 后端返回 {results:[{line,path,text}]}, 参数名是 pattern (不是 query),
        // 且 line 已是 1-based —— 前端 曾按 数组 + query 解析, 每次 都 静默 失败.
        const resp = await invoke("search", { pattern: q, case_sensitive: false, regex: false });
        const matches = (resp && resp.results) || [];
        const r = document.getElementById("search-results");
        r.innerHTML = "";
        for (const m of matches) {
          const row = document.createElement("div");
          row.className = "tree-node";
          row.textContent = m.path + ":" + m.line;
          row.addEventListener("click", () => openFile(m.path));
          r.appendChild(row);
        }
        if (matches.length === 0) r.innerHTML = '<div class="empty-hint">无匹配</div>';
      } catch (e) { /* ignore */ }
    }
  });
  input.focus();
}

async function renderScm(host) {
  host = host || sideBody;
  host.innerHTML = '<div class="sb-section">源代码管理</div><div id="scm-status">加载中...</div>';
  try {
    const j = await invoke("scm_status");
    const statusEl = host.querySelector("#scm-status");
    statusEl.innerHTML =
      '<div class="empty-hint">当前分支: <b id="scm-branch">' + escapeHtml(j.branch || "(no branch)") + "</b></div>";
    if (j.files) {
      for (const f of j.files) {
        const row = document.createElement("div");
        row.className = "tree-node";
        row.textContent = "  " + (f.status || "?") + " " + f.path;
        statusEl.appendChild(row);
      }
    }
  } catch (e) {
    document.getElementById("scm-status").innerHTML = '<div class="empty-hint">未初始化 git 仓库</div>';
  }
}

async function renderOutline(host) {
  host = host || sideBody;
  const at = getActiveTab();
  if (!at) {
    host.innerHTML = '<div class="empty-hint">打开一个文件查看大纲</div>';
    return;
  }
  if (at.untitled) {                       // 没有路径可交给后端解析
    host.innerHTML = '<div class="empty-hint">保存后才有大纲</div>';
    return;
  }
  host.innerHTML = '<div class="sb-section">' + escapeHtml(at.path.split(/[\\\/]/).pop() || "") + "</div><div id='outline-list'>加载中...</div>";
  try {
    const data = await invoke("outline", { path: at.path });
    const list = document.getElementById("outline-list");
    list.innerHTML = "";
    if (data && data.entries) {
      for (const e of data.entries) {
        const row = document.createElement("div");
        row.className = "tree-node";
        const ICON = { function: "ƒ", method: "m", class: "C", struct: "S", enum: "E", interface: "I", namespace: "N", union: "U", trait: "T", record: "R", section: "§" };
        row.textContent = (ICON[e.kind] || "•") + " " + e.name;
        row.dataset.kind = e.kind; row.dataset.depth = String(e.depth | 0);
        row.style.paddingLeft = (8 + (e.depth | 0) * 14) + "px";            // 按所在 class / namespace / 标题层级缩进
        row.addEventListener("click", () => { const tt = getActiveTab(); if (tt) { diffJump(tt, e.line | 0); setTip("跳到 " + ((e.line | 0) + 1) + " 行"); } });
        list.appendChild(row);
      }
      if (data.entries.length === 0) list.innerHTML = '<div class="empty-hint">无大纲 (' + (data.language || "?") + ")</div>";
    }
  } catch (e) {
    document.getElementById("outline-list").innerHTML = '<div class="empty-hint">解析失败</div>';
  }
}

// modal 输入框: 原生 prompt() 在无头浏览器里不响应会一直挂着阻塞,
// 而且不可断言 —— web-editor.spec 期望 .md-input 带默认值 + Enter 提交.
// value 预填, Enter (或点击 cmd) 触发 onSubmit, Esc/取消关闭.
let mdInputSubmit = null;
function openModalInput(title, value, onSubmit) {
  mdBody.innerHTML = '<input type="text" class="md-input" spellcheck="false">';
  const input = mdBody.querySelector(".md-input");
  input.value = value || "";
  mdFoot.innerHTML = "";
  const ok = document.createElement("button");
  ok.className = "md-btn";
  ok.textContent = "确定";
  ok.dataset.cmd = "modal-input-ok";
  const cancel = document.createElement("button");
  cancel.className = "md-btn";
  cancel.textContent = "取消";
  cancel.dataset.cmd = "modal-close";
  mdFoot.appendChild(ok);
  mdFoot.appendChild(cancel);
  mdInputSubmit = () => { const v = input.value.trim(); mdInputSubmit = null; closeModal(); if (v) onSubmit(v); };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); mdInputSubmit && mdInputSubmit(); }
    else if (e.key === "Escape") { mdInputSubmit = null; closeModal(); }
  });
  modal.classList.add("show");
  input.focus();
  input.select();
}

function openOptionList(key) {
  const cfg = SETTINGS[key];
  if (!cfg) { setTip("无此设置面板"); return; }
  const items = typeof cfg.items === "function" ? cfg.items() : cfg.items;
  const rows = items.map((it) =>
    '<div class="opt-row"' + (it.cmd ? ' data-opt="' + escapeHtml(it.cmd) + '"' : "") +
    ' title="' + escapeHtml(it.cmd ? "点击执行" : "说明") + '">' + escapeHtml(it.label) + "</div>").join("");
  openModal({ title: cfg.title, bodyHTML: rows, buttons: [{ label: "关闭", cmd: "modal-close" }] });
}

// openModal 增加 bodyHTML 支持 (原实现只写 textContent).
// 注意: 不能用 `const _raw = openModal` 的包装写法 —— 那会读到包装函数自身,
// 造成自引用; 改为给原实现加一个 _bodyHTML 字段分支.
function showModal(opts) {
  const title = opts.title || "提示";
  // #md-body 是常驻节点 (overflow:auto): 只替换内容不会重置滚动偏移, 下一个对话框会带着上一个的偏移打开 (首行被截在上方).
  // 同一个对话框原地重绘 (已显示且标题相同) 保留滚动位置; 其余情况 (关闭后再开 / 换成另一个对话框) 回到顶部.
  const keepScroll = modal.classList.contains("show") && mdTitle.textContent === title;
  mdTitle.textContent = title;
  if (opts.bodyHTML != null) mdBody.innerHTML = opts.bodyHTML;
  else mdBody.textContent = opts.body || "";
  mdFoot.innerHTML = "";
  (opts.buttons || [{ label: "关闭", cmd: "modal-close" }]).forEach((b) => {
    const btn = document.createElement("button");
    btn.className = "md-btn";
    btn.textContent = b.label;
    btn.dataset.cmd = b.cmd;
    if (b.tip) btn.dataset.tip = b.tip;
    mdFoot.appendChild(btn);
  });
  modal.classList.add("show");
  // 放在 show 之后: #modal 在隐藏时是 display:none, 对没有布局框的元素设 scrollTop 不生效.
  if (!keepScroll) mdBody.scrollTop = 0;
}

const THEME_LABELS = { clear: "透明玻璃", dark: "深色", light: "浅色", hc: "高对比度" };

function setTheme(mode) {
  const t = THEMES[mode] || THEMES.dark;
  const root = document.documentElement;
  const prev = root.getAttribute("data-theme");
  // 非 clear 主题靠 JS 注入 CSS 变量, 必须先清掉上一主题留下的 inline,
  // 否则 inline style 会压过 [data-theme="clear"] 的 CSS 规则.
  if (prev && prev !== mode) {
    Object.keys(THEMES[prev] || {}).forEach((k) => root.style.removeProperty(k));
  }
  // data-theme 属性让 CSS 选择器接管; clear 主题完全靠它.
  // dark/light 也设上, 与透明主题 CSS 里的 [data-theme="dark"] 定义协同.
  if (mode === "clear") {
    // 先用深色默认立即生效 (避免等 IPC 时闪白), 拿到后端探测结果再覆盖.
    root.removeAttribute("style");
    root.setAttribute("data-theme", "clear");
    root.style.background = "transparent";
    document.body.style.background = "transparent";
    applyClearThemeColors(t);
    void refreshClearThemeFromBackend();
  } else {
    Object.keys(t).forEach((k) => root.style.setProperty(k, t[k]));
    document.body.style.color = t["--fg"];
    document.body.style.background = t["--bg-edit"];
    root.setAttribute("data-theme", mode === "hc" ? "dark" : mode);
    if (mode === "hc") {
      // 高对比度只覆盖变量, 与 dark 同选择器
      root.style.setProperty("--border", "#ffffff");
    }
  }
  VIEW_STATE.theme = mode;
  localStorage.setItem("ide10.theme", mode);
  setTip("主题: " + (THEME_LABELS[mode] || mode));
  renderVim(getActiveTab());
}

// ---------------------------------------------------------------------------
// 透明玻璃主题 — 文字反色
// ---------------------------------------------------------------------------
// 透明主题下窗口背后是用户自己的桌面壁纸, 内容不可预测: 浅色壁纸配白字
// 完全读不清 (VS Code 的 Mica 主题靠跟随系统主题解决, 我们不跟随, 所以
// 必须自己探测). 明暗判定的唯一事实来源是 Rust 侧 (读注册表
// AppsUseLightTheme), 前端只消费结果, 避免两处逻辑漂移.

/** 把一整套 clear 主题变量写到 root 上 (同步部分, 立即生效). */
function applyClearThemeColors(vars) {
  const root = document.documentElement;
  for (const k of Object.keys(vars)) {
    if (k.startsWith("--")) root.style.setProperty(k, vars[k]);
  }
  // 桌面明暗只有后端知道; 暴露成属性, CSS 才能给"透明玻璃 + 浅色桌面"换语法色 / 选区色 / 悬停面纱 / 焦点环.
  // 兜底表 (THEMES.clear) 不带 luminance, 此时保持原值不动.
  if (vars.luminance) root.setAttribute("data-lum", vars.luminance);
  document.body.style.color = vars["--fg"] || "#ffffff";
}

/** 问后端要"桌面明暗 + 配色", 并应用. 失败时保持当前配色. */
async function refreshClearThemeFromBackend() {
  try {
    const vars = await invoke("clear_theme_vars");
    if (!vars || !vars["--fg"]) return;
    applyClearThemeColors(vars);
    VIEW_STATE.desktopLuminance = vars.luminance || "dark";
    localStorage.setItem("ide10.luminance", vars.luminance || "dark");
    renderVim(getActiveTab());
    setTip("主题: 透明玻璃 (文字反色: " +
      (vars.luminance === "light" ? "深色" : "浅色") + ")");
  } catch (e) {
    // 后端不可达 (纯前端预览 / 旧版本桌面端): 保留默认白字, 不报错.
    VIEW_STATE.desktopLuminance = "dark";
  }
}

/**
 * 监听系统明暗变化: 用户在 Windows 设置里切浅/深色后, 透明主题的
 * 文字颜色要跟着反色, 否则会突然读不清.
 *
 * 1s 轮询而非事件: WebView2 没有暴露 DWM 主题变化事件, 而注册表读一次
 * 极廉价 (µs 级). 页面隐藏时停轮询 (visibilitychange), 不浪费.
 */
let _luminancePollTimer = null;
let _luminanceBusy = false;
function startLuminanceWatch() {
  if (_luminancePollTimer) return;
  _luminancePollTimer = setInterval(async () => {
    if (VIEW_STATE.theme !== "clear") return;   // 非透明主题不需要反色
    if (document.hidden) return;                // 后台不轮询
    if (_luminanceBusy) return;                 // 上一轮还没回来
    _luminanceBusy = true;
    try {
      const lum = await invoke("desktop_luminance");
      // 只有真的变了才重新取全套配色 —— 否则每秒刷一次 setProperty
      // 会让 getComputedStyle 缓存失效, 拖慢渲染.
      if (lum !== VIEW_STATE.desktopLuminance) {
        VIEW_STATE.desktopLuminance = lum;
        await refreshClearThemeFromBackend();
      }
    } catch (_) {
      // 后端不可达: 保持现状, 下一轮再试
    } finally {
      _luminanceBusy = false;
    }
  }, 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && VIEW_STATE.theme === "clear") {
      void refreshClearThemeFromBackend();
    }
  });
}

/* ===== 查找 / 替换 / Grep / 跳转 (真实实现) =====
   后端 /api/search 支持 pattern / case_sensitive / regex / include_globs,
   之前前端只 dispatch 合成按键而没有接收方, 等于空壳. */


// 当前 tab 内查找 (返回 [{row, col, len}])
const escapeRegexSrc = (x) => String(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// 按 FIND_STATE 选项生成正则; 非法正则返回 null
function buildFindRegex(o, global = true) {
  if (!o.needle) return null;
  let src = o.useRegex ? o.needle : escapeRegexSrc(o.needle);
  if (o.wholeWord) src = "(?<![\\p{L}\\p{N}_])(?:" + src + ")(?![\\p{L}\\p{N}_])";
  const flags = (global ? "g" : "") + (o.matchCase ? "" : "i");
  try { return new RegExp(src, flags + "u"); } catch (_) { /* u 模式下非法转义 (如 \- ) 退回非 u */ }
  try { return new RegExp(src.replace(/\\p\{L\}\\p\{N\}/g, "A-Za-z0-9"), flags); } catch (_) { return null; }
}
// 列 / 长度一律按码点 (与光标列一致), 不是 UTF-16
function findInTab(t, needle, opts) {
  if (!t || !needle) return [];
  const re = buildFindRegex(Object.assign({}, opts, { needle }));
  if (!re) return [];
  const out = [];
  for (let r = 0; r < t.lines.length; r++) {
    const line = t.lines[r];
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(line))) {
      if (m[0] === "") { re.lastIndex++; continue; }                          // 空匹配不算命中
      out.push({ row: r, col: charLen(line.slice(0, m.index)), len: charLen(m[0]), text: m[0] });
      if (out.length > 5000) return out;
    }
  }
  return out;
}

function gotoHit(hit) {
  const t = getActiveTab();
  if (!t || !hit) return;
  t.cursor = { row: hit.row, col: hit.col };
  t.sel = { r0: hit.row, c0: hit.col, r1: hit.row, c1: hit.col + hit.len };
  t.selAnchor = { row: hit.row, col: hit.col };
  renderVim(t);
  setPos("Ln " + (hit.row + 1) + ", Col " + (hit.col + 1));
  scrollRowIntoView(hit.row, "nearest");
}

// dir: 1 下 / -1 上. 到头后按「先頭(末尾)から再検索」选项循环
function findStep(dir) {
  const t = getActiveTab();
  if (!t) return;
  if (!FIND_STATE.needle) { openFind(); return; }
  if (!buildFindRegex(FIND_STATE)) { setTip("正则表达式无效: " + FIND_STATE.needle); return; }
  const hits = findInTab(t, FIND_STATE.needle, FIND_STATE);
  FIND_STATE.hits = hits;
  if (hits.length === 0) { setTip("未找到: " + FIND_STATE.needle); scheduleMarks(); return; }
  const cr = t.cursor.row;
  let cc = t.cursor.col;
  if (dir > 0 && FIND_STATE.wholeWord && cc > 0) {          // Sakura: 单词单位搜索时, 光标在词中 -> 从该词词首起找 (命中当前词本身)
    const a = charArray(t.lines[cr] || "");
    if (isWordChar(a[cc - 1] || "") && isWordChar(a[cc] || "")) { while (cc > 0 && isWordChar(a[cc - 1])) cc--; }
  }
  let idx = -1, wrapped = false;
  // 当前命中正被选中时从它的「下一处」找; 否则 (光标只是停在那里) 光标位置上的命中本身也算
  const onHit = t.sel && t.sel.r0 === cr && t.sel.c0 === cc;
  if (dir > 0) {
    idx = hits.findIndex((h) => h.row > cr || (h.row === cr && (onHit ? h.col > cc : h.col >= cc)));
    if (idx < 0) { if (!FIND_STATE.wrap) { setTip("これ以上見つかりません (末尾)"); return; } idx = 0; wrapped = true; }
  } else {
    for (let i = hits.length - 1; i >= 0; i--) if (hits[i].row < cr || (hits[i].row === cr && hits[i].col < cc)) { idx = i; break; }
    if (idx < 0) { if (!FIND_STATE.wrap) { setTip("これ以上見つかりません (先頭)"); return; } idx = hits.length - 1; wrapped = true; }
  }
  FIND_STATE.idx = idx;
  gotoHit(hits[idx]);
  setTip((wrapped ? (dir > 0 ? "先頭から再検索しました — " : "末尾から再検索しました — ") : "") + "找到 " + (idx + 1) + "/" + hits.length);
}
function findNext() { findStep(1); }
function findPrev() { findStep(-1); }

// 查找/替换 面板 (modal; 选项对标 Sakura CDlgFind / CDlgReplace)
function openFindDialog(withReplace) {
  const t = getActiveTab();
  const cur = t && selNonEmpty(t) && t.sel.r0 === t.sel.r1 ? selectionText(t) : "";
  if (t) FIND_STATE.startPos = { row: t.cursor.row, col: t.cursor.col };
  const inp = 'style="width:100%;padding:4px 6px;background:#3c3c3c;color:white;border:1px solid #555;"';

  const html =
    '<div class="opt-row"><input id="find-input" placeholder="検索文字列" value="' + escapeHtml(cur || FIND_STATE.needle) + '" ' + inp + " /></div>" +
    (withReplace ? '<div class="opt-row"><input id="repl-input" placeholder="置換後" ' + inp + " /></div>" : "") +
    '<div class="opt-row">' + cb("find-case", "区分大小写", FIND_STATE.matchCase) + cb("find-word", "单词单位", FIND_STATE.wholeWord) + cb("find-regex", "正则", FIND_STATE.useRegex) + "</div>" +
    '<div class="opt-row">' + cb("find-wrap", "先頭(末尾)から再検索", FIND_STATE.wrap) + cb("find-marks", "全部强调显示", FIND_STATE.marks) + "</div>" +
    (withReplace ? '<div class="opt-row">置換対象: <label><input type="radio" name="find-scope" value="sel" ' + (FIND_STATE.scope === "sel" ? "checked" : "") + ' /> 选择范围</label> <label><input type="radio" name="find-scope" value="all" ' + (FIND_STATE.scope !== "sel" ? "checked" : "") + ' /> 文件全体</label></div>' : "") +
    '<div id="find-status" class="empty-hint"></div>';
  openModal({
    title: withReplace ? "置換" : "検索",

      { label: "↓ 下検索", cmd: "find-next" },

      { label: "关闭", cmd: "modal-close" },
    ],
  });
  const sync = () => {
    const g = (id) => document.getElementById(id);

    FIND_STATE.matchCase = g("find-case").checked; FIND_STATE.wholeWord = g("find-word").checked; FIND_STATE.useRegex = g("find-regex").checked;
    FIND_STATE.wrap = g("find-wrap").checked; FIND_STATE.marks = g("find-marks").checked;
    const sc = document.querySelector('input[name="find-scope"]:checked'); if (sc) FIND_STATE.scope = sc.value;
    const st = g("find-status");

    });
  }
  mdBody.querySelectorAll("input").forEach((i) => i.addEventListener("input", sync));
  mdBody.querySelectorAll("input[type=checkbox],input[type=radio]").forEach((i) => i.addEventListener("change", sync));

}

function openFind() { openFindDialog(false); }
function openReplace() { openFindDialog(true); }

// 替换文本展开: 正则模式支持 $1 / \1 / $&; 非正则按字面量
function expandReplacement(m, repl) {
  if (!FIND_STATE.useRegex) return repl;
  return repl.replace(/\$(\d+|&)|\\(\d)/g, (_, a, b) => { const k = a !== undefined ? a : b; return k === "&" ? m[0] : (m[+k] ?? ""); });
}
function replaceInLine(line, re, repl, from = 0, to = Infinity) {
  let out = "", at = 0, n = 0, m, end = 0;
  re.lastIndex = 0;
  while ((m = re.exec(line))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    const col = charLen(line.slice(0, m.index));
    if (col < from || col + charLen(m[0]) > to) continue;
    out += line.slice(at, m.index) + expandReplacement(m, repl);
    at = m.index + m[0].length; n++; end = charLen(out);
  }
  return { text: out + line.slice(at), n, end };
}

// 置換 (一个): 当前选区正好是一处命中就替换它, 然后找下一个; 否则先定位到下一处
function replaceOne() {
  const t = getActiveTab();
  const rp = document.getElementById("repl-input");
  if (!t) return;
  if (!FIND_STATE.needle) { setTip("先输入查找内容"); return; }
  const re = buildFindRegex(FIND_STATE);
  if (!re) { setTip("正则表达式无效"); return; }
  if (selNonEmpty(t) && t.sel.r0 === t.sel.r1) {
    const line = t.lines[t.sel.r0], seg = charSlice(line, t.sel.c0, t.sel.c1);
    const one = buildFindRegex(FIND_STATE, false);
    const m = one && one.exec(seg);
    if (m && m[0] === seg) {
      snapshot(t);
      const rep = expandReplacement(m, rp ? rp.value : "");
      t.lines[t.sel.r0] = charSlice(line, 0, t.sel.c0) + rep + charSlice(line, t.sel.c1);
      t.cursor = { row: t.sel.r0, col: t.sel.c0 + charLen(rep) - (charLen(rep) ? 1 : 0) };   // 落在替换文本最后一个字符上, findNext 取「严格在其后」的命中
      t.sel = null; t.dirty = true;
      if (charLen(rep)) t.cursor.col += 0; else t.cursor.col = Math.max(0, t.cursor.col - 1);
      renderVim(t);
    }
  }
  findNext();
}

// 全部替换: scope = sel (选择范围) / all (文件全体)
function replaceAll() {
  const t = getActiveTab();
  const rp = document.getElementById("repl-input");
  const needle = FIND_STATE.needle;
  if (!t) return;
  if (!needle) { setTip("先输入查找内容"); return; }
  const re = buildFindRegex(FIND_STATE);
  if (!re) { setTip("正则表达式无效"); return; }
  const withText = rp ? rp.value : "";
  const sc = document.querySelector('input[name="find-scope"]:checked');
  const scope = sc ? sc.value : FIND_STATE.scope;
  let r0 = 0, r1 = t.lines.length - 1, c0 = 0, c1 = Infinity;
  if (scope === "sel" && selNonEmpty(t)) { r0 = t.sel.r0; r1 = t.sel.r1; c0 = t.sel.c0; c1 = t.sel.c1 === Infinity ? Infinity : t.sel.c1; }
  let count = 0;
  let lastRow = -1, lastEnd = 0;
  const inSel = scope === "sel" && selNonEmpty(t), tailLen = inSel ? charLen(t.lines[r1]) - (c1 === Infinity ? charLen(t.lines[r1]) : c1) : 0;
  snapshot(t);
  for (let r = r0; r <= r1; r++) {
    const from = r === r0 ? c0 : 0;
    const to = r === r1 ? c1 : Infinity;
    const res = replaceInLine(t.lines[r], re, withText, from, to);
    if (res.n) { t.lines[r] = res.text; count += res.n; lastRow = r; lastEnd = res.end; }
  }
  if (count > 0) {
    t.dirty = true; t.sel = null;
    if (inSel) { const ec = charLen(t.lines[r1]) - tailLen; t.sel = { r0, c0, r1, c1: ec }; t.selAnchor = { row: r0, col: c0 }; t.cursor = { row: r1, col: ec }; }   // Sakura: 选区范围内置换后选区保留
    else if (lastRow >= 0) t.cursor = FIND_STATE.useRegex ? { row: Math.min(lastRow + 1, t.lines.length - 1), col: 0 } : { row: lastRow, col: lastEnd };   // Sakura: 光标停在最后一处置换之后 (正则模式停在下一行行首)
    renderVim(t);
  }
  closeModal();
  setTip("置換 " + count + " 処");
}

/* Grep 对话框的跨次状态 (SPA-01 G-75: 搜索/替换条件全局共享, 复用上次值).
   与 FIND_STATE 分开: 查找替换记在 FIND_STATE, Grep 的文件模式 / 递归 / 单词单位没有对应项. */
/* Grep 对话框的跨次状态 (SPA-01 G-75: 搜索/替换条件全局共享, 复用上次值).
   字段**逐一对应 Sakura 的五个输入框** (CDlgGrep.cpp 的五个 IDC_COMBO_*):
     needle         -> 検索文字列 (条件)
     files          -> ファイル名
     folders        -> フォルダー        ← 本轮新增, 原实现完全没有
     excludeFiles   -> 除外ファイル      ← 原实现挤在 files 里靠 `!` 前缀
     excludeFolders -> 除外フォルダー    ← 原实现挤在 files 里靠 `#` 前缀
   另有 `thisFileOnly` 对应 Sakura 的「この文件中だけ検索」单选 (CDlgGrep::SetDataFromThisText),
   勾上后会把 ファイル名 置成「当前文件」、フォルダー 置成「当前文件所在目录」并禁用其余四框. */
const GREP_STATE = {
  needle: "", replace: "",
  files: "*.*", folders: "", excludeFiles: "", excludeFolders: "",
  caseSensitive: false, regex: false, subfolders: true, wholeWord: false,
  thisFileOnly: false, allowOutside: false,
};

/* Sakura 模式解析 (SPA-01 G-10 ~ G-15, G-20 ~ G-23, G-30 ~ G-32, G-43)。
   语义**逐一对照上游源码** (E:/Temp/sakura-ref/sakura):
     - CGrepEnumKeys::SplitPatternKeepQuotes  分隔符是 ` ;,` 三种, 引号内不分隔,
       引号出现在 token 任何位置都切换内外, 空元素丢弃;
     - CGrepEnumKeys::AddFileKey             前缀 `!` = 除外ファイル, `#` = 除外フォルダー,
       两者与 ファイル名 同框共存, 排除优先于包含, 与书写位置无关;
     - CGrepAgent::CreateFolders            フォルダー 用 `;` 分隔, 去掉 `"`, 逐个展开成长路径;
     - CDlgGrep::SetDataFromThisText        「この文件中だけ検索」勾上后把
       ファイル名 置成「当前文件」、フォルダー 置成「当前文件所在目录」并禁用其余输入框。

   未闭合的引号按普通字符处理 (宽容, 不阻断搜索) —— 上游是 HasUnclosedQuote 报错,
   这里放宽是为了不因为一个笔误让整个搜索失败. */
function splitSakuraList(spec) {
  const raw = String(spec || "");
  const out = [];
  let buf = "", inQuote = false;
  const flush = () => { if (buf.trim()) out.push(buf.trim()); buf = ""; };
  for (const ch of raw) {
    if (ch === '"') { inQuote = !inQuote; continue; }          // 引号只做切换, 不进结果
    if (!inQuote && (ch === " " || ch === ";" || ch === "," || /\s/.test(ch))) { flush(); continue; }
    buf += ch;
  }
  flush();
  return out;
}

/** ファイル名 一栏 -> { include, excludeFiles, excludeFolders }。
 *  留空时 include = ["*.*"] (上游 SetFileKeys 的 WILDCARD_ANY 兜底)。*/
function parseFilePatterns(spec) {
  const include = [], excludeFiles = [], excludeDirs = [];
  for (const tok of splitSakuraList(spec)) {
    if (tok.startsWith("#")) { excludeDirs.push(tok.slice(1)); continue; }
    if (tok.startsWith("!")) { excludeFiles.push(tok.slice(1)); continue; }
    include.push(tok);
  }
  if (include.length === 0) include.push("*.*");
  return { include, excludeFiles, excludeDirs };
}

/** フォルダー 一栏 -> 相对项目根的路径数组. 空 = 不限定 (全项目)。
 *  保留 `{...}` 这种「基准文件夹」写法? 上游有「基准フォルダー表示」开关 (G-45),
 *  暂不实现, 但路径原样传给后端由它校验越界。 */
function parseSearchFolders(spec) {
  return splitSakuraList(spec).filter(Boolean);
}

/* 除外フォルダー 交给后端按目录名/相对路径排除, 不再在前端拼 `!dir` / `!dir/**`
   —— 上一版靠前端拼 glob 传给 `exclude_globs`, 语义和 Sakura 的「目录名匹配」不同源。 */
/* Sakura 的 Grep 对话框是**五个独立字段**, 不是一个大框 (CDlgGrep.cpp 的五个 IDC_COMBO_*):
     検索文字列 / ファイル名 / フォルダー / 除外ファイル / 除外フォルダー
   上一版把 后三个挤进 ファイル名 一个框 (靠 `!` `#` 前缀), 而且**没有 フォルダー 字段** ——
   结果「搜索哪些目录」这件事完全无法表达, 与 Sakura 的交互模型不一致。 */
const GREP_FIELD_IN = 'style="width:100%;padding:4px 6px;background:var(--input-bg,#3c3c3c);color:var(--fg,#fff);border:1px solid var(--border,#555);box-sizing:border-box;"';

function grepFieldRow(label, id, ph, val) {
  return '<div class="opt-row" style="display:flex;align-items:center;gap:8px;">' +
    '<label style="flex:0 0 96px;" for="' + id + '">' + label + '</label>' +
    '<input id="' + id + '" placeholder="' + escapeHtml(ph) + '" value="' + escapeHtml(val || "") + '" ' + GREP_FIELD_IN + ' />' +
    "</div>";
}

async function openGrepDialog(withReplace) {

  $("grep-input").focus();

  /* 「この文件中だけ検索」(上游 CDlgGrep::SetDataFromThisText): 勾上 -> ファイル名 置成
     「当前文件」、フォルダー 置成「当前文件所在目录」, 除外两栏清空, 其余控件全部禁用;
     取消勾选则逐字还原成勾选前的值 (上游是存进 m_szFile/m_szFolder 再写回)。 */
  const DISABLE_IDS = ["grep-files", "grep-folders", "grep-exc-files", "grep-exc-dirs",
                       "grep-case", "grep-regex", "grep-sub", "grep-word"];
  let savedBeforeThis = null;
  const applyThisFileOnly = (on) => {

  const runGrep = async () => {

    const excDirs  = pats.excludeDirs.concat(splitSakuraList($("grep-exc-dirs").value));
    const status = $("grep-status");
    status.textContent = "搜索中...";

    GREP_STATE.needle = rawQ;
    GREP_STATE.files = $("grep-files").value;
    GREP_STATE.folders = $("grep-folders").value;
    GREP_STATE.excludeFiles = $("grep-exc-files").value;
    GREP_STATE.excludeFolders = $("grep-exc-dirs").value;
    GREP_STATE.caseSensitive = $("grep-case").checked;
    GREP_STATE.regex = $("grep-regex").checked;
