    }
[data-theme="clear"] .menu-row:hover {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.35) 0%, rgba(56, 189, 248, 0.15) 100%) !important;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
      color: var(--fg) !important;
    }
[data-theme="clear"] .menu-sep {
      background: rgba(255, 255, 255, 0.18) !important;
      margin: 4px 6px;
    }
[data-theme="clear"] .act-btn {
      color: var(--fg-muted);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
[data-theme="clear"] .act-btn:hover {
      background: rgba(255, 255, 255, 0.18) !important;
      color: var(--fg) !important;
      border-color: var(--border) !important;
    }
[data-theme="clear"] .act-btn.active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.12) 100%) !important;
      backdrop-filter: blur(18px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(200%) !important;
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.85) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15), inset 0 1.5px 1px #fff !important;
      color: var(--fg) !important;
    }
[data-theme="clear"] .side-tab.active,
    [data-theme="clear"] .bottom-tab.active,
    [data-theme="clear"] .tab.active {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.08) 100%) !important;
      backdrop-filter: blur(14px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(14px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.7) !important;
      color: var(--fg) !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
[data-theme="clear"] .side-tab:hover,
    [data-theme="clear"] .bottom-tab:hover,
    [data-theme="clear"] .tab:hover {
      background: rgba(255, 255, 255, 0.14) !important;
      color: var(--fg) !important;
    }
[data-theme="clear"] #ed-content,
    [data-theme="clear"] #gutter,
    [data-theme="clear"] #terminal-body,
    [data-theme="clear"] .shortcuts,
    [data-theme="clear"] .tree-node,
    [data-theme="clear"] #welcome h1 {
      /* 原来这里是 color:#ffffff + mix-blend-mode:difference ——
         用"差值混合"实现自动反色. 想法聪明但实际有害:
           1. getComputedStyle 仍返回白色, 无法验证真实渲染
           2. 混合模式会传染给所有子元素, 破坏它们各自的层级
           3. 一旦壁纸是纯黑/纯白就失效
         现在统一跟随 --fg, 由 Rust 侧 theme_luminance 按**系统主题**
         给值 —— 那是有语义来源的判断, 不是靠像素碰运气. */
      color: var(--fg);
    }

    /* ================================================================
       Interaction & Polish — 精品感的来源
       ================================================================
       不是加装饰, 是把"状态"做完整: 每个可交互元素都有
       rest / hover / active / focus 四态, 过渡统一用 --ease/--dur-*,
       焦点环统一用 --focus-ring. 缺任何一态, 界面就会显得"廉价".
    ================================================================ */

    /* ---- 全局焦点环: 只对键盘可见 (焦点环用 :focus-visible, 鼠标点击不显示) ---- */
    :focus { outline: none; }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r-sm); }

    /* ---- 滚动条: 默认样式在 Windows 上是粗灰条, 与整体不搭 ---- */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: transparent; }
    /* 滑块不能借分隔线色 (--border-strong): 12px 滑块与轨道只有 1.5-1.7:1, 静止时几乎看不见. 静止 --fg-dim, 悬停 --fg-muted. */
    ::-webkit-scrollbar-thumb {
      background: var(--fg-dim); border-radius: 6px;
      border: 3px solid transparent; background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    /* ---- 选中色: 用 --bg-active 而不是浏览器默认蓝 ---- */
    ::selection { background: var(--bg-active); color: var(--fg); }

    /* ---- 菜单栏 ---- */
    #menubar {
      -webkit-app-region: drag;               /* Tauri: 可拖拽区域 */
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
      padding: 0 var(--sp-2); gap: var(--sp-1);
      user-select: none;
    }
    .mb-btn {
      color: var(--fg); font-size: var(--fs-sm);
      padding: var(--sp-1) var(--sp-3); border-radius: var(--r-sm);
      border: 1px solid transparent;          /* 预留边框宽度, hover 时不跳动 */
      transition: background var(--dur-fast) var(--ease),
                  color var(--dur-fast) var(--ease),
                  border-color var(--dur-fast) var(--ease);
    }
    .mb-btn:hover { background: var(--bg-hover); }
    .mb-btn:active { background: var(--bg-active); transform: translateY(0.5px); }
    .menu-item.open > .mb-btn { background: var(--bg-active); border-color: var(--border-strong); }

    /* ---- 下拉菜单: 分层阴影 + 逐项出现 ---- */
    .menu-dropdown, .submenu-dropdown {
      background: var(--bg-bar);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      box-shadow: 0 4px 16px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.16);
      padding: var(--sp-1); min-width: 220px;
      z-index: var(--z-menu);
      animation: menu-in var(--dur-fast) var(--ease-out);
    }
    @keyframes menu-in {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    .menu-row {
      color: var(--fg); font-size: var(--fs-sm);
      padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
      transition: background var(--dur-fast) var(--ease);
    }
    .menu-row:hover { background: var(--bg-active); }
    .menu-sep { background: var(--border); height: 1px; margin: var(--sp-1) 0; }

    /* ---- 活动栏: 选中态用左侧竖条 (VS Code 风格), 比整块高亮更克制 ---- */
    #activity-bar { padding: var(--sp-2) 0; gap: var(--sp-1); background: var(--bg-rail); }
    .act-btn {
      position: relative; color: var(--fg-muted);
      width: 32px; height: 32px; border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .act-btn::before {                     /* 左侧选中条 */
      content: ""; position: absolute; left: -6px; top: 50%;
      width: 2px; height: 0; background: var(--fg);
      border-radius: 1px; transform: translateY(-50%);
      transition: height var(--dur-base) var(--ease-out);
    }
    .act-btn:hover { color: var(--fg); background: var(--bg-hover); }
    .act-btn.active { color: var(--fg); }
    .act-btn.active::before { height: 60%; }

    /* ---- 侧栏 ---- */
    #side-bar { background: var(--bg-side); border-right: 1px solid var(--border); }
    .side-tab {
      font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--fg-muted); padding: var(--sp-2) var(--sp-3);
      border-bottom: 2px solid transparent;
      transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
                  background var(--dur-fast) var(--ease);
    }
    .side-tab:hover { color: var(--fg); }
    .side-tab.active { color: var(--fg); border-bottom-color: var(--fg); }
    /* 悬停不能只改文字色 (hc 里 #e0e0e0 -> #fff 几乎看不出); 与 .tab / .tree-node / .act-btn 一样给底色, 激活项不加 */
    .side-tab:hover:not(.active), .bottom-tab:hover:not(.active) { background: var(--bg-hover); }
    .sb-title { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em;
                color: var(--fg-dim); }
    .tree-node {
      padding: var(--sp-1) var(--sp-2); border-radius: var(--r-sm);
      color: var(--fg); font-size: var(--fs-sm);
      transition: background var(--dur-fast) var(--ease);
    }
    .tree-node:hover { background: var(--bg-hover); }
    .tree-node.selected { background: var(--bg-active); }

    /* ---- 标签页: 活动标签用上层背景 + 顶部色条 ---- */
    .tab {
      font-size: var(--fs-sm); color: var(--fg-muted);
      background: transparent;
      border-radius: var(--r-sm) var(--r-sm) 0 0;
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .tab:hover { background: var(--bg-hover); color: var(--fg); }
    .tab.active { background: var(--bg-edit); color: var(--fg); }
    .tab-dirty::after { content: "●"; color: var(--fg); margin-left: var(--sp-1); }
    .tab-close {
      width: 18px; height: 18px; border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;                                /* 只在 hover/激活时显示, 省视觉噪音 */
      transition: opacity var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
    .tab-close:hover { background: var(--bg-active); }

    /* ---- 透明玻璃: 活动栏图标 ----
       原 clear 主题给 .act-btn 用亮蓝 #38bdf8, 在半透明玻璃上对比只有
       2.1:1 (实测), 达不到 AA. 改用跟随前景色的中灰, 让"选中"靠左侧
       色条和文字亮起来表达, 而不是靠一个看不清的蓝图标. */
    [data-theme="clear"] .act-btn { color: var(--fg-muted); }
    [data-theme="clear"] .act-btn:hover { color: var(--fg); }

    /* ---- 编辑器 ---- */
    /* 行号是要读的信息, 不是装饰 —— 用 --fg-muted 而不是 --fg-dim.
       实测 --fg-dim 在 dark 下只有 3.08:1 (行号几乎看不清), 提到
       --fg-muted 后是 7.3:1. 当前行再加亮一点做视觉锚点. */
    #gutter { color: var(--fg-muted); font-size: var(--fs-sm);
              user-select: none; background: var(--bg-edit); }
    #ed-content { color: var(--fg); caret-color: var(--blue);
                  background: var(--bg-edit); }
    #ed-content:focus-visible { box-shadow: inset 0 0 0 1px var(--blue); }
    .hl-row { border-radius: var(--r-sm); }
    .sel-range { background: var(--bg-active); }

    /* ---- 底部面板与标签 ---- */
    #bottom-panel { background: var(--bg-bottom); }
    .bottom-tab {
      font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--fg-muted); padding: var(--sp-2) var(--sp-3);
      border-radius: var(--r-sm) var(--r-sm) 0 0;
      border-bottom: 2px solid transparent;
      transition: color var(--dur-fast) var(--ease),
                  border-color var(--dur-fast) var(--ease),
                  background var(--dur-fast) var(--ease);
    }
    .bottom-tab:hover { color: var(--fg); }
    .bottom-tab.active { color: var(--fg); border-bottom-color: var(--blue); }
    .bottom-toggle {
      color: var(--fg-muted); font-size: var(--fs-xs);
      padding: var(--sp-1) var(--sp-2); border-radius: var(--r-sm);
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .bottom-toggle:hover { background: var(--bg-hover); color: var(--fg); }

    /* ---- 状态栏 ---- */
    #status { font-size: var(--fs-xs); color: var(--fg-on-accent); padding: 0 var(--sp-3); }
    .s-item { padding: 0 var(--sp-2); border-radius: var(--r-sm);
              transition: background var(--dur-fast) var(--ease); }
    /* 悬停用黑色面纱压暗: 状态栏是浅字配中等明度的强调色底, 再叠白色会把 11px 文字压到 3.7:1; hc 的白底黑字压暗后对比仍 >14:1 */
    .s-item:hover { background: rgba(0,0,0,0.16); }

    /* ---- 输入框 ---- */
    .md-input, input[type="text"], input:not([type]) {
      background: var(--bg-input); color: var(--fg);
      border: 1px solid var(--border-strong); border-radius: var(--r-md);
      padding: var(--sp-2) var(--sp-3); font: inherit; font-size: var(--fs-sm);
      transition: border-color var(--dur-fast) var(--ease),
                  box-shadow var(--dur-fast) var(--ease);
    }
    input:focus-visible { border-color: var(--blue); box-shadow: var(--focus-ring); }
    /* 占位符默认是 UA 的 #757575 (dark 上 2.4:1); 跟随 --fg 取 75%, 仍明显区别于已输入文字 */
    input::placeholder { color: color-mix(in srgb, var(--fg) 75%, transparent); opacity: 1; }
    /* 复选框默认 vertical-align: baseline, 框心比标签文字中心高约 2.5px */
    .opt-row input[type="checkbox"], #modal input[type="checkbox"] { vertical-align: middle; }

    /* ---- 按钮 ---- */
    .md-btn, .tb-btn, .bottom-toggle, #welcome .open-btn {
      border-radius: var(--r-md);
      border: 1px solid var(--border-strong);
      transition: background var(--dur-fast) var(--ease),
                  border-color var(--dur-fast) var(--ease),
                  transform var(--dur-fast) var(--ease);
    }
    .md-btn { font-size: var(--fs-sm); }     /* 之前没有字号, 落到 UA 的 13.33px, 比对话框正文 (12px) 还大 */
    .md-btn:hover, .tb-btn:hover { background: var(--bg-hover); border-color: var(--fg-dim); }
    .md-btn:active, .tb-btn:active { transform: translateY(1px); }
    .md-btn.primary { background: var(--blue); color: var(--fg-on-accent); border-color: var(--blue); }
    .md-btn.primary:hover { filter: brightness(1.08); }

    /* ---- 欢迎页 ---- */
    #welcome { display: flex; flex-direction: column; align-items: center;
               justify-content: center; height: 100%; gap: var(--sp-5); }
    #welcome h1 { font-size: var(--fs-display); font-weight: 300; letter-spacing: 0.14em;
                  color: var(--fg); opacity: 0.9; }
    #welcome .open-btn { padding: var(--sp-3) var(--sp-6); font-size: var(--fs-md);
                         border-radius: var(--r-lg); }

    /* ---- Modal ---- */
    #modal .md-box {
      color: var(--fg);
      border: 1px solid var(--border-strong); border-radius: var(--r-lg);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      animation: modal-in var(--dur-base) var(--ease-out);
    }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    #md-title { font-size: var(--fs-lg); font-weight: 500; }

    /* ---- 空状态提示 ---- */
    .empty-hint { color: var(--fg-muted); font-size: var(--fs-sm); }

    /* ===== 排版修复 batch1: skeleton ===== */
    /* split + minimap: the strip gets its own right-hand column spanning the view rows (auto-placing it put it in a view cell and collapsed the views to 4px); tabs/breadcrumb span it via the extra explicit track */
    #editor-area.split-h:has(> #minimap) { grid-template-columns: minmax(0, 1fr) auto; }
    #editor-area.split-v:has(> #minimap), #editor-area.split-quad:has(> #minimap) { grid-template-columns: repeat(2, minmax(0, 1fr)) auto; }
    /* status bar: one line, ellipsis. ID selectors beat the later .s-item polish rules. .s-tip rule must stay AFTER the .s-item rule (equal specificity). */
    #status { overflow: hidden; white-space: nowrap; }
    #status > .s-item { flex: 0 0 auto; white-space: nowrap; }
    #status > #s-file { flex: 0 1 auto; min-width: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
    #status > .s-tip { flex: 1 1 0; min-width: 96px; overflow: hidden; text-overflow: ellipsis; }
    #status > .s-item:last-child { border-right: 0; }
    /* side-bar tab strip: 5 tabs need 266px at padding 8px but only 239px exist -> one line with 4px padding (natural sum 226px) */
    #side-tabs { overflow: hidden; }
    .side-tab { flex: 1 1 auto; min-width: 0; padding: var(--sp-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* menubar: never wrap labels / .mn-key / '▶ 终端'; #banner absorbs the squeeze (it already has overflow:hidden + ellipsis). nowrap is what prevents the wrap; flex:none just documents that these items must not shrink. */
    .menu-item, .tb-btn { flex: none; }
    .mb-btn, .tb-btn { white-space: nowrap; }
    #menubar > #banner { flex: 0 1 auto; min-width: 0; }
    /* activity rail: below ~420px window height the 5 buttons (176px) no longer fit; keep them 32px and let the rail scroll instead of painting over the bottom panel (buttons otherwise shrink to 29px) */
    #activity-bar { min-height: 0; overflow-y: auto; scrollbar-width: none; }
    #activity-bar::-webkit-scrollbar { width: 0; height: 0; }
    .act-btn { flex: 0 0 auto; }

    /* ===== 排版修复 batch2: regions (A-E: 代码行 / 标签页 / 面包屑 / 欢迎页; A、B、D 的 background 另有 IN PLACE 修改) ===== */
    /* tabs: .tab must be a BLOCK container, otherwise text-overflow:ellipsis can't apply (a 106-char name made a 771px tab).
       The close button is absolutely placed in the 26px right padding; the dirty dot is the single ::after marker, pinned in the 12px left padding.
       The strip is overflow-y:hidden so the 6px horizontal scrollbar can't squeeze the tabs into a second scroll axis.
       line-height 21px = tab height while the 6px scrollbar is shown (27-6); a <button> centers its content when the tab is the full 27px, so the text stays centered in both states (24px sat 1px low next to the scrollbar). */
    #tabs { overflow-x: auto; overflow-y: hidden; }
    #tabs::-webkit-scrollbar { height: 6px; }
    #tabs::-webkit-scrollbar-thumb { border-width: 1px; }
    .tab { position: relative; display: block; flex: 0 0 auto; max-width: 200px; padding: 0 26px 0 12px; line-height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab .tab-close { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
    .tab-dirty::after { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); margin: 0; font-size: 8px; color: var(--yellow); }
    /* breadcrumb: one line; every crumb may ellipsize, the current file name is protected */
    #breadcrumb { overflow: hidden; white-space: nowrap; min-width: 0; }
    #breadcrumb > .crumb { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* the current file name must be able to shrink too: with flex-shrink:0 a long name stayed wider than the bar, its own ellipsis never engaged and the bar's overflow:hidden cut it mid-glyph. The ancestors give way first (shrink weight 100 vs 1), so the file name keeps the room. */
    #breadcrumb > .crumb:not(.current) { flex: 0 100 auto; }
    #breadcrumb > .crumb.current { flex: 0 1 auto; }
    #breadcrumb > .crumb-sep { flex: 0 0 auto; }
    /* welcome page lives inside #ed-content (white-space:pre) -> the 576px shortcut line could not wrap and was clipped */
    #welcome { white-space: normal; text-align: center; min-width: 0; }
    #welcome .shortcuts { max-width: 100%; line-height: 1.9; }
    /* white-space:normal above must not let the button label break per character in a very narrow editor (it used to inherit pre); the 34px title was laid out in the inherited 18px line box and overlapped the gap below it */
    #welcome .open-btn { white-space: nowrap; }
    #welcome h1 { line-height: 1.25; }

    /* ----- regions F-I: 菜单 / 提示气泡 / 菜单栏右侧 / 菜单按钮高度 ----- */
    /* menus (F): content-sized dropdowns, never wrap a row ('删除上方行' + its shortcut wrapped inside a 240px box).
       Do NOT give .menu-dropdown max-height/overflow:auto: that would clip the absolutely positioned flyouts. The Edit menu (22 rows) instead gets compressed rows below 700px
       window height and a two-column layout below 560px; only the last two submenu rows open their flyout bottom-anchored (anchoring all of them pushes upper rows' flyouts off the top).
       Keep this exact order (the later media rules rely on the earlier ones). */
    .menu-dropdown, .submenu-dropdown { width: max-content; }
    .menu-row { white-space: nowrap; }
    @media (max-height: 700px) {
      .menu-row { padding-top: 2px; padding-bottom: 2px; }
      [data-theme="clear"] .menu-row { margin-top: 0; margin-bottom: 0; }
      .menu-dropdown > .menu-submenu:nth-last-child(-n+2) > .submenu-dropdown { top: auto; bottom: 0; }
    }
    /* the Edit menu is the only one tall enough to push its 转换 flyout off the bottom between 700px and ~830px window height (unanchored it ends at y=827 in the clear theme, 767 in dark) */
    @media (max-height: 840px) {
      .menu-dropdown[data-dropdown="edit"] > .menu-submenu:nth-last-child(-n+2) > .submenu-dropdown { top: auto; bottom: 0; }
    }
    /* (旧的「窗口很矮时编辑菜单分两栏」规则已删除: 菜单已分层变短, 超出时统一出滚动条, 子菜单由 placeSubmenu 定位) */
    @media (max-width: 800px) {
      .submenu-dropdown { min-width: 160px; }
      .menu-item[data-menu="window"] .menu-submenu > .submenu-dropdown { left: auto; right: 100%; }
    }
    /* tooltip (G): sized to its text (the 折叠 tip used to wrap because a fixed-position box shrink-wraps to the room left of its stale `left`); text longer than the 400px max-width still wraps inside the box. Positioning lives in the mouseover handler, which flips the tip above the target near the window bottom. Hidden while a menu is open, else it stays on top of the menu's first row (#tip z-index 1000 > menu 200) */
    #tip { width: max-content; overflow-wrap: anywhere; }
    #app:has(.menu-item.open) #tip { display: none !important; }
    /* menubar top-right (H): '▶ 终端' button and the banner are centred in the 29px bar content box instead of hanging from its top edge (button 30px painted over the bar border; banner 24px + its own border looked like a second bar) */
    #menubar > #banner { align-self: stretch; height: auto; line-height: calc(var(--h-menubar) - 1px); border-bottom: 0; background: transparent; }
    #menubar > .tb-btn { align-self: center; height: 22px; line-height: 18px; padding: 0 var(--sp-3); margin: 0 var(--sp-2); }
    /* menu buttons (I): stay inside the bar's content box (bar border-bottom 1px); clear theme adds 2px top/bottom margins, so it needs 3px less */
    /* line-height:normal: the 10px .mn-key inside a fixed 22px line box shifted the label 1px low in the 26px clear-theme pill (normal centres it in both heights) */
    .mb-btn { height: calc(var(--h-menubar) - 1px); line-height: normal; }
    [data-theme="clear"] .mb-btn { height: calc(var(--h-menubar) - 4px); }

    /* ----- regions J-N: 活动栏 / 资源管理器树 / 项目行 / 底部面板头 / 对话框 ----- */
    /* activity bar (J): the 2px blue border-left that used to sit on .act-btn.active was removed IN PLACE (base rule); the polish layer's ::before bar is the only indicator now */
    /* explorer tree (K): long names ellipsize instead of widening #side-body (792px scroll width at 239px client); nesting is expressed with --depth, set by toggleTreeDir() on each expanded child (12px per level). .tree-node is shared by the SCM / outline / search rows, which get the ellipsis too and keep --depth 0. The icon box is 16px = the emoji width, so the glyph no longer touches the name. */
    #side-body { overflow-x: hidden; }
    .tree-node { overflow: hidden; text-overflow: ellipsis; padding-left: calc(var(--sp-2) + var(--depth, 0) * var(--sp-4)); }
    .tree-icon { width: 16px; margin-right: var(--sp-2); text-align: center; }
    /* project row (L): a labelled, non-sticky header above the tree (sticky was tried and rejected: it intercepts clicks and bleeds through in the clear theme) */
    #sb-project-name { margin-bottom: var(--sp-2); padding: var(--sp-2); border-bottom: 1px solid var(--border); color: var(--fg); font-size: var(--fs-sm); line-height: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    #sb-project-name:hover { color: var(--accent-text); }
    /* bottom panel (M): the head background / border-top / padding-right / align-items were changed IN PLACE (stretch lets the 2px tab underline sit flush on the pane). The toggle buttons keep their own height. */
    .bottom-toggle { align-self: center; }
    #terminal-body, #output-body, #problems-body { overflow-wrap: anywhere; }
    /* modal (N): the card styling moved IN PLACE from #modal to #modal .md-box so the dimming scrim on #modal applies again. Long unbroken strings wrap inside the card; on small windows the card keeps a 16px margin all round (media-guarded so 960x600 dialogs are unchanged). */
    .md-body { overflow-wrap: anywhere; }
    @media (max-width: 700px), (max-height: 520px) {
      .md-box { max-width: calc(100vw - 2 * var(--sp-5)); max-height: calc(100vh - 2 * var(--sp-5)); }
    }

    /* ===== 排版修复 batch3: typography ===== */
    /* the rest of batch3 (duplicate :root / * block, dead hover rules, px -> --fs-* swaps, .sb-section / .empty-hint metrics) was applied IN PLACE.
       outline header = a file name: never upper-case it ('many_fns.rs' -> 'MANY_FNS.RS' is wrong for case-sensitive names). The pane is created as <div id="outline-pane">. */
    #outline-pane .sb-section { text-transform: none; overflow-wrap: anywhere; }
    /* .empty-hint is shared with dialogs: inside .md-body its text must stay on the .opt-row text edge (12px body padding + 8px) and keep its old 12px rhythm; only the sidebar gets the 4px / 8px metrics (header, hint and tree text all start 8px from the sidebar edge) */
    .md-body .empty-hint { padding: var(--sp-4) var(--sp-3); }

    /* ===== 排版修复 batch4: themes-states ===== */
    /* A-D were applied IN PLACE: THEMES.hc / THEMES.light data constants (hover/active/status/focus-ring tokens), the hard-coded hover colours (.menu-row / .opt-row / .tab-close), the --fg-dim -> --fg-muted text colours (.side-tab / .bottom-tab / .terminal-empty / .empty-hint), the kbd chips and the mode-pill backgrounds. */
    /* mode pill + status bar (D): in the clear theme the bar is a ~4% tint, not an accent bar, so --fg-on-accent (white) text vanished on a light desktop; the pill itself keeps white text on its darkened accent */
    [data-theme="clear"] #status { color: var(--fg); }
    /* separators follow the status text colour: they are derived from --fg-on-accent (white on the blue bars, so dark/light are value-identical; black on hc's new white bar, where white-on-white made them vanish); the clear bar is a tint, so there they and the hover veil follow --fg (the non-clear hover veil is a fixed 16% black, see .s-item:hover) */
    [data-theme="clear"] .s-item { border-right-color: color-mix(in srgb, var(--fg) 20%, transparent); }
    [data-theme="clear"] .s-item:hover { background: color-mix(in srgb, var(--fg) 12%, transparent); }
    [data-theme="clear"] .s-mode { color: #fff; }
    /* the pastel clear-dark green (#7ee2b8) only reaches 3.95:1 under white text at 62%; 52% clears AA (the other two accents and clear-light already pass at 62%) */
    [data-theme="clear"] .s-mode[data-mode="INSERT"] { background: color-mix(in srgb, var(--green) 52%, #000); }
    /* clear theme on a light desktop (E): dropdowns, dialogs and the completion popup are always dark glass, so their text must always be light. Scoping the tokens makes the existing `color: var(--fg) !important` clear rules (menu rows, dialog buttons) resolve light inside them without new !important. On a dark desktop these values equal the Rust dark values (no change). */
    [data-theme="clear"] .menu-dropdown, [data-theme="clear"] .submenu-dropdown, [data-theme="clear"] #modal .md-box, [data-theme="clear"] #completion-popup {
      --fg: #f0f2f5; --fg-muted: rgba(240,242,245,0.72); --fg-dim: rgba(240,242,245,0.48);
      --border: rgba(255,255,255,0.28); --border-strong: rgba(255,255,255,0.28);
      --bg-hover: rgba(255,255,255,0.12); --bg-active: rgba(255,255,255,0.18); --bg-input: rgba(255,255,255,0.10);
      /* --blue is also read as TEXT inside the cards (the current encoding / EOL row is rendered with style="color:var(--blue)"); the light-desktop value #0b57d0 is ~2:1 on dark glass, #8ab4f8 is what a dark desktop gets. The focus ring is the white-band form for the same reason. */
      --blue: #8ab4f8;
      --focus-ring: 0 0 0 1px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,255,255,0.45);
      color: var(--fg);
    }
    [data-theme="clear"] #modal .md-box, [data-theme="clear"] #completion-popup {
      background: rgba(18,22,32,0.72);
      -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    }
    /* clear-theme states (F): the active-tab !important `border: 1px solid` widened tabs by 2px and dropped the 2px underline, so tabs jumped on switch; each kind keeps the border box of its inactive state */
    [data-theme="clear"] .side-tab.active { border-width: 0 0 2px !important; border-bottom-color: var(--fg) !important; }
    [data-theme="clear"] .bottom-tab.active { border-width: 0 0 2px !important; border-bottom-color: var(--blue) !important; }
    [data-theme="clear"] .tab.active { border-width: 0 1px 0 0 !important; }
    /* the glass !important box-shadow on these buttons suppressed the keyboard focus ring */
    [data-theme="clear"] .md-btn:focus-visible, [data-theme="clear"] .tb-btn:focus-visible, [data-theme="clear"] .bottom-toggle:focus-visible, [data-theme="clear"] #welcome .open-btn:focus-visible { box-shadow: var(--focus-ring) !important; }
    /* the ACTIVE tab kinds and the active activity button carry the same !important glass box-shadow (inset highlight), which also hid their keyboard ring. Tabs sit in overflow-clipped strips, so they get the inset form; the activity button gets the normal ring. */
    [data-theme="clear"] .act-btn.active:focus-visible { box-shadow: var(--focus-ring) !important; }
    [data-theme="clear"] .side-tab.active:focus-visible, [data-theme="clear"] .bottom-tab.active:focus-visible, [data-theme="clear"] .tab.active:focus-visible { box-shadow: inset 0 0 0 2px var(--blue) !important; }
    /* focus rings clipped by overflow containers (G): #side-bar, #side-tabs and #tabs clip the outer 3px ring, so tabs get the inset form in every theme (the clear-theme active tabs have their own !important inset rule above) */
    .side-tab:focus-visible, .bottom-tab:focus-visible, .tab:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); border-radius: 0; }
    /* same problem, same fix: #side-body is a keyboard-focusable scroller whenever the tree overflows, and it fills #side-bar (overflow:hidden) exactly, so the outer ring was clipped on 3 sides and painted over the active side-tab underline; the menu buttons start at y=0, so their outer ring had no room above them */
    #side-body:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); border-radius: 0; }
    .mb-btn:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); }
    [data-theme="clear"] .mb-btn:focus-visible { box-shadow: inset 0 0 0 2px var(--blue) !important; }
    /* an empty terminal collapses #terminal-body to 0px but it keeps tabindex=0 (a hard UAT constraint: no display:none), so its ring was a full-width stripe; show the ring on the visible placeholder instead */
    #terminal-body:empty:focus-visible { box-shadow: none; outline: none; }
    #terminal-pane:has(#terminal-body:focus-visible) #terminal-empty { box-shadow: inset 0 0 0 2px var(--blue); }
    /* inputs with inline dark styles (I): the find / replace / grep / sidebar-search inputs are built in JS with style="background:#3c3c3c;color:white;border:1px solid #555", which made black slabs in light / clear and ignored the focus border. Overridden here instead of editing the JS template strings. The checkbox ids (#find-case, #find-regex) are not matched. */
    #search-input, #find-input, #repl-input, #grep-input, #grep-repl { background: var(--bg-input) !important; color: var(--fg) !important; border: 1px solid var(--border-strong) !important; border-radius: var(--r-md) !important; padding: var(--sp-2) var(--sp-3) !important; }
    #search-input:focus-visible, #find-input:focus-visible, #repl-input:focus-visible, #grep-input:focus-visible, #grep-repl:focus-visible { border-color: var(--blue) !important; }
    /* (the dialog-card focus border needs no override of its own any more: the card scope above re-points --blue to #8ab4f8) */
    /* light syntax palette (J): the tk-* colours are VS Code Dark+ pastels (1.3-2.5:1 on white). Light only: dark and hc (applied as data-theme="dark") and clear are untouched. Every rule is prefixed with [data-theme="light"] #ed-content. */
    [data-theme="light"] #ed-content :is(.tk-keyword, .tk-bool, .tk-heading) { color: #0000ff; }
    [data-theme="light"] #ed-content :is(.tk-type) { color: #267f99; }
    [data-theme="light"] #ed-content :is(.tk-string, .tk-code, .tk-char, .tk-rawstring, .tk-template, .tk-imglink, .tk-codeblock) { color: #a31515; }
    [data-theme="light"] #ed-content :is(.tk-comment, .tk-shebang, .tk-quote, .tk-hr) { color: #1c7a1c; }
    [data-theme="light"] #ed-content :is(.tk-num) { color: #098658; }
    [data-theme="light"] #ed-content :is(.tk-attr, .tk-var, .tk-ivar, .tk-cvar, .tk-key) { color: #001080; }
    [data-theme="light"] #ed-content :is(.tk-annot, .tk-decorator, .tk-special, .tk-fmt, .tk-bold, .tk-italic) { color: #795e26; }
    [data-theme="light"] #ed-content :is(.tk-symbol, .tk-selector, .tk-idsel, .tk-classsel, .tk-bullet) { color: #8a4b00; }
    [data-theme="light"] #ed-content :is(.tk-tag) { color: #800000; }
    [data-theme="light"] #ed-content :is(.tk-preproc, .tk-section) { color: #af00db; }
    [data-theme="light"] #ed-content :is(.tk-link) { color: #0b57d0; }
    [data-theme="light"] #ed-content :is(.tk-op) { color: var(--fg); }
    [data-theme="light"] #ed-content .sel-prefix { background: transparent; }
    [data-theme="light"] #ed-content .sel-active { background: #add6ff; }
    /* the base rule hard-codes background:#1a1a1a, which would be a near-black slab behind dark-red text in light (not in the audit prototype) */
    [data-theme="light"] #ed-content .tk-codeblock { background: #f3f3f3; }
    /* the base column-selection fill is #7a3e9d, which under #1f1f1f text is 2.4:1 */
    [data-theme="light"] #ed-content .col-sel-active { background: #e6c8f5; }

    /* ===== 排版修复 round 1: clear theme on a light desktop + web shell ===== */
    /* data-lum="light" is set by applyClearThemeColors() from the backend luminance (theme_luminance.rs); CSS cannot read it any other way. Everything below is scoped by [data-theme="clear"], so a stale value after switching theme is harmless, and a dark desktop (no attribute, or "dark") is untouched. */
    /* syntax: the [data-theme=light] palette, with darker variants for the colours that stay under 4.5:1 on a pale ~#e9e9e9 glass (type, num, comment, annot, symbol, preproc, link) */
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-keyword, .tk-bool, .tk-heading) { color: #0000ff; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-type) { color: #145c6e; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-string, .tk-code, .tk-char, .tk-rawstring, .tk-template, .tk-imglink, .tk-codeblock) { color: #a31515; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-comment, .tk-shebang, .tk-quote, .tk-hr) { color: #166016; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-num) { color: #05603d; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-attr, .tk-var, .tk-ivar, .tk-cvar, .tk-key) { color: #001080; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-annot, .tk-decorator, .tk-special, .tk-fmt, .tk-bold, .tk-italic) { color: #66501f; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-symbol, .tk-selector, .tk-idsel, .tk-classsel, .tk-bullet) { color: #774000; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-tag) { color: #800000; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-preproc, .tk-section) { color: #8f00b3; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-link) { color: #0a4cb5; }
    [data-theme="clear"][data-lum="light"] #ed-content :is(.tk-op) { color: var(--fg); }
    [data-theme="clear"][data-lum="light"] #ed-content .tk-codeblock { color: #8c1010; background: rgba(0,0,0,0.06); }
    /* selections: the base fills (#264f78 / #3a3d41 / #7a3e9d) are dark-theme colours; under the dark --fg of a light desktop they are 1.6-2.4:1 */
    [data-theme="clear"][data-lum="light"] #ed-content .sel-active { background: #add6ff; }
    [data-theme="clear"][data-lum="light"] #ed-content .sel-prefix { background: transparent; }
    [data-theme="clear"][data-lum="light"] #ed-content .col-sel-active { background: #e6c8f5; }
    /* hover / active veils and the focus ring: the white veils from Rust (and the white !important glass hovers) cannot show on a light backdrop (1.03:1); the dark-glass cards re-declare their own --bg-* / --focus-ring above, so they keep the light-on-dark values */
    [data-theme="clear"][data-lum="light"] #app {
      --bg-hover: rgba(0,0,0,0.07); --bg-active: rgba(0,0,0,0.13);
      --focus-ring: 0 0 0 1px rgba(255,255,255,0.6), 0 0 0 3px rgba(11,87,208,0.85);
      /* semantic text colours read on pale glass: the [data-theme=clear] values (--red #f87171, --yellow #fde047) are dark-glass tints (stderr 2.1:1, unsaved-tab dot 1.0:1). The light theme already uses #7d6608 for --yellow. Only the stderr lines, the dirty dot and #sb-project-name:hover read these three tokens, none of them inside the dark-glass cards. */
      --red: #a31d16; --yellow: #7d6608; --accent-text: #0a4cb5;
    }
    [data-theme="clear"][data-lum="light"] :is(.side-tab, .bottom-tab, .tab):hover,
    [data-theme="clear"][data-lum="light"] .act-btn:hover { background: rgba(0,0,0,0.07) !important; }
    [data-theme="clear"][data-lum="light"] ::selection { background: rgba(11,87,208,0.30); }
    /* web shell: the clear theme assumes a translucent native window behind the page. In a plain browser the canvas is white, so the white --fg text was 1:1 (and the saved choice is re-applied on every load). The desktop keeps its transparent window. data-shell is set at startup from inTauri; !important because setTheme() writes background:transparent inline on <html>. A (hypothetical) light luminance already has dark text on the white canvas, so it is excluded. */
    html[data-theme="clear"][data-shell="web"]:not([data-lum="light"]) { background: #1b1f2a !important; }
    /* activity icons (K): the 📁 / 🔍 colour emoji (25px wide) ignored --fg-muted and the active state; as text glyphs they follow the theme colour like the other three (⎇ ≡ ⊟). Characters and data-pane attributes are unchanged. font-variant-emoji needs Chromium 131+ and is a silent no-op on older WebView2. */
    .act-btn { font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; font-variant-emoji: text; }

    /* ===== 排版修复 round 2 ===== */
    /* welcome (short editor): the page is height:100% with centred content, so when the content is taller than the box (640x480 with the bottom panel open: 255px in 150px) the overflow went equally above and below and the top part sat in the unreachable negative scroll zone. `safe` falls back to start alignment on overflow and is identical to `center` whenever the content fits. Must follow the #welcome rule in the polish layer (same specificity, later wins). */
    #welcome { justify-content: safe center; padding-inline: var(--sp-6); }
    @media (max-height: 520px) { #welcome { padding-block: var(--sp-4); } }
    /* the shortcut line is 588px wide but the 40px side padding left 580px at 960x600, so it wrapped and broke the 2-character word 帮助 into 帮 / 助 on two lines. 24px side padding fits it on one line; keep-all (breaks only at the spaces / punctuation between items) keeps the word whole whenever the line does wrap. */
    #welcome .shortcuts { word-break: keep-all; }
    /* welcome (no file): #gutter is min-width:40px + 16px padding even with no content, a dead column that pushed the welcome card 20px off-centre and offset the focus ring of #ed-content. Not display:none (the id stays present and measurable); a gutter with text is not :empty. */
    #gutter:empty { min-width: 0; padding-left: 0; padding-right: 0; }
    /* word wrap ON: pre-wrap only breaks at whitespace, so a URL / base64 / minified line kept #ed-content scrolling horizontally. No effect under white-space:pre (wrap OFF). */
    #ed-content .hl-row, #ed-content .fold-row { overflow-wrap: anywhere; }
    /* light theme: ::selection used --bg-active (rgba(0,0,0,.08) -> #ebebeb on white, 1.19:1); same fill as the visual-mode selection (.sel-active) above */
    [data-theme="light"] ::selection { background: #add6ff; color: var(--fg); }
    /* clip history '(N 字符)' is informational text with an inline style="color:var(--fg-dim)" (JS template); --fg-dim is a decorative level (2.6:1 in dark). The inline style is beaten here instead of editing the template string, like the search / find inputs above. */
    .opt-row > span[style*="--fg-dim"] { color: var(--fg-muted) !important; }
    /* clear theme on a light desktop (hover / active states): the glass rules paint fixed white gradients and white borders with !important, which are invisible on a pale backdrop (1.03-1.06:1 hover, 1.05 active-vs-inactive tab). No box-shadow here on purpose: the glass !important shadow only carries white highlights, and a 'none' !important at this specificity would also hide the keyboard focus ring of a hovered button. */
    [data-theme="clear"][data-lum="light"] :is(.mb-btn:hover, .menu-item.open > .mb-btn, .tb-btn:hover, .bottom-toggle:hover) {
      background: rgba(0,0,0,0.07) !important; border-color: rgba(26,28,30,0.22) !important; text-shadow: none;
    }
    [data-theme="clear"][data-lum="light"] :is(.tab.active, .side-tab.active, .bottom-tab.active, .tab.active:hover, .side-tab.active:hover, .bottom-tab.active:hover) {
      background: rgba(0,0,0,0.09) !important; text-shadow: none;
    }

    /* ===== 界面布局 (min / full) =====
       <html> 上的 data-* 由 <head> 里的布局引擎写入 (首帧前), 这里只认属性. 被隐藏的区域仍留在 DOM (display:none), JS 不受影响;
       它们占的网格轨道一并折叠成 0: 列/状态栏行靠 #app 上的自定义属性归零 (写在 #app 而不是 html: 主题会在 html 上写内联自定义属性,
       内联值会压过任何样式表规则), auto 行 (底端面板 / 标签 / 面包屑) 里没有可见项自然是 0, 所以不会留空条、空隙或溢出.
       放在样式表最末, 同权重规则靠后者胜. */
    /* 活动栏 / 侧栏 / 底端面板的「隐藏」只属于完整布局 (并排停靠, 关掉就消失). 极简布局里这三个开关的含义是「展开 / 折叠」,
       折叠后留着把手, 见本节末尾的「极简布局: 折叠 + 覆盖抽屉」. */
    html[data-layout="full"][data-activity-bar="off"] #app { --w-rail: 0px; }
    html[data-layout="full"][data-activity-bar="off"] #activity-bar { display: none; }
    html[data-layout="full"][data-side-bar="off"] #app { --w-side: 0px; }
    html[data-layout="full"][data-side-bar="off"] #side-bar { display: none; }
    html[data-status-bar="off"] #app { --h-status: 0px; }
    html[data-status-bar="off"] #status { display: none; }
    html[data-layout="full"][data-bottom-panel="off"] #bottom-panel { display: none; }
    html[data-breadcrumb="off"] #breadcrumb { display: none; }
    html[data-tabs="off"] #tabs { display: none; }
    /* tabs=auto: 不足 2 个标签时隐藏, 第 2 个标签出现(含关闭到只剩 1 个)时自动随之显隐, 纯 CSS 无需 JS */
    html[data-tabs="auto"] #tabs:not(:has(.tab ~ .tab)) { display: none; }
    html[data-minimap="off"] #minimap { display: none; }
    /* 右上角「▶ 终端」按钮和内核 banner 跟预设走 (min 隐藏), 没有单独的开关 */
    html[data-layout="min"] #menubar > .tb-btn, html[data-layout="min"] #menubar > #banner { display: none; }
    /* 菜单勾选标记: updateMenuChecks() 给开关行写 data-check="on|off". 视图 / 设置菜单的所有行统一让出 22px 的勾选列, 文字才对得齐 */
    .menu-dropdown[data-dropdown="view"] .menu-row, .menu-dropdown[data-dropdown="setting"] .menu-row { position: relative; padding-left: 22px; }
    .menu-row[data-check="on"]::before { content: "✓"; position: absolute; left: 7px; top: 50%; transform: translateY(-50%); line-height: 1; color: var(--fg); }
    /* Vim 模式关 (缺省的非模态编辑): 状态栏不显示 NORMAL/INSERT 模式标签; #s-mode 留在 DOM 里 (data-mode 恒为 INSERT) */
    html[data-vim="off"] #s-mode { display: none; }
    /* 光标: #ed-content 是不可编辑的 div, 本来没有插入符. 非模态 (Vim 关) 时画一根闪烁的竖线, 位置由 updateCaret() 按 t.cursor 算;
       Vim 开着时不画 (那里靠状态栏 Ln/Col + 模式标签), 所以 Vim 开的界面和以前逐像素一致. 打字/移动时 JS 重启动画, 让它在输入过程中保持常亮 */
    html[data-vim="off"] #editor { position: relative; }   /* 只在 Vim 关时: 开着时不引入新的定位层, 渲染 (含透明主题的背景模糊) 保持和以前逐像素一致 */
    #caret { position: absolute; left: 0; top: 0; width: 2px; height: 18px; background: var(--fg); pointer-events: none; display: none; z-index: 1; }
    html[data-vim="off"] #editor:focus-within #caret.on { display: block; animation: caret-blink 1.06s steps(1) infinite; }
    @keyframes caret-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { html[data-vim="off"] #editor:focus-within #caret.on { animation: none; } }
    /* 有真光标了, 编辑区获得键盘焦点时就不再需要整圈蓝色内描边 (Sakura 也没有) */
    html[data-vim="off"] #ed-content:focus-visible { box-shadow: none; }
    /* 极简布局的未保存标记: 标签条常被隐藏, 看不到标签上的小圆点, 所以在状态栏文件名前画一个 ● (syncDocChrome 写 data-dirty) */
    html[data-layout="min"] #s-file[data-dirty="on"]::before { content: "● "; }

    /* ===== 极简布局: 折叠 + 让位抽屉 =====
       min 下「导航 / 文件」(活动栏 + 侧栏) 和底端面板不是消失, 而是折叠成常驻的把手:
       左边一条 16px 的细条 (#left-strip, 内有 ›/‹ 按钮), 底部是面板头
       (#bottom-head: TERMINAL / OUTPUT / PROBLEMS + 展开/折叠).
       开关 activityBar / sideBar / bottomPanel = true 即「展开」.

       **展开 = 让位, 不是覆盖.** (这是 2026-10 的行为契约变更)
       早期实现把抽屉做成 position:absolute 浮在编辑区之上, 展开时编辑区尺寸不变 ——
       结果抽屉直接盖住正文, 被挡的内容彻底看不到. 用户明确要求「不可以覆盖有用的信息,
       一旦被覆盖必须重新适配大小确保显示内容完整」, 所以改为并排停靠:
         - 左抽屉展开 -> 栅格列变宽 (--w-rail / --w-side), 编辑区自动收缩让位;
         - 底抽屉展开 -> #bottom-body 回到栅格流 (占 auto 行), 编辑区自动变矮.
       编辑区用 minmax(0, 1fr) + min-width/min-height: 0, 所以收缩到 0 也不会撑破栅格.

       完整布局 (full) 一直是并排停靠, 本节只管 min.
       关闭时抽屉 display:none, 轨道归零, 与「隐藏」语义一致. */

    /* min 用**四列**: [细条][活动栏][侧栏][编辑区].
       为什么要比 full 多一列: full 布局没有细条, 活动栏直接占第 1 列; min 下细条
       常驻在第 1 列, 活动栏必须挪到第 2 列 —— 否则两者抢同一格, 活动栏只剩 16px
       (实测点击展开后 #activity-bar 宽度是 16 而不是 44).
       列宽全部由开关驱动: 收起时活动栏/侧栏两列归零, 编辑区 (第 4 列 minmax(0,1fr)) 占满. */
    html[data-layout="min"] #app {
      --w-strip: 16px; --w-drawer-rail: 44px; --w-drawer-side: 240px; --h-bottom-head: 28px;
      --w-rail: 0px; --w-side: 0px;
      grid-template-columns: var(--w-strip) var(--w-rail) var(--w-side) minmax(0, 1fr);
    }
    html[data-layout="min"][data-activity-bar="on"] #app { --w-rail: var(--w-drawer-rail); }
    html[data-layout="min"][data-side-bar="on"] #app { --w-side: var(--w-drawer-side); }
    /* 窄视口: 两个抽屉全开会挤掉编辑区. 侧栏可压缩, 但编辑区至少留 240px. */
    @media (max-width: 720px) {
      html[data-layout="min"][data-side-bar="on"] #app {
        --w-side: min(var(--w-drawer-side), max(0px, calc(100vw - var(--w-strip) - var(--w-drawer-rail) - 240px)));
      }
    }
    /* 各区域落到新的列号上 */
    html[data-layout="min"] #left-strip { grid-column: 1; }
    html[data-layout="min"] #activity-bar { grid-column: 2; }
    html[data-layout="min"] #side-bar { grid-column: 3; }
    html[data-layout="min"] #editor-area { grid-column: 4; }
    html[data-layout="min"] #bottom-panel, html[data-layout="min"] #status { grid-column: 1 / -1; }
    /* 左细条: 第 2 行第 1 列, 菜单栏与面板头之间的整个高度; 按钮顶端对齐并高于所有抽屉, 底端抽屉再宽也盖不住它 */
    #left-strip { display: none; }
    html[data-layout="min"] #left-strip { display: block; grid-row: 2; grid-column: 1; min-width: 0; min-height: 0; background: var(--bg-rail); border-right: 1px solid var(--border); cursor: pointer; }
    html[data-layout="min"] #left-strip:hover { background-image: linear-gradient(var(--bg-hover), var(--bg-hover)); }
    #left-strip-btn { position: relative; z-index: calc(var(--z-drawer, 40) + 2); display: flex; align-items: center; justify-content: center; width: 100%; height: 40px; padding: 0; background: transparent; border: none; color: var(--fg-muted); cursor: pointer; font-size: 16px; line-height: 1; }
    #left-strip-btn:hover { color: var(--fg); background: var(--bg-hover); }
    #left-strip-btn:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); border-radius: 0; }   /* 外圈焦点环会被相邻的编辑区盖掉, 用内圈 */
    /* 左抽屉: 各占自己的栅格列 (第 1 列活动栏 / 第 2 列侧栏), 与完整布局一致.
       展开时列宽由 --w-rail / --w-side 决定, 编辑区自动让位 —— 不再用绝对定位盖住正文. */
    html[data-layout="min"] #activity-bar, html[data-layout="min"] #side-bar { min-width: 0; min-height: 0; }
    html[data-layout="min"][data-activity-bar="off"] #activity-bar,
    html[data-layout="min"][data-side-bar="off"] #side-bar { display: none; }
    /* 底抽屉: #bottom-panel 本来就在栅格第 3 行 (auto 行), 正文作为它的子项按列堆叠.
       展开时 auto 行 = 面板头 + 正文高度, 上面第 2 行的编辑区自动变矮 —— 让位, 不覆盖. */
    html[data-layout="min"] #bottom-panel { flex-direction: column; min-height: 0; }
    html[data-layout="min"] #bottom-body {
      flex: 0 0 clamp(120px, 40vh, 320px);
      max-height: calc(100vh - var(--h-menubar) - var(--h-status) - var(--h-bottom-head));
      border-top: 1px solid var(--border-strong);
    }
    /* 透明玻璃主题: 面板底色只有 4-5% 的白, 浮在编辑区上会让下面的文字直接透出来; 抽屉要有自己的底 (同下拉菜单的玻璃处理, 浅色桌面用浅底) */
    /* 底抽屉正文的显隐直接认 <html data-bottom-panel> (head 引擎首帧前写好), 不依赖 #bottom-panel[data-collapsed] (静态标记里恒为 true,
       要等 body 末尾的 syncDrawerUI 才改) —— 存盘里是「展开」时首帧就不会先画成折叠. 选择器里重复 #bottom-panel 只为压过上面 data-collapsed 那条的权重 */
    html[data-layout="min"][data-bottom-panel="on"] #bottom-panel #bottom-body { display: flex; }
    html[data-layout="min"][data-bottom-panel="off"] #bottom-panel #bottom-body { display: none; }
    html[data-layout="min"][data-theme="clear"] :is(#activity-bar, #side-bar, #bottom-body) {
      background: rgba(18, 22, 32, 0.86); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
    html[data-layout="min"][data-theme="clear"][data-lum="light"] :is(#activity-bar, #side-bar, #bottom-body) { background: rgba(246, 248, 252, 0.9); }
    /* 分屏: 标签条 / 面包屑隐藏后它们留下两条 0px 的 auto 行, 夹在中间的 gap:1px 会把视图整体推下 2px (露出 var(--border) 色, 菜单栏下沿看着像 3px 粗).
       min 下不要行间距, 第二排视图 (JS 打 data-row2) 用自己的上边线补回两排之间的分隔; 列间距不动 */
    html[data-layout="min"] #editor-area:is(.split-h, .split-v, .split-quad) { row-gap: 0; }
    html[data-layout="min"] .split-view[data-row2] { border-top: 1px solid var(--border); }

    /* ===== 左下角归「最近展开」的抽屉 (min 与 full 通用) =====
       导航 (活动栏 + 侧栏) 和底部终端在左下角相交. 谁后展开, 谁占整列 / 整行, 先展开的自动重新排版去让位:
         - 终端后开 (data-drawer-top="bottom"): 终端横贯整行, 左导航被压矮 (默认排法);
         - 导航后开 (data-drawer-top="left"):   导航撑满整列直到状态栏, 终端缩到编辑区那几列之下.
       data-drawer-top 由 JS (syncDrawerUI / bumpDrawer) 按最近展开 / 最近按下写在 <html> 上. */
    html[data-drawer-top="left"] #bottom-panel { grid-column: 3; }
    html[data-layout="min"][data-drawer-top="left"] #bottom-panel { grid-column: 4; }
    html[data-drawer-top="left"] :is(#activity-bar, #side-bar) { grid-row: 2 / 4; }
    html[data-layout="min"][data-drawer-top="left"] #left-strip { grid-row: 2 / 4; }

    /* ===== 菜单键盘导航 (Sakura / Windows 风格) =====
       .kb-active = 键盘 (或鼠标移上去) 选中的那一行, 外观和 :hover 完全一致, 所以只有真的用了键盘才会有新的画面;
       .kb-open = 用键盘 (→ / Enter) 展开的子菜单: 父行保持高亮, 飞出层显示 (本来只有 :hover 能展开子菜单). 只由 JS 在打开的菜单内加减, 关菜单时全部清掉 */
    .menu-row.kb-active, .menu-row.kb-open { background: var(--bg-active); color: var(--fg); }
    .menu-row.kb-active > .mr-shortcut, .menu-row.kb-open > .mr-shortcut { color: var(--fg); }
    .menu-row.menu-submenu.kb-open > .submenu-dropdown { display: block; }
    [data-theme="clear"] .menu-row.kb-active, [data-theme="clear"] .menu-row.kb-open {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.35) 0%, rgba(56, 189, 248, 0.15) 100%) !important;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
      color: var(--fg) !important;
    }
    /* 键盘接管 (#menubar.kbnav, JS 在键盘设高亮时打上、鼠标真的动了就摘掉): 鼠标静止所在的行不再亮、也不再弹悬停飞出层,
       菜单里只剩键盘那一个高亮 / 一层飞出层 (原生菜单也是这样). 键盘自己展开的层 (.kb-open) 不受影响 */
    #menubar.kbnav .menu-row:hover:not(.kb-active):not(.kb-open) { background: transparent; }
    #menubar.kbnav .menu-row:hover:not(.kb-active):not(.kb-open) > .mr-shortcut { color: var(--fg-muted); }
    #menubar.kbnav .menu-row.menu-submenu:hover:not(.kb-open) > .submenu-dropdown { display: none; }
    [data-theme="clear"] #menubar.kbnav .menu-row:hover:not(.kb-active):not(.kb-open) { background: transparent !important; box-shadow: none; }
    /* 菜单之间直接切换 (悬停 / ←→): 新下拉瞬间出现, 不重播淡入; 第一次从关闭状态打开仍有动画 (JS 在切换时打 .menu-switch, 菜单收起时摘掉) */
    #menubar.menu-switch > .menu-item > .menu-dropdown { animation: none; }

    /* =====================================================================
       透明水晶 (clear) 的分区材质.
       以前所有区域都叠在 #app 的 55% 遮罩上 (几乎不透明), 而且只有一种"玻璃".
       现在 #app 本身不再上遮罩, 遮罩只给编辑区 (保证正文可读); 每个分区各有一种材质,
       总不透明度都在 22%~52%, 透出窗口背后的 (Acrylic 模糊过的) 桌面:
         磨砂 Frost    标题栏 / 菜单栏 : 偏亮的乳白磨砂, 上亮下淡 + 底部高光线
         亚克力 Acrylic 导航 (活动栏 / 侧栏 / 左细条): 偏蓝的冷色, 竖向渐变 + 右侧边缘光
         蚀刻 Etched   标签条 / 面包屑 : 最薄 (22%), 只靠细线和内阴影成形
         烟晶 Smoked   终端 / 底部面板 : 最深 (深色桌面 52%), 像烟灰玻璃, 长时间看终端不累
         彩釉 Enamel   状态栏 : 带强调色的釉面
       深/浅桌面各一套 (data-lum 由 applyClearThemeColors 按真实采样设置), 文字色仍由 --fg 反色。
       ===================================================================== */
    [data-theme="clear"] {
      --mat-frost-a:   color-mix(in srgb, #0c1018 34%, transparent);
      --mat-frost-b:   color-mix(in srgb, #0c1018 22%, transparent);
      --mat-acrylic-a: color-mix(in srgb, #0a1426 46%, transparent);
      --mat-acrylic-b: color-mix(in srgb, #14243f 34%, transparent);
      --mat-etched:    color-mix(in srgb, #0c1018 22%, transparent);
      --mat-smoke:     color-mix(in srgb, #04060a 52%, transparent);
      --mat-enamel:    color-mix(in srgb, color-mix(in srgb, #1d6fd1 38%, #0a0e18) 56%, transparent);
      --mat-hi:        rgba(255, 255, 255, 0.38);
      --mat-lo:        rgba(255, 255, 255, 0.08);
      --mat-edit:      var(--glass-tint, rgba(10, 14, 24, 0.40));
    }
    [data-theme="clear"][data-lum="light"] {
      --mat-frost-a:   color-mix(in srgb, #ffffff 58%, transparent);
      --mat-frost-b:   color-mix(in srgb, #f4f7fb 40%, transparent);
      --mat-acrylic-a: color-mix(in srgb, #eaf1fb 58%, transparent);
      --mat-acrylic-b: color-mix(in srgb, #dce8f8 44%, transparent);
      --mat-etched:    color-mix(in srgb, #ffffff 34%, transparent);
      --mat-smoke:     color-mix(in srgb, #f6f8fb 62%, transparent);
      --mat-enamel:    color-mix(in srgb, color-mix(in srgb, #8fbdf5 70%, #ffffff) 66%, transparent);
      --mat-hi:        rgba(255, 255, 255, 0.85);
      --mat-lo:        rgba(255, 255, 255, 0.35);
    }
    [data-theme="clear"] #app { background: transparent; }
    [data-theme="clear"] #ed-content, [data-theme="clear"] #gutter { background: var(--mat-edit); }

    /* 磨砂: 标题栏 / 菜单栏 */
    [data-theme="clear"] #menubar {
      background: linear-gradient(180deg, var(--mat-frost-a), var(--mat-frost-b));
      -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
      border-bottom: 1px solid var(--mat-lo);
      box-shadow: inset 0 1px 0 var(--mat-hi), 0 1px 0 var(--mat-lo);
    }
    /* 亚克力: 导航 */
    [data-theme="clear"] #activity-bar, [data-theme="clear"] #left-strip {
      background: linear-gradient(180deg, var(--mat-acrylic-a), var(--mat-acrylic-b));
      -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
      box-shadow: inset -1px 0 0 var(--mat-hi), inset 0 1px 0 var(--mat-lo);
    }
    [data-theme="clear"] #side-bar {
      background: linear-gradient(135deg, var(--mat-acrylic-b), color-mix(in srgb, var(--mat-acrylic-b) 70%, transparent));
      -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
      border-right: 1px solid var(--mat-lo);
      box-shadow: inset -1px 0 0 var(--mat-hi);
    }
    /* 蚀刻: 标签条 / 面包屑 */
    [data-theme="clear"] #tabs, [data-theme="clear"] #breadcrumb {
      background: var(--mat-etched);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.10), inset 0 1px 0 var(--mat-lo);
    }
    /* 烟晶: 终端 / 底部面板 */
    [data-theme="clear"] #bottom-panel, [data-theme="clear"] #terminal-pane, [data-theme="clear"] #terminal-body {
      background: var(--mat-smoke);
    }
    [data-theme="clear"] #bottom-panel {

function menuItemsHtml(items) {
  return items.map((n) => {
    if (n === "-") return '<div class="menu-sep"></div>';
    if (n === "@empty") return '<div class="menu-empty">' + tr("ui.noRecent") + "</div>";
    if (typeof n === "object") return '<div class="menu-row menu-submenu" data-submenu="' + n.s + '"><span>' + tr("sub." + n.s) + '</span><span class="mr-shortcut">\u25b6</span><div class="submenu-dropdown">' + menuItemsHtml(n.i) + "</div></div>";
    const sc = MENU_SC[n];
    return '<div class="menu-row" data-cmd="' + n + '"' + (sc ? ' data-shortcut="' + sc + '"' : "") + "><span>" + tr("c." + n) + "</span>" + (sc ? '<span class="mr-shortcut">' + sc + "</span>" : "") + "</div>";
  }).join("");
}
function buildMenus() {
  const bar = document.getElementById("menubar");
  if (!bar) return;
  for (const [id, mn, items] of MENU_DEF) {
    const item = bar.querySelector('.menu-item[data-menu="' + id + '"]');
    if (!item) continue;
    const btn = item.querySelector(":scope > .mb-btn"), dd = item.querySelector(":scope > .menu-dropdown");
    const label = tr("menu." + id);
    if (btn) { btn.innerHTML = label + '<span class="mn-key">' + mn + "</span>"; btn.setAttribute("data-tip", label + " (Alt+" + mn + ")"); }
    if (dd) dd.innerHTML = menuItemsHtml(items);
  }
}

// ===== HTTP helpers =====
async function fetchApi(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || "POST" };
  if (opts.body !== undefined) {
    init.headers = { "content-type": "application/json" };
    init.body = typeof opts.body === "string" ? opts.body : JSON.stringify(opts.body);
  }
  // 10 秒超时防止 fetch 挂起 (GitHub CI / 慢速网络).
  // 注意: r 必须声明在 try **之外** —— 之前误放进 try 里, 导致后面读
  // r.headers 时 ReferenceError: r is not defined, 文件树渲染全挂.
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  init.signal = controller.signal;
  let r;
  try {
    r = await fetch(path, init);
  } finally {
    clearTimeout(timeoutId);
  }
  const ct = r.headers.get("content-type") || "";
  if (!r.ok) {
    // 错误响应体里带具体原因 (如「フォルダー」栏越出项目范围), 要掏出来给用户看,
    // 否则只会显示干巴巴的 "HTTP 400", 用户完全不知道自己哪里写错了。
    let detail = "";
    try {
      const body = ct.includes("json") ? await r.json() : await r.text();
      if (body && typeof body === "object" && body.error) detail = String(body.error);
      else if (typeof body === "string" && body.trim()) detail = body.trim();
    } catch (_) { /* 响应体不是 JSON, 就只用状态码 */ }
    throw new Error(detail || "HTTP " + r.status);
  }
  return ct.includes("json") ? r.json() : r.text();
}

// Tauri command 名与 web HTTP 端点名的差异表.
// 桌面版注册的是 #[tauri::command] fn search_cmd, 而 HTTP 端点是 /api/search;
// 其余同名. 新增命令时在这里补一行即可, 免得两端命名漂移.
const TAURI_CMD_ALIAS = { search: "search_cmd" };

// Tauri command 的参数是「函数形参名 -> 值」: search_cmd(options: SearchOptions) 要 {options:{...}},
// 而 HTTP 端点直接收平铺的条件. 返回值也不同: Tauri 返回裸数组, HTTP 返回 {results:[...]}.
// 在这里一次抹平, 调用点不用关心.
const TAURI_ARG_WRAP = { search: (a) => ({ options: a }), reinterpret_text: (a) => ({ options: a }), migemo_patterns: (a) => ({ options: a }), edit_text: (a) => ({ options: a }), edit_lines: (a) => ({ options: a }), nav_step: (a) => ({ options: a }), edit_cmd: (a) => ({ options: a }), bracket_pair: (a) => ({ options: a }), bookmark: (a) => ({ options: a }) };
const TAURI_RESULT_FIX = { search: (r) => (Array.isArray(r) ? { results: r } : r) };
// Tauri 的 invoke 失败时 reject 的是**字符串**, 不是 Error —— 直接读 err.message 会得到 undefined
// (Grep 显示「搜索失败: undefined」就是这样来的). 统一包成 Error.
function asError(e) {
  if (e instanceof Error) return e;
  const msg = (e && typeof e === "object") ? (e.message || e.error || JSON.stringify(e)) : String(e);
  return new Error(msg);
}

async function invoke(name, args) {
  if (inTauri && window.__TAURI_INTERNALS__.invoke) {
    const wrap = TAURI_ARG_WRAP[name];
    try {
      const r = await window.__TAURI_INTERNALS__.invoke(TAURI_CMD_ALIAS[name] || name, wrap ? wrap(args || {}) : (args || {}));
      const fix = TAURI_RESULT_FIX[name];
      return fix ? fix(r) : r;
    } catch (e) { throw asError(e); }
  }
  return fetchApi("/api/" + name, { method: "POST", body: args || {} });

// 终端输出两条通道:
// - web 版: 轮询 GET /api/terminal_output?id=X (后端缓冲 chunk)
// - Tauri 版: 后端 spawn_reader 通过 app.emit 主动推 "terminal://output" 事件,
//             没有轮询端点. 这里用 listen() 订阅, 避免轮询空转.
// 终端事件订阅状态:
//   "event"  — Tauri 事件通道可用 (后端 app.emit 推送)
//   "poll"   — 退回轮询 (web 版, 或 Tauri 但事件 API 不可用)

let TERM_CHANNEL = null;

// Tauri 2: withGlobalTauri=true 时是 window.__TAURI__.event.listen;
// 否则 __TAURI_INTERNALS__ 上只有 invoke/transformCallback/plugins, 没有 event.
function findTauriListen() {
  // 必须返回**绑定了宿主对象**的函数, 不能直接把方法引用取出来 ——
  // `obj.method` 取出后再当裸函数调用时 this === undefined, Tauri 的
  // listen 内部要通过 this 访问内部状态, 会抛 "cannot read property of
  // undefined". 用 bind 固定宿主, 三种来源分别绑定各自的宿主对象.
  const srcs = [
    [window.__TAURI__ && window.__TAURI__.event, "listen"],
    [window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.event, "listen"],
    [window.__TAURI_EVENT_PLUGIN_INTERNALS__, "listen"],
  ];
  for (const [host, key] of srcs) {
    if (host && typeof host[key] === "function") return host[key].bind(host);
  }
  return null;
}

async function setupTerminalChannel() {
  if (!inTauri || !window.__TAURI_INTERNALS__) return;
  // 只在"已就绪"时短路. 不能写成 `if (TERM_CHANNEL) return` —— 之前
  // 降级成 "poll" 之后, 事件 API 后来可用 (或本就可用但当时还没注入)
  // 也再也升不回来, 终端输出就永久停在轮询模式, terminal://closed
  // 之类的推送永远收不到.
  if (TERM_CHANNEL === "event") return;
  const listen = findTauriListen();
  if (!listen) {
    // 没有事件 API: 如实降级为轮询 (后端 terminal_output command 可用时)
    TERM_CHANNEL = "poll";
    setTip("Tauri 事件 API 不可用, 终端输出改用轮询");
    setTimeout(pollTerminalOutput, 100);
    return;
  }
  try {
    await listen("terminal://output", (e) => {
      const p = (e && e.payload) || {};
      const sink = p.id && TERM_SINKS.get(p.id);
      if (sink) { if (p.data) sink(p.data); return; }          // 专用窗口 (SQL*Plus) 的会话: 输出归它自己
      if (!p.id || (terminalId && p.id !== terminalId)) return;
      if (p.data) appendTerminal(p.data);
      terminalBody.scrollTop = terminalBody.scrollHeight;
    });
    await listen("terminal://closed", (e) => {
      const p = (e && e.payload) || {};
      if (terminalId && p.id === terminalId) appendTerminal("\n[会话已结束]");
    });
    TAURI_TERMINAL_LISTEN = true;
    TERM_CHANNEL = "event";
  } catch (e) {
    TERM_CHANNEL = "poll";
    setTip("终端事件订阅失败 (" + e.message + "), 改用轮询");
    setTimeout(pollTerminalOutput, 100);
  }
}

    return null;
  }
  const res = await fetch("/api/terminal_output?id=" + encodeURIComponent(id));
  return res.ok ? res.json() : null;
}

const tipEl = document.getElementById("tip");
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tipEl.style.display = "none"; return; }
  tipEl.textContent = t.getAttribute("data-tip");
  tipEl.style.display = "block";
  const r = t.getBoundingClientRect();
  tipEl.style.left = Math.max(4, Math.min(r.left, window.innerWidth - tipEl.offsetWidth - 8)) + "px";
  const th = tipEl.offsetHeight;
  tipEl.style.top = (r.bottom + 4 + th > window.innerHeight - 2 ? Math.max(4, r.top - th - 4) : r.bottom + 4) + "px";
});
document.addEventListener("mouseout", () => { tipEl.style.display = "none"; });

// 打开文件: 走 list_dir 的树选择过于笨重, 这里用相对路径输入
async function promptOpenFile() {
  // 极简布局没有「先打开项目」这一步: 没项目就先建立默认工作目录 (和保存无标题文档时是同一步)
  let root = projectRoot;
  if (!root && layoutPreset() === "min") {
    root = await ensureWorkingRoot();

  }

// ===== 书签 (会话内, 按路径记录行号) =====
const BOOKMARKS = new Map();   // path -> [{row, col, label}]
// 无标题文档没有路径, 用标签 id 当键, 免得几个无标题文档共用同一份书签
function bookmarkKey(t) { return t.path || t.id; }

// 切换 / 跳转的语义在 Rust (editcore::bookmark); 列表本身 (BOOKMARKS) 仍是前端的视图数据
function toggleBookmark() {
  return enqueueInput(async () => {
    const t = getActiveTab(); if (!t) return;
    const key = bookmarkKey(t);
    let r;
    try { r = await invoke("bookmark", { op: "toggle", list: BOOKMARKS.get(key) || [], row: t.cursor.row, col: t.cursor.col }); }
    catch (e) { setTip("书签操作失败: " + e.message); return; }
    BOOKMARKS.set(key, r.list.map((b) => ({ row: b.row, col: b.col })));
    setTip(r.added ? "已加书签 (" + r.count + ")" : "已移除书签");
    scheduleMarks();
  });
}

function bookmarkNav(delta) {
  return enqueueInput(async () => {
    const t = getActiveTab(); if (!t) return;
    const list = BOOKMARKS.get(bookmarkKey(t)) || [];
    if (list.length === 0) { setTip("无书签"); return; }
    let r;
    try { r = await invoke("bookmark", { op: delta > 0 ? "next" : "prev", list, row: t.cursor.row, col: t.cursor.col }); }
    catch (e) { setTip("书签操作失败: " + e.message); return; }
    if (!r.target) return;
    t.cursor = { row: r.target.row, col: r.target.col };
    renderVim(t);
    setTip("书签 " + (r.index + 1) + "/" + r.count + " @ Ln " + (r.target.row + 1));
  });
}
function bookmarkNext() { bookmarkNav(1); }
function bookmarkPrev() { bookmarkNav(-1); }

// ===== Status bar =====
function setMode(m) {
  if (!LAYOUT.vimOn()) m = "INSERT";      // 非模态 (缺省, 像 Sakura): 永远是可直接输入的状态; 所有调用点 (Esc / 切文档 / 启动) 一并收口
  const e = document.getElementById("s-mode");
  e.setAttribute("data-mode", m);
  e.textContent = m;
}

/* 列块模式指示 (SPA-01 C-08). 列块是**独立于 vim 三态**的编辑模式:
   进列块时 setMode 可能仍被别处调用改成 INSERT, 所以状态栏要单独给它一格,
   由列块状态直接驱动, 不经过 s-mode.
   塌缩列块 (c1 === c0, 即插入点) 显示为「列块 插入」, 让用户知道还在批量插入状态. */
function syncColumnSelectUI(t) {
  const el = document.getElementById("s-colsel");
  if (!el) return;
  const cs = t && t.colSel;
  if (!cs) { el.hidden = true; el.textContent = ""; return; }
  el.hidden = false;
  const { r0, r1, c0, c1 } = colSelRect(t);
  const rows = r1 - r0 + 1;
  const cols = c1 - c0;
  el.textContent = cols <= 0
    ? "列块 " + rows + "行 插入"
    : "列块 " + rows + "行 ×" + cols + "列";
  el.title = "列块模式 (Shift+F6 退出): 直接输入 = 在这 " + rows + " 行的同一列插入";
}
function setPos(text) { document.getElementById("s-pos").textContent = text; }
function setFile(text) { document.getElementById("s-file").textContent = text; }
function setTip(text) { document.getElementById("s-tip").textContent = text; }
function setLang(lang) {
  const e = document.getElementById("s-lang");
  e.textContent = lang || "Plain";
}

}

document.querySelectorAll("[data-cmd='new-terminal']").forEach((b) => {

// (这里原有一个 [data-cmd='toggle-bottom'] 的 click 绑定: 该元素只有视图菜单的「显示/隐藏」行, 而菜单行点击本来就走
//  下面菜单委托里的 dispatchCommand -> toggleBottomPanel, 结果同一次点击切两遍、等于没点. 已删, 统一由 dispatchCommand 处理.)

// 折叠/展开底端面板: 只切 data-collapsed, 不碰 status-active (那是状态栏语义)
// 底端面板 tab 切换: .bottom-pane.active + .bottom-tab.active 双向同步
function switchBottomPane(paneId) {
  revealRegion("bottomPanel");      // min 布局下面板整块隐藏: 先亮出来 (完整布局下是空操作)
  document.querySelectorAll(".bottom-pane").forEach((p) =>
    p.classList.toggle("active", p.id === paneId));
  document.querySelectorAll(".bottom-tab").forEach((b) =>
    b.classList.toggle("active", b.dataset.pane === paneId));
  const bp = document.getElementById("bottom-panel");
  if (bp && bp.getAttribute("data-collapsed") === "true") bp.setAttribute("data-collapsed", "false");
}

function toggleBottomPanel() {
  const bp = document.getElementById("bottom-panel");
  if (!bp) return;
  // 极简布局: 展开 / 折叠抽屉. 面板头始终在 (折叠后留作把手), data-collapsed / 按钮文案 / ✓ 由标志推出 (syncDrawerUI)
  if (layoutPreset() === "min") { setLayoutFlag("bottomPanel", !layoutFlag("bottomPanel")); return; }
  if (!layoutFlag("bottomPanel")) { revealRegion("bottomPanel"); return; }   // 整块隐藏中 -> 以展开态亮出来
  const collapsed = bp.getAttribute("data-collapsed") === "true";
  // 完整布局保持原样: 只收起正文、面板头留着
  bp.setAttribute("data-collapsed", collapsed ? "false" : "true");
  const btn = bp.querySelector('.bottom-toggle[data-cmd="bottom-toggle"]');
  if (btn) btn.textContent = collapsed ? "折叠" : "展开";
  updateMenuChecks();
}
