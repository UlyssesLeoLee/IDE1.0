// ===== Terminal =====
async function createTerminal() {
  revealRegion("bottomPanel");      // 新建终端时底端面板必须可见 (min 布局下默认隐藏)
  if (terminalId) return;
  if (inTauri) await setupTerminalChannel();
  try {
    const info = await invoke("terminal_create", {});
    terminalId = info.id;
    terminalEmpty.style.display = "none";
    setTip("终端 " + info.id + " 已启动 (" + info.shell + ")");
    setTimeout(() => pollTerminalOutput(), 100);
  } catch (e) {
    setTip("启动终端失败: " + e.message);
  }
}

async function pollTerminalOutput() {
  if (!terminalId) return;
  if (TERM_CHANNEL === "event") return;   // 事件通道已在推, 不轮询
  try {
    const j = await fetchTerminalOutput(terminalId);
    if (!j) { setTimeout(pollTerminalOutput, 200); return; }
    if (j.chunks && j.chunks.length > 0) {
      for (const chunk of j.chunks) {
        appendTerminal(chunk);
      }
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }
  } catch (e) { /* ignore */ }
  setTimeout(pollTerminalOutput, 100);
}

function appendTerminal(raw) {
  for (const line of raw.split(/\r?\n/)) {
    const div = document.createElement("div");
    div.className = "term-line";
    div.textContent = line.replace(/\x1b\[[0-9;]*m/g, "");
    terminalBody.appendChild(div);
  }
}

async function sendTerminal(data) {
  if (!terminalId) return;
  // web 走 HTTP 端点, Tauri 走 IPC command (原来硬编码 HTTP, 在桌面端静默失败)
  if (inTauri && window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
    try {
      await window.__TAURI_INTERNALS__.invoke("terminal_input", { id: terminalId, data });
      return;
    } catch (e) {
      setTip("终端输入失败: " + e.message);
      return;
    }
  }
  await fetchApi("/api/terminal_input", { body: { id: terminalId, data } });
}

// ===== 传统编辑器风格 菜单 交互 =====
// 行为对齐 Sakura / 原生 Windows 菜单 (两种布局都一样):
//   鼠标: 点击展开, 再点 / 点外面 / Esc 收起; 有菜单展开时, 鼠标挪到别的顶层按钮上立刻切过去 (不用再点); 下拉里悬停子菜单照旧展开.
//   键盘: Alt+字母 打开对应菜单; 单按一下 Alt (按下松开之间没按别的键) 把焦点交给菜单栏;
//         菜单栏上 ←/→ 移动, ↓/Enter/空格 展开; 菜单里 ←/→ 换相邻菜单 (首尾循环; 当前行是子菜单父行时 → 进入, 子菜单里 ← 退出),
//         ↑/↓ 走行 (跳过分隔线和禁用行, 首尾循环), Home/End 首/末行, Enter 执行, Esc 关闭并把焦点还给编辑区.
// 键盘高亮 = 行上的 .kb-active (子菜单展开 = .kb-open), 焦点始终留在顶层按钮上; 按键在捕获阶段处理并拦下, 不会漏进编辑区 (否则 ↓ 会移光标).
(function() {
  const BAR = document.getElementById("menubar");
  const MNEMONICS = { f: "file", e: "edit", s: "search", v: "view", t: "tool", c: "setting", w: "window", h: "help" };
  const IS_MAC = /Mac|iPhone|iPad/i.test(navigator.platform || "");   // Mac 的 Option 用来打特殊字符 (ß ƒ ...), 不做 Alt 助记键 / Alt 单按
  let hoverOpened = null;   // 悬停切过来的菜单: 紧接着在同一按钮上的那一下点击是「确认」, 不能再把它关掉 (Playwright / 真人都是先挪过去再点)
  let altArmed = false;     // 已按下 Alt 且之后没有别的键 / 鼠标 -> 松开时切到菜单栏
  let swallowKeyup = "";    // 空格在按钮上是松开时才触发 click, 我们在 keydown 里已处理, 要吞掉那次 keyup
  let activeBy = "";        // 当前高亮行是谁设的: "key" | "pointer" (鼠标设的随鼠标离开清掉, 键盘设的留着)
  let ptr = "";             // 菜单栏里最后一次见到的鼠标坐标 "x,y": 菜单变化后浏览器会补发「合成」mouseover, 坐标没变就不算鼠标真的动了

  const items = () => Array.from(BAR.querySelectorAll(":scope > .menu-item"));
  const openItem = () => BAR.querySelector(":scope > .menu-item.open");
  const btnOf = (item) => item.querySelector(":scope > .mb-btn");
  const barFocus = () => { const a = document.activeElement; return a && a.classList && a.classList.contains("mb-btn") && BAR.contains(a) ? a : null; };
  /** 一个下拉 / 子菜单里能用键盘走到的行: 直接子节点里的 .menu-row, 去掉禁用行和没画出来的 (分隔线 / 空提示本来就不是 .menu-row) */
  const rowsOf = (list) => Array.from(list.children).filter((r) => r.classList.contains("menu-row") && !r.classList.contains("disabled") && r.getClientRects().length > 0);
  const syncAria = () => items().forEach((it) => { const b = btnOf(it); if (b) b.setAttribute("aria-expanded", it.classList.contains("open") ? "true" : "false"); });
  items().forEach((it) => { const b = btnOf(it); if (b) b.setAttribute("aria-haspopup", "menu"); });
  syncAria();

  /** 助记键: Alt+字母. 优先看 e.key; 输入法 ("Process") / 非拉丁键盘布局退到物理键位 (Mac 不退, 见 IS_MAC) */
  function mnemonicOf(e) {
    const k = (e.key || "").toLowerCase();
    if (/^[a-z]$/.test(k)) return k;
    const m = !IS_MAC && /^Key([A-Z])$/.exec(e.code || "");
    return m ? m[1].toLowerCase() : "";
  }

  /** 设置高亮行 (null = 清除). 子菜单只保留「包含新高亮行」的那些键盘展开层, 其余收起, 免得悬停到别处时两个飞出层同时开着;
   *  键盘设的高亮 (by = "key") 还会给外面的子菜单父行补上 .kb-open (飞出层不再只靠鼠标悬停撑着, 鼠标一走高亮行不会跟着消失) 并给菜单栏打 .kbnav
   *  (CSS 据此让鼠标静止所在行不再亮 / 不再弹悬停飞出层, 只剩键盘那一个高亮); 鼠标设的高亮摘掉 .kbnav */
  function setActive(row, by) {
    BAR.querySelectorAll(".menu-row.kb-active").forEach((r) => { if (r !== row) r.classList.remove("kb-active"); });
    BAR.querySelectorAll(".menu-row.kb-open").forEach((r) => { if (r === row || !r.contains(row)) r.classList.remove("kb-open"); });
    if (!row) return;
    row.classList.add("kb-active");
    activeBy = by || "key";
    BAR.classList.toggle("kbnav", activeBy === "key");
    if (activeBy === "key") for (let p = row.parentElement.closest(".menu-submenu"); p; p = p.parentElement.closest(".menu-submenu")) p.classList.add("kb-open");
  }

  // Open/close top-level menus
  function closeAllMenus() {
    document.querySelectorAll(".menu-item.open").forEach(el => el.classList.remove("open"));
    BAR.querySelectorAll(".kb-active, .kb-open").forEach((el) => el.classList.remove("kb-active", "kb-open"));
    BAR.classList.remove("kbnav", "menu-switch");
    hoverOpened = null;
    syncAria();
  }
  /** 菜单命令执行 / 菜单收起之后: 焦点还留在 body 或菜单栏按钮上 (鼠标点行 / 再点标题收起时就是这样) 就还给编辑区, 接着打字;
   *  命令把焦点交给了输入框 (搜索 / Grep) 就保持不动. 对话框开着时不抢 (按键会打进后面的文档), 只放掉菜单栏按钮的焦点, 免得残留菜单模式 (字母键又去开菜单) */
  function refocusEditor() {
    const a = document.activeElement;
    if (a && a !== document.body && !barFocus()) return;
    if (modal.classList.contains("show")) { if (a && a !== document.body) a.blur(); return; }
    edContent.focus({ preventScroll: true });
  }
  /** 打开某个顶层菜单 (所有入口: 点击 / 悬停切换 / Alt+字母 / ←→ / ↓), 焦点交给它的按钮; kbd = 用键盘打开: 高亮第一行 */
  function openMenu(item, kbd) {
    const switching = !!openItem();           // 已有菜单开着 = 切换: 新下拉直接出现, 不重播淡入 (否则挪一格闪一下空白; 原生菜单是瞬间换的)
    closeAllMenus();
    if (switching) BAR.classList.add("menu-switch");
    updateMenuChecks();
    item.classList.add("open");
    syncAria();
    const b = btnOf(item);
    if (b && document.activeElement !== b) b.focus({ preventScroll: true });
    if (kbd) { const first = rowsOf(item.querySelector(":scope > .menu-dropdown"))[0]; if (first) setActive(first, "key"); }
  }
  /** 当前键盘所在的这一层: 高亮行在子菜单里就是那个子菜单, 否则是顶层下拉 */
  function curList(open) {
    const act = open.querySelector(".menu-row.kb-active");
    return act && act.parentElement.classList.contains("submenu-dropdown") ? act.parentElement : open.querySelector(":scope > .menu-dropdown");
  }
  function move(open, delta) {
    const list = curList(open), rows = rowsOf(list);
    if (!rows.length) return;
    const act = list.querySelector(":scope > .menu-row.kb-active");
    const i = rows.indexOf(act);
    setActive(rows[i < 0 ? (delta > 0 ? 0 : rows.length - 1) : (i + delta + rows.length) % rows.length], "key");
  }
  function edge(open, last) {
    const rows = rowsOf(curList(open));
    if (rows.length) setActive(rows[last ? rows.length - 1 : 0], "key");
  }
  function enterSub(parent) {
    parent.classList.add("kb-open");
    const rows = rowsOf(parent.querySelector(":scope > .submenu-dropdown"));
    if (rows.length) setActive(rows[0], "key"); else parent.classList.remove("kb-open");
    return rows.length > 0;
  }
  function leaveSub(act) {
    const parent = act.parentElement.closest(".menu-submenu");
    if (!parent) return;
    parent.classList.remove("kb-open");
    setActive(parent, "key");
  }

  document.querySelectorAll(".menu-item > .mb-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const item = btn.parentElement;
      const wasOpen = item.classList.contains("open");
      if (wasOpen && hoverOpened === item) { hoverOpened = null; return; }   // 刚由悬停切过来的: 这一下点击是确认
      if (wasOpen) { closeAllMenus(); refocusEditor(); } else openMenu(item, false);   // 再点标题收起: 焦点留在按钮上会让接着打的字母去开菜单
    });
    // 悬停切换: 已有别的菜单展开时, 鼠标移到这个按钮上就直接打开它 (上一个自动收起)
    btn.addEventListener("mouseenter", () => {
      const item = btn.parentElement;
      if (item.classList.contains("open") || !openItem()) return;
      openMenu(item, false);
      hoverOpened = item;
    });
    btn.addEventListener("mouseleave", () => { if (hoverOpened === btn.parentElement) hoverOpened = null; });
  });
  // 鼠标移到某行 = 高亮移到那一行 (和键盘共用一个高亮, ↓ 从鼠标所在行接着走); 用 over/out + relatedTarget 模拟 enter/leave, 对后加的行也有效
  // 键盘接管 (kbnav) 期间, 坐标没变的 mouseover / mousemove 是浏览器在布局变化后补发的, 不算鼠标动了: 否则键盘刚设的高亮会被鼠标静止所在的行抢回去.
  // 没有键盘接管时一律照常处理 (鼠标从栏外回到同一个像素也要亮); ptr 每次事件都刷新
  const pointerMoved = (e) => { const p = e.clientX + "," + e.clientY; const moved = p !== ptr; ptr = p; return moved || !BAR.classList.contains("kbnav"); };
  const pointerRow = (e) => { const r = e.target.closest && e.target.closest(".menu-row"); return r && !r.classList.contains("disabled") && r.closest(".menu-item.open") ? r : null; };
  BAR.addEventListener("mouseover", (e) => {
    if (!pointerMoved(e)) return;
    const wasKb = BAR.classList.contains("kbnav");           // 键盘接管后鼠标第一下真实移动: 即使只是在同一行的子元素间挪, 也把高亮还给这一行
    BAR.classList.remove("kbnav");
    const row = pointerRow(e);
    if (row && (wasKb || !(e.relatedTarget && row.contains(e.relatedTarget)))) setActive(row, "pointer");
  });
  // 同一个元素里挪动不产生 mouseover: 键盘接管后的第一下真实移动同样把高亮还给鼠标所在的行
  BAR.addEventListener("mousemove", (e) => {
    if (!pointerMoved(e) || !BAR.classList.contains("kbnav")) return;
    BAR.classList.remove("kbnav");
    const row = pointerRow(e);
    if (row) setActive(row, "pointer");
  });
  BAR.addEventListener("mouseout", (e) => {
    const row = e.target.closest && e.target.closest(".menu-row");
    if (row && activeBy === "pointer" && row.classList.contains("kb-active") && !(e.relatedTarget && row.contains(e.relatedTarget))) row.classList.remove("kb-active");
  });
  // Click outside closes menus
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".menu-item")) closeAllMenus();
  });

  // 键盘 (捕获阶段): 只在有菜单展开 / 焦点在菜单栏按钮上时才介入, 其余按键原样放行, 编辑热路径不受影响
  document.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Alt") {                                   // 只「武装」: 松开时没被别的键 / 鼠标打断才算单按 Alt
      if (!e.repeat) altArmed = !IS_MAC && !e.ctrlKey && !e.shiftKey && !e.metaKey;
      return;
    }
    altArmed = false;
    if (modal.classList.contains("show")) return;            // 对话框开着, 键盘归它
    if (e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey) {   // Alt+助记字母: 开 / 切菜单. 在捕获阶段就拦下, 编辑区 (vim 的 NORMAL 里 v 会进 VISUAL, INSERT 里会打出字母) 不再同时响应
      const name = MNEMONICS[mnemonicOf(e)];
      if (name) { e.preventDefault(); e.stopPropagation(); openMenu(document.querySelector(`.menu-item[data-menu="${name}"]`), true); return; }
    }
    const open = openItem(), onBar = barFocus();
    if (!open && !onBar) return;
    const k = e.key;
    if (k === "Tab") { if (open) closeAllMenus(); return; }  // 焦点正常往下走, 菜单随之收起
    if (e.ctrlKey || e.altKey || e.metaKey) return;          // 其它 Alt / Ctrl 组合键归全局快捷键
    const eat = () => { e.preventDefault(); e.stopPropagation(); };
    if (k === "Escape") { eat(); closeAllMenus(); edContent.focus({ preventScroll: true }); return; }
    if (e.shiftKey) return;
    if (k === "ArrowLeft" || k === "ArrowRight") {
      eat();
      const act = open && open.querySelector(".menu-row.kb-active");
      if (act && k === "ArrowRight" && act.classList.contains("menu-submenu") && enterSub(act)) return;   // 子菜单父行: → 进入
      if (act && k === "ArrowLeft" && act.parentElement.classList.contains("submenu-dropdown")) { leaveSub(act); return; }   // 子菜单里: ← 先退出一层
      const all = items(), cur = open || onBar.parentElement;
      const next = all[(all.indexOf(cur) + (k === "ArrowRight" ? 1 : -1) + all.length) % all.length];
      if (open) openMenu(next, true); else btnOf(next).focus({ preventScroll: true });
      return;
    }
    if (k === "ArrowDown" || k === "ArrowUp") {
      eat();
      if (!open) { openMenu(onBar.parentElement, false); }
      move(openItem(), k === "ArrowDown" ? 1 : -1);
      return;
    }
    if (k === "Home" || k === "End") { if (open) { eat(); edge(open, k === "End"); } return; }
    if (k === "Enter" || k === " ") {
      eat();
      if (k === " ") swallowKeyup = " ";
      if (!open) { openMenu(onBar.parentElement, true); return; }
      const act = open.querySelector(".menu-row.kb-active");
      if (!act) { edge(open, false); return; }
      if (act.classList.contains("menu-submenu")) { enterSub(act); return; }
      act.click();                                           // 和鼠标点击走同一条路 (关菜单 + dispatchCommand + 还焦点)
      if (!openItem()) refocusEditor();                      // 没走那条路的行 (没有 data-cmd / 自带处理器) 只要菜单收起了也要还焦点; 幂等, 菜单还开着就不动
      return;
    }
    // 菜单栏上直接按助记字母 (单按 Alt 之后): 打开对应菜单
    if (!open && k.length === 1 && MNEMONICS[k.toLowerCase()]) {
      eat();
      openMenu(document.querySelector(`.menu-item[data-menu="${MNEMONICS[k.toLowerCase()]}"]`), true);
    }
  }, true);
  document.addEventListener("keyup", (e) => {
    if (swallowKeyup && e.key === swallowKeyup) { swallowKeyup = ""; e.preventDefault(); e.stopPropagation(); return; }
    if (e.key !== "Alt" || !altArmed) return;
    altArmed = false;
    e.preventDefault();                                      // 不让浏览器 / 系统在松开 Alt 时弹出自己的菜单
    if (modal.classList.contains("show")) return;
    if (openItem() || barFocus()) { closeAllMenus(); edContent.focus({ preventScroll: true }); return; }   // 已在菜单模式: 再按一下 Alt 退出
    const first = items()[0];
    if (first) btnOf(first).focus({ preventScroll: true });
  }, true);
  document.addEventListener("mousedown", () => { altArmed = false; }, true);   // Alt+拖选 (列块选择) 等不算单按 Alt
  window.addEventListener("blur", () => { altArmed = false; });                // Alt+Tab 切走: 松开事件发不到本页
  // (Alt+letter 助记键 classic menu mnemonics 在上面的捕获阶段处理器里, 菜单开着也生效: Alt+E 直接从 文件 切到 编辑)
  // 测试 / 诊断用: 当前展开的菜单、高亮行、子菜单、菜单栏焦点
  window.getMenuState = function () {
    const open = openItem(), act = BAR.querySelector(".menu-row.kb-active"), sub = BAR.querySelector(".menu-row.kb-open"), b = barFocus();
    return { open: open ? open.dataset.menu : null, row: act ? (act.dataset.cmd || act.dataset.submenu || null) : null,
             sub: sub ? sub.dataset.submenu : null, bar: b ? b.parentElement.dataset.menu : null, armed: altArmed };
  };
  // Handle menu-row clicks (classic command dispatch)
  document.querySelectorAll(".menu-row[data-cmd]").forEach(row => {
    row.addEventListener("click", (e) => {
      // If submenu parent, don't fire
      if (row.classList.contains("menu-submenu")) {
        // submenu already shows on hover; clicking does nothing extra
        return;
      }
      e.stopPropagation();
      const cmd = row.dataset.cmd;
      closeAllMenus();
      dispatchCommand(cmd);
      refocusEditor();                                       // 命令没把焦点交给别处 (输入框 / 对话框) 就还给编辑区, 接着打字 (鼠标和键盘 Enter 一致)
    });
  });
  // 点子菜单父行也展开它 (触屏没有悬停); 点在飞出层里的子行不算
  document.querySelectorAll(".menu-row.menu-submenu").forEach((row) => {
    row.addEventListener("click", (e) => { if (e.target.closest(".menu-row") === row) row.classList.add("kb-open"); });
  });
})();

// ===== Command Dispatcher (classic menu items) =====
function dispatchCommand(cmd) {
  if (!cmd) return;
  if (VIEW_CMDS[cmd]) { VIEW_CMDS[cmd](); return; }
  if (CFG_CMDS[cmd]) return CFG_CMDS[cmd]();
  if (SAKURA_CMDS[cmd]) { if (!getActiveTab()) { setTip("无活动标签"); return; } return SAKURA_CMDS[cmd](); }
  if (cmd.startsWith("reopen-")) { reopenWithEncoding(cmd.slice(7)); return; }
  if (cmd.startsWith("eol-")) { setDocEol(cmd.slice(4)); return; }
  setTip("命令: " + cmd);
  switch (cmd) {
    // 文件
    case "new-file":         createNewFile(); break;
    case "open-folder":      openFolder(); break;
    case "open-file":        promptOpenFile(); break;
    case "save":             saveActive(); break;
    case "save-as":          saveActiveAs(); break;
    case "save-all":         saveAll(); break;
    case "close-tab":        closeActiveTab(); break;

    const inSel = sel && r >= sel.r0 && r <= sel.r1;
    // 选区按文档顺序: 首行 c0..行尾, 中间行整行, 末行 0..c1 (selectionText / deleteSelection 也是这个语义);
    // 单行选区取 c0/c1 的小者到大者. 以前每一行都按同一对 c0/c1 画, 跨行选区的高亮是错的.
    const _len = charLen(t.lines[r] || "");
    let cs = -1, ce = -1;
    if (inSel) {
      const _c1 = sel.c1 === Infinity ? _len : sel.c1;
      if (sel.r0 === sel.r1) { cs = Math.min(sel.c0, _c1); ce = Math.max(sel.c0, _c1); }
      else if (r === sel.r0) { cs = Math.min(sel.c0, _len); ce = _len; }
      else if (r === sel.r1) { cs = 0; ce = Math.min(Math.max(_c1, 0), _len); }
      else { cs = 0; ce = _len; }
    }
    const rendered = toks.map((tk) => {
      const cls = tk.cls ? "tk-" + tk.cls : "";
      return cls ? '<span class="' + cls + '">' + escapeHtml(tk.text) + "</span>" : escapeHtml(tk.text);
    }).join("");
    const text = t.lines[r];

    // 列块选区 (矩形). 用 colSelRect 归一化边界, 与编辑操作同一套口径 (含行尾夹取),
    // 否则插入后 c0===c1 的塌缩态会被旧的 `c1 || c0+1` 误画成「选中 1 个字符」,
    // 而实际含义是「光标停在列块起点」. 塌缩时画光标标记, 不画高亮块.
    if (t.colSel) {
      const { r0, r1, c0, c1 } = colSelRect(t);
      if (r >= r0 && r <= r1) {
        if (c1 <= c0) {
          // 塌缩 = 列块插入 / 退格后的续打位置: 画一根光标, 配色不变.
          const at = Math.min(c0, charLen(text));
          const sp = splitAt(toks, at);
          html.push('<div class="hl-row">' + sp.pre + '<span class="caret-mark">│</span>' + sp.post + "</div>");
          continue;
        }
        const seg = splitHighlighted(toks, c0, c1);
        html.push('<div class="hl-row">' + seg.pre + seg.mid + seg.post + "</div>");
        continue;
      }
    }

    // 多光标: 每个光标位置画一个标记
    const cs2 = (t.cursors || []).filter((c) => c.row === r);
    if (cs2.length > 0) {
      const marks = cs2.slice().sort((a, b) => a.col - b.col);
      let out = "", at = 0;
      for (const m of marks) {
        // char 列 (非 UTF-16 下标) —— 见 chars() 的说明
        const c = Math.min(m.col, charLen(text));
        out += escapeHtml(charSlice(text, at, c)) + '<span class="caret-mark">│</span>';
        at = c;
      }
      out += escapeHtml(charSlice(text, at));
      html.push('<div class="hl-row">' + out + "</div>");
      continue;
    }

    html.push('<div class="hl-row">' +
      (inSel
        ? '<span class="sel-prefix">' + escapeHtml(charSlice(text, 0, cs)) + "</span>" +
          '<span class="sel-active">' + escapeHtml(charSlice(text, cs, ce)) + "</span>" +
          "<span>" + escapeHtml(charSlice(text, ce)) + "</span>"
        : rendered) +
      "</div>");
  }
  edContent.replaceChildren();
  if (win) {
    const lh = VW.lh, n = t.lines.length;
    VW.on = true; VW.start = rs; VW.end = re;
    edContent.classList.add("vwin");
    edContent.style.setProperty("--vlh", lh + "px");
    edContent.innerHTML = '<div class="vs-top" style="height:' + (rs * lh) + 'px"></div>' + html.join("") + '<div class="vs-bot" style="height:' + ((n - re) * lh) + 'px"></div>';
    let nums = "";
    for (let i = rs; i < re; i++) nums += (i + 1) + "\n";
    gutter.innerHTML = '<div style="height:' + (rs * lh) + 'px"></div><div class="vgn" style="white-space:pre">' + nums.slice(0, -1) + '</div><div style="height:' + ((n - re) * lh) + 'px"></div>';
    gutter.scrollTop = edContent.scrollTop;
  } else {
    VW.on = false;
    edContent.classList.remove("vwin");
    edContent.innerHTML = html.join("");
    gutter.textContent = t.lines.map((_, i) => i + 1).join("\n");
  }
  setLang(Syntax.languageLabel(lang));
  if (VIEW_STATE.minimap) buildMinimap();
  if (hadFocus) edContent.focus({ preventScroll: true });
  updateCaret(!noFollow);
}

/* ===== 折叠: zc / zo / zM / zR =====
   块边界判定: 花括号计数, 没有花括号则用缩进块. */
function foldEndRow(t, start) {
  const line = t.lines[start];
  const opens = (line.match(/\{/g) || []).length;
  const closes = (line.match(/\}/g) || []).length;
  if (opens > closes) {
    let depth = 0;
    for (let r = start; r < t.lines.length; r++) {
      depth += (t.lines[r].match(/\{/g) || []).length;
      depth -= (t.lines[r].match(/\}/g) || []).length;
      if (r > start && depth <= 0) return r;
    }
    return t.lines.length - 1;
  }
  const base = line.match(/^[ \t]*/)[0].length;
  if (base === 0) return -1;
  let end = -1;
  for (let r = start + 1; r < t.lines.length; r++) {
    const ind = t.lines[r].match(/^[ \t]*/)[0].length;
    if (t.lines[r].trim() && ind < base) break;
    end = r;
  }
  return end;
}

function foldAtCursor(t) {
  t = t || getActiveTab();
  if (!t) return;
  const start = t.cursor.row;
  if ((t.folded || (t.folded = new Set())).has(start)) return;
  const end = foldEndRow(t, start);
  if (end <= start) return;
  // 把 start+1..end 折叠: 用一行 fold-marker 代表
  t.lines.splice(start + 1, end - start, "/* fold-marker ... " + (end - start) + " lines ... */");
  t.folded.add(start);
  t.dirty = true;
}

function unfoldAtCursor(t) {
  t = t || getActiveTab();
  if (!t) return;
  const start = t.cursor.row;
  if (!t.folded || !t.folded.has(start)) return;
  const m = t.lines[start + 1] && t.lines[start + 1].match(/\/\* fold-marker \.\.\. (\d+) lines \.\.\. \*\//);
  t.folded.delete(start);
  if (m) {
    const n = parseInt(m[1], 10);
    t.lines.splice(start + 1, 1, ...new Array(n).fill(""));
  }
  t.dirty = true;
}

function foldAll(t) {
  t = t || getActiveTab();
  if (!t) return;
  t.folded = new Set();
  for (let r = 0; r < t.lines.length; r++) {
    if (foldEndRow(t, r) > r) t.folded.add(r);
  }
  t.dirty = true;
}

function unfoldAll(t) {
  t = t || getActiveTab();
  if (!t || !t.folded) return;
  t.folded.clear();
  t.dirty = true;
}

/* ===== :template <lang> hello-world ===== */
const TEMPLATES = {
  rust: ["fn main() {", "    println!(\"Hello, world!\");", "}"],
  python: ["def main():", "    print(\"Hello, world!\")", "", "", "if __name__ == \"__main__\":", "    main()"],
  javascript: ["function main() {", "  console.log(\"Hello, world!\");", "}", "", "main();"],
  typescript: ["function main(): void {", "  console.log(\"Hello, world!\");", "}", "", "main();"],
  go: ["package main", "", "import \"fmt\"", "", "func main() {", "\tfmt.Println(\"Hello, world!\")", "}"],
  c: ["#include <stdio.h>", "", "int main(void) {", "    printf(\"Hello, world!\\n\");", "    return 0;", "}"],
  cpp: ["#include <iostream>", "", "int main() {", "    std::cout << \"Hello, world!\" << std::endl;", "    return 0;", "}"],
  java: ["public class Main {", "    public static void main(String[] args) {", "        System.out.println(\"Hello, world!\");", "    }", "}"],
  csharp: ["using System;", "", "class Program {", "    static void Main() {", "        Console.WriteLine(\"Hello, world!\");", "    }", "}"],
  ruby: ["def main", "  puts \"Hello, world!\"", "end", "", "main"],
  bash: ["#!/usr/bin/env bash", "echo \"Hello, world!\""],
  lua: ["print(\"Hello, world!\")"],
  sql: ["SELECT \"Hello, world!\";"],
};

function insertTemplate(lang, t) {
  t = t || getActiveTab();
  if (!t) return false;
  const key = String(lang || "").toLowerCase();
  const body = TEMPLATES[key];
  if (!body) {
    setTip("无模板: " + key);
    return false;
  }
  const startLine = t.cursor.row;
  const keep = t.lines[startLine];
  const indent = (keep.match(/^[ \t]*/) || [""])[0];
  const prefix = /\S/.test(keep) ? indent : indent;
  t.lines.splice(startLine, 1, keep, ...body.map((l) => (l ? prefix + l : l)));
  t.cursor.row = startLine + 1;
  t.cursor.col = charLen(prefix);
  t.dirty = true;
  paintActive();
  setTip("已插入 " + key + " 模板");
  return true;
}

/* ===== :setlang <lang> ===== */
function setTabLanguage(lang, t) {
  t = t || getActiveTab();
  if (!t) return false;
  const id = String(lang || "").toLowerCase();
  if (Syntax.LANGUAGES.indexOf(id) < 0) {
    setTip("未知语言: " + id);
    return false;
  }
  t.language = id;
  renderVim(t);
  setTip("语言: " + Syntax.languageLabel(id));
  return true;
}

/* ===== : 命令 (行首 : 触发) ===== */
function runExCommand(cmdStr, t) {
  t = t || getActiveTab();
  if (!t) return false;
  const parts = String(cmdStr || "").trim().split(/\s+/);
  const cmd = parts[0], arg = parts.slice(1).join(" ");
  switch (cmd) {
    case "w": case "write": return saveActive();
    case "q": case "quit": if (activeTabId) closeTab(activeTabId); return true;
    case "wq":
      // 无标题文档要先走另存为: 取消/失败就别把文档关掉
      if (t.untitled) { saveActive().then((ok) => { if (ok) closeTab(t.id); }); return true; }
      saveActive(); if (activeTabId) closeTab(activeTabId); return true;
    case "e": case "edit": if (arg) openFile(arg); return true;
    case "help": showHelp(); return true;
    case "setlang": return setTabLanguage(arg, t);
    case "template": case "tpl": return insertTemplate(arg, t);
    case "fold": foldAll(t); paintActive(); return true;
    case "unfold": unfoldAll(t); paintActive(); return true;
    case "lang": setTip("当前语言: " + Syntax.languageLabel(t.language || Syntax.detectLanguage(t.path || ""))); return true;
    default: setTip("未知命令: " + cmd); return false;
  }
}
