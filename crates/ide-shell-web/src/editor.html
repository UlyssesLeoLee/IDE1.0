// 全角/半角 (ASCII 可见字符)
// 半角假名 → 全角. ���原来的实现只处理 ASCII (\x21-\x7e) 和空格, 完全漏掉了
// 半角假名区 —— 而这正是日文编辑器的核心功能 (打不出全角假名时用半角代替,
// 保存时统一转全角). 半角假名区的码位不是简单偏移, 需要查表:
//   U+FF61 ｡ → U+3002
//   U+FF62-FF63 ｢｣ → U+300C/300D
//   U+FF64 ､ → U+FF64 (半角浊点, 与全角浊点合成)
//   U+FF65-FF9F ｦ-ﾟ → U+30A2-U+30FC (加 0x60, 与平<->片转换同一规则)
// 浊音/半浊音符号 (ﾞﾟ, U+FF9E/FF9F) 必须**紧跟在假名后**才转成组合浊点,
// 单独出现时保留 (它本身就是要跟假名配对的).
// 半角/全角转换.
//
// 原实现只处理 ASCII (\x21-\x7e) 和空格, **完全漏掉半角假名区**
// (U+FF61..U+FF9F) —— 而这正是日文编辑器的核心场景: 键盘打不出全角假名时
// 先用半角代替, 保存时统一转全角. 实测 toFullwidth("ｶﾞｷﾞ abc") 只把
// "abc" 转了, 假名原样留下.
//
// 这里改成按 NFKC 规范化处理 —— Unicode 的"兼容性分解"就是全角/半角
// 的权威定义, 比手写 60 条映射表可靠 (手写极易把 \u30a2:\uff65 这种
// 方向写反, 实测踩过). 浏览器原生支持 String.prototype.normalize.
//
// 浊音/半浊音要注意: 全角"ガ"= カ(U+30AB) + 组合浊点(U+3099) 两个码位,
// 半角"ｶﾞ"= ｶ(U+FF76) + 半浊点(U+FF9E) 两个码位. 两边都是两字符,
// 逐字符 NFKC 后 "ｶﾞ" 会得到 "カ" + U+3099 = "ガ" —— 但要保证 NFKC 不会
// 把组合浊点提前合并 (在字符串层面逐字符处理就是安全的, 因为 U+3099
// 单独规范化时保持不变).

// 半角/全角转换.
//
// 原实现只处理 ASCII (\x21-\x7e) 和空格, **完全漏掉半角假名区**
// (U+FF61..U+FF9F) —— 而这正是日文编辑器的核心场景: 键盘打不出全角假名时
// 先用半角代替, 保存时统一转全角. 实测 toFullwidth("ｶﾞｷﾞ abc") 只把 "abc"
// 转了, 假名原样留下.
//
// 实现要点 (两个方向不对称, 不能用同一个 normalize):
//
//   半角 -> 全角: String.prototype.normalize("NFKC") 就是权威定义.
//     "ｶﾞ" 的 NFKC 结果正是 "ガ" (か+组合浊点). 浏览器原生支持.
//
//   全角 -> 半角: **NFKC 做不到** —— U+30AB(カ) 本身不是"兼容性字符",
//     NFKC 原样返回. 必须分两步:
//       1. 假名字母: 把半角区 U+FF61..FF9F 的 NFKC 结果建成反向表,
//          运行时一次性生成 (60 条, 不硬编码 —— 手写表极易把方向写反).
//       2. 组合浊点 U+3099/U+309A -> 半浊点 U+FF9E/U+FF9F.
//     注意"ガ"= か+3099 两码位, 要**先查字母表再查浊点表**, 不能先合并.
//
// 例: "ガ" -> 表查 30AB->FF76(ｶ), 再 3099->FF9E(ﾞ) = "ｶﾞ".

let _KANA_F_TO_H = null;
let _KANA_H_TO_F = null;

function buildKanaTables() {
  if (_KANA_F_TO_H) return;
  _KANA_F_TO_H = Object.create(null);
  _KANA_H_TO_F = Object.create(null);
  for (let h = 0xff61; h <= 0xff9f; h++) {
    const half = String.fromCharCode(h);
    // 浊点 U+FF9E/FF9F 的 NFKC 是组合浊点 U+3099/U+309A, 不是单字符假名,
    // 单独处理, 不进字母表.
    if (h === 0xff9e || h === 0xff9f) continue;
    const full = half.normalize("NFKC");
    if (full.length !== 1 || full === half) continue;
    _KANA_F_TO_H[full] = half;
    _KANA_H_TO_F[half] = full;
  }
  // 半角空格/标点等非假名项由 NFKC 单独覆盖 (U+FF61 ｡ U+FF62 ｢ 等已在表内)
}

function toFullwidth(s) {
  buildKanaTables();
  return Array.from(s)
    .map((c) => {
      const code = c.charCodeAt(0);
      if (code >= 0x21 && code <= 0x7e) {
        return String.fromCharCode(code + 0xfee0);   // ASCII 可打印 -> 全角
      }
      if (code === 0x20) return "\u3000";            // 半角空格 -> 全角空格
      if (code === 0xff9e) return "\u3099";         // 半浊点 -> 组合浊点
      if (code === 0xff9f) return "\u309a";         // 半半浊点 -> 组合半浊点
      return _KANA_H_TO_F[c] || c.normalize("NFKC"); // 半角假名 -> 全角
    })
    .join("");
}

function toHalfwidth(s) {
  buildKanaTables();
  return Array.from(s)
    .map((c) => {
      const code = c.charCodeAt(0);
      if (code >= 0xff01 && code <= 0xff5e) {
        return String.fromCharCode(code - 0xfee0);   // 全角 ASCII 区 -> 半角
      }
      if (code === 0x3000) return " ";               // 全角空格 -> 半角空格
      if (code === 0x3099) return "\uff9e";         // 组合浊点 -> 半浊点
      if (code === 0x309a) return "\uff9f";         // 组合半浊点 -> 半半浊点
      // 浊音假名 (ガ/パ/バ) 是"字母+浊点"两个码位的合成形式, 表里只存
      // 字母 (カ/ハ), 所以要先 NFKD 拆成 カ+3099 再逐字查表.
      if (code >= 0x30a0 && code <= 0x30ff) {
        const parts = c.normalize("NFKD");
        if (parts.length > 1) {
          // 拆出来的每一段也要走完整规则 —— 特别是组合浊点 U+3099/309A
          // 必须转成半浊点 U+FF9E/FF9F. 只查字母表会把浊点漏成
          // 组合形式 (ｶ + ゙), 半角输入工具认不出来.
          return Array.from(parts).map((part) => {
            const pc = part.charCodeAt(0);
            if (pc === 0x3099) return "\uff9e";
            if (pc === 0x309a) return "\uff9f";
            return _KANA_F_TO_H[part] || part;
          }).join("");
        }
      }
      return _KANA_F_TO_H[c] || c.normalize("NFKC"); // 全角假名 -> 半角
    })
    .join("");
}

// 逐行映射 (默认作用于全文; 有选区时只作用于选区)
function mapLines(t, fn) {
  if (!t) return;
  snapshot(t);
  const hasSel = t.sel && t.sel.r1 !== t.sel.r0;
  if (hasSel) {
    for (let r = t.sel.r0; r <= t.sel.r1; r++) t.lines[r] = fn(t.lines[r]);
  } else {
    t.lines = t.lines.map(fn);
  }
  t.dirty = true;
  renderVim(t);
}

function selectAllText() {
  const t = getActiveTab();
  if (!t) return;
  t.sel = { r0: 0, c0: 0, r1: t.lines.length - 1, c1: Infinity };
  setTip("已全选 (" + t.lines.length + " 行)");
  renderVim(t);
}

// 选区文本 (VISUAL 模式由 renderVim 记录, 无选区时退化为当前行)
function selectionText(t) {
  if (t.sel && (t.sel.r1 !== t.sel.r0 || t.sel.c1 !== t.sel.c0)) {
    if (t.sel.r1 === t.sel.r0) {
      const line = t.lines[t.sel.r0];
      return line.slice(Math.min(t.sel.c0, t.sel.c1), Math.max(t.sel.c0, t.sel.c1));
    }
    const out = [t.lines[t.sel.r0].slice(t.sel.c0)];
    for (let r = t.sel.r0 + 1; r < t.sel.r1; r++) out.push(t.lines[r]);
    const last = t.lines[t.sel.r1];
    out.push(last.slice(0, t.sel.c1 === Infinity ? last.length : Math.max(t.sel.c1, 0)));
    return out.join("\n");
  }
  return t.lines[t.cursor.row] || "";
}

function deleteSelection(t) {
  if (!t.sel || (t.sel.r1 === t.sel.r0 && t.sel.c1 === t.sel.c0)) return false;
  snapshot(t);
  if (t.sel.r1 === t.sel.r0) {
    const line = t.lines[t.sel.r0];
    const a = Math.min(t.sel.c0, t.sel.c1), b = Math.max(t.sel.c0, t.sel.c1);
    t.lines[t.sel.r0] = line.slice(0, a) + line.slice(b);
    t.cursor = { row: t.sel.r0, col: a };
  } else {
    const first = t.lines[t.sel.r0];
    const a = Math.min(t.sel.c0, first.length);
    const last = t.lines[t.sel.r1];
    const b = t.sel.c1 === Infinity ? last.length : Math.max(t.sel.c1, 0);
    t.lines.splice(t.sel.r0, t.sel.r1 - t.sel.r0 + 1, first.slice(0, a) + last.slice(b));
    t.cursor = { row: t.sel.r0, col: a };
  }
  t.sel = null;
  t.dirty = true;
  renderVim(t);
  return true;
}



function pasteClipboard() { pasteText(CLIPBOARD); }



function insertCurrentDate() {
  const t = getActiveTab();
  if (!t) return;
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  insertChar(d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) +
             " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()));
}

function insertCurrentLangTemplate() {
  const t = getActiveTab();
  if (!t) return;
  const lang = t.language || Syntax.detectLanguage(t.path || "");
  insertTemplate(lang, t);
}

// 视图开关 (持久化到内存即可, 会话内生效)

function toggleWordWrap() {
  VIEW_STATE.wordWrap = !VIEW_STATE.wordWrap;
  edContent.style.whiteSpace = VIEW_STATE.wordWrap ? "pre-wrap" : "pre";
  updateCaret(false);
  setTip("自动换行: " + (VIEW_STATE.wordWrap ? "开" : "关"));
}
function toggleLineNumbers() {
  VIEW_STATE.lineNumbers = !VIEW_STATE.lineNumbers;
  gutter.style.display = VIEW_STATE.lineNumbers ? "" : "none";
  updateCaret(false);
  setTip("行号: " + (VIEW_STATE.lineNumbers ? "开" : "关"));
}
// 缩略图: 编辑区右侧的整文件条形预览, 真实渲染 (行高按缩放比例)
function buildMinimap() {
  const t = getActiveTab();
  const old = document.getElementById("minimap");
  if (!VIEW_STATE.minimap) { if (old) old.remove(); return; }
  const mm = old || document.createElement("div");
  mm.id = "minimap";
  const lang = t ? (t.language || Syntax.detectLanguage(t.path || "")) : "plain";
  const rows = t ? t.lines : [];
  mm.innerHTML = rows.map((line, i) => {
    const toks = Syntax.highlightLine(line, lang);
    // 每行只保留 token 的相对宽度, 纯色块, 不显示字符
    const bars = toks.map((tk) =>
      `<i style="width:${Math.max(1, Math.min(28, tk.text.length))}px"${tk.cls ? ' class="tk-' + tk.cls + '"' : ""}></i>`).join("");
    return '<div class="mm-row" data-row="' + i + '">' + bars + "</div>";
  }).join("");
  if (!old) document.getElementById("editor-area").appendChild(mm);
  // 点击行号跳转
  mm.querySelectorAll(".mm-row").forEach((r) => r.addEventListener("click", () => {
    const tv = getActiveTab();
    if (!tv) return;
    tv.cursor = { row: parseInt(r.dataset.row, 10), col: 0 };
    renderVim(tv);
  }));
}

// 开关走统一的布局标志 (落盘); LAYOUT.onChange -> syncLayoutUI 负责 VIEW_STATE.minimap / buildMinimap / renderVim
function toggleMinimap() {
  setLayoutFlag("minimap", !layoutFlag("minimap"));
  setTip("缩略图: " + (VIEW_STATE.minimap ? "开" : "关"));
}

function execCmd(cmd) {
  const t = getActiveTab();
  const fn = EDIT_CMDS[cmd];
  if (fn) { fn(t); return true; }
  setTip("命令未实装: " + cmd);
  return false;
}

// --- 视图 メニュー ---
function switchSidePane(pane) {
  const btn = document.querySelector(`.act-btn[data-pane="${pane}"]`);
  if (btn) btn.click();
  else setTip("未找到面板: " + pane);
}

// --- ツール メニュー ---
function showOutline() {
  switchSidePane("outline");
}

// --- 設定 メニュー ---


// --- ウィンドウ メニュー ---
// 新窗口会被浏览器拦截 (无用户手势); 如实降级而不是抛 pageerror
function openNewWindow() {
  try {
    const w = window.open(window.location.href, "_blank");
    if (!w) setTip("新窗口被浏览器拦截, 请允许弹出窗口或手动打开");
    else setTip("已打开新窗口");
  } catch (e) {
    setTip("新窗口不可用: " + e.message);
  }
}

function switchTab(dir) {
  const tabEls = Array.from(document.querySelectorAll(".tab"));
  if (tabEls.length === 0) return;
  const active = document.querySelector(".tab.active");
  let idx = tabEls.indexOf(active);
  if (idx < 0) idx = 0;
  else idx = (idx + dir + tabEls.length) % tabEls.length;
  tabEls[idx].click();
}

// 全屏需要用户手势, 在无手势的脚本调用里会被浏览器拒绝; 如实降级而不是抛错
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      setTip("已退出全屏");
    } else if (document.documentElement.requestFullscreen) {
      const p = document.documentElement.requestFullscreen();
      if (p && typeof p.catch === "function") {
        p.catch(() => setTip("全屏被浏览器拒绝 (需要用户手势, 请手动按 F11)"));
      }
      setTip("已进入全屏");
    } else {
      setTip("此环境不支持全屏, 请用 F11");
    }
  } catch (e) {
    setTip("全屏不可用: " + e.message);
  }
}

// --- ヘルプ メニュー ---
function showWiki() {
  // 直接开 wiki 浮层. 旧实现是 click([data-cmd='help']) — 那个元素就是派发 help
  // 命令的菜单行本身, 会无限递归把页面卡死 (所有后续 UAT 3min 超时的根因).
  showHelp();
}

function showAbout() {
  setTip("关于 IDE1.0 v0.0.1");
}
