[package]
name = "sakura-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Zlib"  # 沿用上游协议
authors.workspace = true
repository.workspace = true
description = "sakura-rs — 轻量高性能的文本编辑器内核, 对标 sakura editor (zlib) 架构, Rust 重写, 0 重型依赖, 适合嵌入 AI agent / IDE / CLI / Web 工具."

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
# Phase 2: encoding support (Shift_JIS / EUC-JP / UTF-16) via Mozilla's encoding_rs
encoding_rs = "0.8"
# Phase 5: JavaScript macro (mini JS-like interpreter, no external deps)
# Note: rquickjs/boa の Rust binding は API が複雑で依存も大きい.
# ここでは basic な JS-like 構文を inline interpreter で実行.
# Phase 6: WebAssembly plugin runtime (wasmtime)
wasmtime = "26"

[lints]
workspace = true
