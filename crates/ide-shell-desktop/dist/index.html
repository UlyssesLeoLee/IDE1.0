<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>IDE1.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ===== Base ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-bar: #252526;
      --bg-side: #1e1e1e;
      --bg-status: #007acc;
      --bg-edit: #1e1e1e;
      --border: #333;
      --fg: #d4d4d4;
      --fg-muted: #858585;
      --fg-dim: #6a6a6a;
      --blue: #569cd6;
      --green: #4ec9b0;
      --yellow: #dcdcaa;
      --red: #f48771;
      --orange: #ce9178;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg-edit); color: var(--fg); font: 13px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; }

    /* ===== App Layout ===== */
    #app { display: grid; grid-template-rows: 28px 28px 1fr 22px; grid-template-columns: 44px 240px 1fr; height: 100vh; }
    #toolbar { grid-row: 1; grid-column: 1 / -1; background: var(--bg-bar); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 6px; gap: 4px; }
    #activity-bar { grid-row: 2 / 4; grid-column: 1; background: #333; display: flex; flex-direction: column; align-items: center; padding: 4px 0; gap: 4px; }
    #side-bar { grid-row: 2 / 4; grid-column: 2; background: var(--bg-side); border-right: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
    #editor-area { grid-row: 2 / 4; grid-column: 3; display: flex; flex-direction: column; min-height: 0; }
    #bottom-panel { grid-row: 4; grid-column: 1 / -1; background: #007acc; color: white; display: flex; align-items: center; padding: 0 8px; height: 22px; }
    #status { grid-row: 4; grid-column: 1 / -1; background: var(--bg-status); color: white; display: flex; align-items: center; padding: 0 8px; height: 22px; display: none; }
    .status-active #status { display: flex; }
    .status-active #bottom-panel { display: none; }

    /* ===== Toolbar Buttons ===== */
    .tb-btn { background: transparent; border: none; color: var(--fg); padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
    .tb-btn:hover { background: #444; }
    .tb-btn:active { background: #555; }

    /* ===== Activity Bar ===== */
    .act-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--fg-muted); cursor: pointer; border-radius: 4px; font-size: 18px; }
    .act-btn:hover { background: #444; color: var(--fg); }
    .act-btn.active { color: var(--fg); border-left: 2px solid var(--blue); }

    /* ===== Side Bar ===== */
    #side-tabs { display: flex; background: #2a2a2a; border-bottom: 1px solid var(--border); height: 28px; }
    .side-tab { padding: 4px 12px; background: transparent; border: none; color: var(--fg-muted); cursor: pointer; font-size: 11px; border-bottom: 2px solid transparent; }
    .side-tab.active { color: var(--fg); border-bottom-color: var(--blue); }
    #side-body { flex: 1; overflow: auto; padding: 4px; font-size: 12px; }
    .sb-section { padding: 4px 6px; color: var(--fg-muted); text-transform: uppercase; font-size: 10px; font-weight: bold; }
    .tree-node { padding: 2px 4px; cursor: pointer; user-select: none; white-space: nowrap; }
    .tree-node:hover { background: #2a2a2a; }
    .tree-folder { font-weight: 500; }
    .tree-icon { display: inline-block; width: 14px; color: var(--fg-muted); }
    .empty-hint { padding: 12px 8px; color: var(--fg-dim); font-size: 12px; line-height: 1.5; }

    /* ===== Editor Area ===== */
    #tabs { display: flex; background: #2a2a2a; border-bottom: 1px solid var(--border); height: 28px; overflow-x: auto; }
    .tab { padding: 4px 12px; background: transparent; border: none; color: var(--fg-muted); cursor: pointer; font-size: 11px; border-right: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
    .tab.active { background: var(--bg-edit); color: var(--fg); }
    .tab .tab-close { color: var(--fg-muted); padding: 0 4px; }
    .tab .tab-close:hover { color: var(--fg); background: #444; }
    .tab-dirty::before { content: "● "; color: var(--yellow); }

    #breadcrumb { background: #252526; border-bottom: 1px solid var(--border); padding: 2px 8px; font-size: 11px; color: var(--fg-muted); height: 22px; display: flex; align-items: center; }
    .crumb { padding: 0 4px; }
    .crumb.current { color: var(--fg); }
    .crumb-sep { padding: 0 2px; }

    #editor { flex: 1; display: flex; min-height: 0; }
    #gutter { background: var(--bg-side); color: var(--fg-muted); padding: 4px 8px; text-align: right; user-select: none; min-width: 40px; overflow: hidden; font-size: 12px; line-height: 18px; }
    #ed-content { flex: 1; padding: 4px 8px; overflow: auto; background: var(--bg-edit); white-space: pre; tab-size: 2; font-size: 13px; line-height: 18px; outline: none; }
    #ed-content:focus { outline: none; }

    /* ===== Bottom Panel (single layer) ===== */
    #bottom-head { display: flex; align-items: center; height: 28px; background: #252526; border-top: 1px solid var(--border); }
    .bottom-tabs { display: flex; }
    .bottom-tab { padding: 4px 12px; background: transparent; border: none; color: var(--fg-muted); cursor: pointer; font-size: 11px; border-bottom: 2px solid transparent; }
    .bottom-tab.active { color: var(--fg); border-bottom-color: var(--blue); background: var(--bg-edit); }
    .bottom-spacer { flex: 1; }
    .bottom-toggle { background: transparent; border: none; color: var(--fg-muted); cursor: pointer; padding: 4px 8px; font-size: 11px; }
    .bottom-toggle:hover { color: var(--fg); }

    #bottom-body { background: var(--bg-edit); height: 240px; overflow: hidden; display: flex; flex-direction: column; }
    .bottom-pane { display: none; flex: 1; overflow: auto; }
    .bottom-pane.active { display: flex; flex-direction: column; }
    #terminal-body { flex: 1; padding: 4px 8px; overflow: auto; font-size: 12px; line-height: 1.4; white-space: pre-wrap; }
    #terminal-body:focus { outline: 1px solid var(--blue); }
    .term-line { padding: 1px 0; }
    .term-prompt { color: var(--blue); font-weight: bold; }
    .term-stderr { color: var(--red); }
    .terminal-empty { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--fg-dim); flex-direction: column; gap: 8px; }
    .terminal-empty-hint kbd { background: #444; padding: 1px 6px; border-radius: 3px; font-family: inherit; font-size: 10px; }

    #output-body, #problems-body { flex: 1; padding: 4px 8px; overflow: auto; font-size: 12px; }
    .output-line { padding: 1px 0; }
    .output-time { color: var(--fg-muted); margin-right: 8px; }
    .output-line.stderr { color: var(--red); }
    .output-empty { padding: 20px; text-align: center; color: var(--fg-dim); }

    /* ===== Status Bar ===== */
    #status { font-size: 11px; }
    .s-item { padding: 0 8px; border-right: 1px solid rgba(255,255,255,0.2); }
    .s-mode { font-weight: bold; }
    .s-mode[data-mode="NORMAL"] { background: var(--blue); padding: 0 8px; }
    .s-mode[data-mode="INSERT"] { background: var(--green); padding: 0 8px; }
    .s-mode[data-mode="VISUAL"] { background: var(--orange); padding: 0 8px; }
    .s-tip { flex: 1; }

    /* ===== Tooltip ===== */
    #tip { position: fixed; background: #333; color: white; padding: 4px 8px; border-radius: 3px; font-size: 11px; pointer-events: none; z-index: 1000; display: none; max-width: 400px; }

    /* ===== Modal ===== */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 500; }
    #modal.show { display: flex; }
    .md-box { background: #2d2d2d; border-radius: 4px; width: 600px; max-width: 80vw; max-height: 80vh; display: flex; flex-direction: column; }
    .md-head { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
    .md-title { font-weight: bold; }
    .md-spacer { flex: 1; }
    .md-btn { background: transparent; border: none; color: var(--fg); cursor: pointer; padding: 4px 8px; }
    .md-btn:hover { background: #444; }
    .md-body { padding: 12px; overflow: auto; flex: 1; white-space: pre-wrap; font-family: inherit; font-size: 12px; line-height: 1.5; }
    .md-foot { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    /* ===== Welcome ===== */
    #welcome { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 40px; }
    #welcome h1 { font-size: 56px; font-weight: bold; }
    #welcome .open-btn { background: var(--blue); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    #welcome .open-btn:hover { background: #1f8ad2; }
    .shortcuts { font-size: 11px; color: var(--fg-muted); }
    .shortcuts kbd { background: #444; padding: 1px 6px; border-radius: 3px; margin: 0 2px; }
  </style>
</head>
<body>
  <div id="app" class="status-active">
    <!-- Toolbar -->
    <div id="toolbar">
      <button class="tb-btn" data-cmd="open-folder" data-tip="打开文件夹 (Ctrl+K O)">打开文件夹</button>
      <button class="tb-btn" data-cmd="save" data-tip="保存 (Ctrl+S)">保存</button>
      <button class="tb-btn" data-cmd="close-tab" data-tip="关闭标签 (Ctrl+W)">×</button>
      <span style="flex:1"></span>
      <button class="tb-btn" data-cmd="help" data-tip="打开内置 wiki 帮助">? 帮助</button>
    </div>

    <!-- Activity Bar -->
    <div id="activity-bar">
      <button class="act-btn active" data-pane="explorer" data-tip="资源管理器">📁</button>
      <button class="act-btn" data-pane="search" data-tip="搜索">🔍</button>
      <button class="act-btn" data-pane="scm" data-tip="源代码管理">⎇</button>
      <button class="act-btn" data-pane="outline" data-tip="大纲">≡</button>
    </div>

    <!-- Side Bar -->
    <div id="side-bar">
      <div id="side-tabs"></div>
      <div id="side-body"></div>
    </div>

    <!-- Editor Area -->
    <div id="editor-area">
      <div id="breadcrumb"></div>
      <div id="editor">
        <div id="gutter"></div>
        <div id="ed-content" tabindex="0"></div>
      </div>
    </div>

    <!-- Bottom Panel (single layer) -->
    <div id="bottom-panel" data-collapsed="true">
      <div id="bottom-head">
        <div class="bottom-tabs">
          <button class="bottom-tab active" data-pane="terminal-pane">TERMINAL</button>
          <button class="bottom-tab" data-pane="output-pane">OUTPUT</button>
          <button class="bottom-tab" data-pane="problems-pane">PROBLEMS</button>
        </div>
        <span class="bottom-spacer"></span>
        <button class="bottom-toggle" data-cmd="new-terminal" data-tip="新建终端 (+ New Terminal)">+ 新建终端</button>
        <button class="bottom-toggle" data-cmd="toggle-bottom" data-tip="折叠/展开">折叠</button>
      </div>
      <div id="bottom-body">
        <div class="bottom-pane active" id="terminal-pane">
          <div id="terminal-body" tabindex="0"></div>
          <div id="terminal-empty" class="terminal-empty">
            <div>暂无终端会话</div>
            <div class="terminal-empty-hint">点 <kbd>+ 新建终端</kbd> 或按 <kbd>Ctrl</kbd>+<kbd>`</kbd> 打开 PowerShell</div>
          </div>
        </div>
        <div class="bottom-pane" id="output-pane">
          <div id="output-body"></div>
        </div>
        <div class="bottom-pane" id="problems-pane">
          <div id="problems-body"></div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status">
      <span class="s-item s-mode" data-mode="NORMAL" id="s-mode">NORMAL</span>
      <span class="s-item" id="s-pos">Ln 1, Col 1</span>
      <span class="s-item" id="s-file">无活动</span>
      <span class="s-item s-tip" id="s-tip">就绪 — 点工具栏「打开文件夹」导入项目</span>
      <span class="s-item" id="s-lang">Plain</span>
    </div>

    <!-- Tooltip & Modal -->
    <div id="tip"></div>
    <div id="modal">
      <div class="md-box">
        <div class="md-head">
          <span class="md-title" id="md-title">提示</span>
          <span class="md-spacer"></span>
          <button class="md-btn" data-cmd="modal-close">✕</button>
        </div>
        <div class="md-body" id="md-body"></div>
        <div class="md-foot" id="md-foot"></div>
      </div>
    </div>
  </div>

// ===== HTTP helpers =====
async function fetchApi(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || "POST" };
  if (opts.body !== undefined) {
    init.headers = { "content-type": "application/json" };
    init.body = typeof opts.body === "string" ? opts.body : JSON.stringify(opts.body);
  }
  const r = await fetch(path, init);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}

async function invoke(name, args) {
  if (inTauri && window.__TAURI_INTERNALS__.invoke) {
    return window.__TAURI_INTERNALS__.invoke(name, args || {});
  }
  return fetchApi("/api/" + name, { method: "POST", body: args || {} });
}

// ===== Tooltip =====
const tipEl = document.getElementById("tip");
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tipEl.style.display = "none"; return; }
  tipEl.textContent = t.getAttribute("data-tip");
  tipEl.style.display = "block";
  const r = t.getBoundingClientRect();
  tipEl.style.left = Math.min(r.left, window.innerWidth - tipEl.offsetWidth - 8) + "px";
  tipEl.style.top = (r.bottom + 4) + "px";
});
document.addEventListener("mouseout", () => { tipEl.style.display = "none"; });

// ===== Modal =====
const modal = document.getElementById("modal");
const mdTitle = document.getElementById("md-title");
const mdBody = document.getElementById("md-body");
const mdFoot = document.getElementById("md-foot");
function openModal(opts) {
  mdTitle.textContent = opts.title || "提示";
  mdBody.textContent = opts.body || "";
  mdFoot.innerHTML = "";
  (opts.buttons || [{ label: "关闭", cmd: "modal-close" }]).forEach((b) => {
    const btn = document.createElement("button");
    btn.className = "md-btn";
    btn.textContent = b.label;
    btn.dataset.cmd = b.cmd;
    if (b.tip) btn.dataset.tip = b.tip;
    mdFoot.appendChild(btn);
  });
  modal.classList.add("show");
}
function closeModal() { modal.classList.remove("show"); }

// ===== Bottom panel =====
function selectBottomTab(name) {
  document.querySelectorAll(".bottom-tab").forEach((b) => b.classList.remove("active"));
  document.querySelectorAll(".bottom-pane").forEach((p) => p.classList.remove("active"));
  const tab = document.querySelector('.bottom-tab[data-pane="' + name + '"]');
  const pane = document.getElementById(name);
  if (tab) tab.classList.add("active");
  if (pane) pane.classList.add("active");
  if (name === "terminal-pane" && !terminalId) {
    createTerminal();
  }
}
document.querySelectorAll(".bottom-tab").forEach((btn) => {
  btn.addEventListener("click", () => selectBottomTab(btn.dataset.pane));
});

document.querySelectorAll("[data-cmd='new-terminal']").forEach((b) => {
  b.addEventListener("click", () => createTerminal());
});
document.querySelectorAll("[data-cmd='toggle-bottom']").forEach((b) => {
  b.addEventListener("click", () => {
    const bp = document.getElementById("bottom-panel");
    const cur = bp.getAttribute("data-collapsed") === "true";
    bp.setAttribute("data-collapsed", cur ? "false" : "true");
    document.getElementById("app").classList.toggle("status-active", cur);
    b.textContent = cur ? "折叠" : "展开";
  });
});

// ===== Terminal =====
async function createTerminal() {
  if (terminalId) return;
  try {
    const info = await invoke("terminal_create", {});
    terminalId = info.id;
    terminalEmpty.style.display = "none";
    setTip("终端 " + info.id + " 已启动 (" + info.shell + ")");
    setTimeout(() => pollTerminalOutput(), 100);
  } catch (e) {
    setTip("启动终端失败: " + e.message);
  }
}

async function pollTerminalOutput() {
  if (!terminalId) return;
  try {
    const data = await fetch("/api/terminal_output?id=" + terminalId);
    if (!data.ok) { setTimeout(pollTerminalOutput, 200); return; }
    const j = await data.json();
    if (j.chunks && j.chunks.length > 0) {
      for (const chunk of j.chunks) {
        appendTerminal(chunk);
      }
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }
  } catch (e) { /* ignore */ }
  setTimeout(pollTerminalOutput, 100);
}

function appendTerminal(raw) {
  for (const line of raw.split(/\r?\n/)) {
    const div = document.createElement("div");
    div.className = "term-line";
    div.textContent = line.replace(/\x1b\[[0-9;]*m/g, "");
    terminalBody.appendChild(div);
  }
}

async function sendTerminal(data) {
  if (!terminalId) return;
  await fetchApi("/api/terminal_input", { body: { id: terminalId, data } });
}

if (terminalBody) terminalBody.addEventListener("keydown", async (e) => {
  if (!terminalId) return;
  let data = null;
  if (e.key === "Enter") data = "\r\n";
  else if (e.key === "Backspace") data = "\b \b";
  else if (e.ctrlKey && e.key.toLowerCase() === "c") { data = "\x03"; e.preventDefault(); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) data = e.key;
  else return;
  e.preventDefault();
  await sendTerminal(data);
});

terminalBody.addEventListener("focus", () => terminalBody.focus());

// ===== Editor =====
const TABS = tabs;
let maxTabId = 0;

function getActiveTab() { return TABS.get(activeTabId); }

function renderTabs() {
  tabsEl.innerHTML = "";
  for (const [id, t] of TABS) {
    const tab = document.createElement("button");
    tab.className = "tab" + (id === activeTabId ? " active" : "") + (t.dirty ? " tab-dirty" : "");
    tab.dataset.tabId = id;
    tab.innerHTML = escapeHtml(t.name) + '<span class="tab-close" data-tab-close="' + id + '" title="关闭">×</span>';
    tabsEl.appendChild(tab);
  }
}

function renderBreadcrumb() {
  breadcrumb.innerHTML = "";
  const at = TABS.get(activeTabId);
  if (!at) return;
  const parts = at.path.split(/[\\\/]/).filter(Boolean);
  if (parts[0] && parts[0].endsWith(":")) parts.shift();
  parts.forEach((p, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      breadcrumb.appendChild(sep);
    }
    const c = document.createElement("span");
    c.className = "crumb" + (i === parts.length - 1 ? " current" : "");
    c.textContent = p;
    breadcrumb.appendChild(c);
  });
}

function setActiveTab(id) {
  activeTabId = id;
  renderTabs();
  renderBreadcrumb();
  const t = TABS.get(id);
  if (t) {
    edContent.textContent = t.lines.join("\n");
    gutter.textContent = t.lines.map((_, i) => i + 1).join("\n");
    setFile(t.path);
    setPos("Ln " + (t.cursor.row + 1) + ", Col " + (t.cursor.col + 1));
    setMode("NORMAL");
  }
  edContent.focus();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch];
  });
}

async function openFile(path) {
  try {
    const lines = await invoke("read_file", { path });
    const id = "t" + (++maxTabId);
    TABS.set(id, { id, path, cursor: { row: 0, col: 0 }, dirty: false, lines: typeof lines === "string" ? lines.split("\n") : lines });
    setActiveTab(id);
    setTip("已打开: " + path);
  } catch (e) {
    setTip("打开失败: " + e.message);
  }
}

async function saveActive() {
  const t = getActiveTab();
  if (!t) return false;
  try {
    await invoke("write_file", { path: t.path, content: t.lines.join("\n") });
    t.dirty = false;
    renderTabs();
    setTip("已保存");
    return true;
  } catch (e) {
    openModal({ title: "保存失败", body: e.message });
    return false;
  }
}

function closeTab(id) {
  TABS.delete(id);
  if (activeTabId === id) activeTabId = null;
  if (TABS.size === 0) {
    edContent.textContent = "";
    gutter.textContent = "";
    setFile("无活动");
    setPos("Ln 1, Col 1");
  } else {
    setActiveTab([...TABS.keys()][0]);
  }
  renderTabs();
  renderBreadcrumb();
}

if (tabsEl) tabsEl.addEventListener("click", (e) => {
  const closeBtn = e.target.closest("[data-tab-close]");
  if (closeBtn) {
    e.stopPropagation();
    closeTab(closeBtn.dataset.tabClose);
    return;
  }
  const tab = e.target.closest(".tab");
  if (tab) setActiveTab(tab.dataset.tabId);
});

if (edContent) edContent.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { setMode("NORMAL"); return; }
  if (e.key === "i" || e.key === "a" || e.key === "o" || e.key === "I" || e.key === "A" || e.key === "O") {
    setMode("INSERT");
  }
  if (e.key === "v") setMode("VISUAL");
  if (e.ctrlKey && e.key.toLowerCase() === "s") {
    e.preventDefault();
    saveActive();
  }
});

// ===== Side bar =====
let currentSidePane = "explorer";

function showSidePane(name) {
  currentSidePane = name;
  document.querySelectorAll(".act-btn").forEach((b) => b.classList.toggle("active", b.dataset.pane === name));
  renderSideBar();
}

function renderSideBar() {
  const tabs = [
    { pane: "explorer", title: "资源管理器" },
    { pane: "search", title: "搜索" },
    { pane: "scm", title: "源代码管理" },
    { pane: "outline", title: "大纲" },
  ];
  sideTabsEl.innerHTML = tabs.map(t =>
    '<button class="side-tab ' + (t.pane === currentSidePane ? "active" : "") + '" data-side-tab="' + t.pane + '">' + t.title + "</button>"
  ).join("");
  // Render body based on pane
  if (currentSidePane === "explorer") renderExplorer();
  else if (currentSidePane === "search") renderSearch();
  else if (currentSidePane === "scm") renderScm();
  else if (currentSidePane === "outline") renderOutline();
}

if (sideTabsEl) sideTabsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-side-tab]");
  if (b) showSidePane(b.dataset.sideTab);
});

document.querySelectorAll(".act-btn").forEach((btn) => {
  btn.addEventListener("click", () => showSidePane(btn.dataset.pane));
});

async function renderExplorer() {
  if (!projectRoot) {
    sideBody.innerHTML = '<div class="empty-hint">未打开项目<br><br>点工具栏「打开文件夹」导入项目</div>';
    return;
  }
  sideBody.innerHTML = '<div class="sb-section">' + escapeHtml(projectRoot) + "</div>";
  try {
    const entries = await invoke("list_dir", { path: projectRoot });
    for (const e of entries) {
      const node = document.createElement("div");
      node.className = "tree-node tree-folder" + (e.is_dir ? "" : " tree-file");
      node.innerHTML = '<span class="tree-icon">' + (e.is_dir ? "📁" : "📄") + "</span>" + escapeHtml(e.name);
      if (!e.is_dir) {
        node.addEventListener("click", () => openFile(e.path));
      }
      sideBody.appendChild(node);
    }
  } catch (e) {
    sideBody.innerHTML += '<div class="empty-hint">读取失败: ' + escapeHtml(e.message) + "</div>";
  }
}

function renderSearch() {
  sideBody.innerHTML = '<input id="search-input" placeholder="搜索文件..." style="width:100%;padding:4px 6px;background:#3c3c3c;color:white;border:1px solid #555;border-radius:3px;font:inherit;" />' +
    '<div id="search-results" style="margin-top:8px;"></div>';
  const input = document.getElementById("search-input");
  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const q = input.value.trim();
      if (!q) return;
      try {
        const matches = await invoke("search", { query: q });
        const r = document.getElementById("search-results");
        r.innerHTML = "";
        for (const m of matches) {
          const row = document.createElement("div");
          row.className = "tree-node";
          row.textContent = m.path + ":" + (m.line + 1);
          row.addEventListener("click", () => openFile(m.path));
          r.appendChild(row);
        }
        if (matches.length === 0) r.innerHTML = '<div class="empty-hint">无匹配</div>';
      } catch (e) { /* ignore */ }
    }
  });
  input.focus();
}

async function renderScm() {
  sideBody.innerHTML = '<div class="sb-section">源代码管理</div><div id="scm-status">加载中...</div>';
  try {
    const j = await invoke("scm_status");
    const statusEl = document.getElementById("scm-status");
    statusEl.innerHTML = '<div class="empty-hint">当前分支: <b>' + escapeHtml(j.branch || "(no branch)") + "</b></div>";
    if (j.files) {
      for (const f of j.files) {
        const row = document.createElement("div");
        row.className = "tree-node";
        row.textContent = "  " + (f.status || "?") + " " + f.path;
        statusEl.appendChild(row);
      }
    }
  } catch (e) {
    document.getElementById("scm-status").innerHTML = '<div class="empty-hint">未初始化 git 仓库</div>';
  }
}

async function renderOutline() {
  const at = getActiveTab();
  if (!at) {
    sideBody.innerHTML = '<div class="empty-hint">打开一个文件查看大纲</div>';
    return;
  }
  sideBody.innerHTML = '<div class="sb-section">' + escapeHtml(at.path.split(/[\\\/]/).pop() || "") + "</div><div id='outline-list'>加载中...</div>";
  try {
    const data = await invoke("outline", { path: at.path });
    const list = document.getElementById("outline-list");
    list.innerHTML = "";
    if (data && data.entries) {
      for (const e of data.entries) {
        const row = document.createElement("div");
        row.className = "tree-node";
        row.textContent = (e.kind === "function" ? "ƒ" : e.kind === "class" ? "C" : "•") + " " + e.name;
        row.addEventListener("click", () => setTip("跳到 " + (e.line + 1) + " 行"));
        list.appendChild(row);
      }
      if (data.entries.length === 0) list.innerHTML = '<div class="empty-hint">无大纲 (' + (data.language || "?") + ")</div>";
    }
  } catch (e) {
    document.getElementById("outline-list").innerHTML = '<div class="empty-hint">解析失败</div>';
  }
}

// ===== Open folder =====
async function openFolder() {
  let path;
  try {
    path = await invoke("pick_folder");
  } catch (e) {
    path = null;
  }
  if (!path) {
    const def = projectRoot || "D:/work";
    path = prompt("输入项目根绝对路径:", def);
  }
  if (!path) return;
  try {
    await invoke("open_project", { path });
    projectRoot = path;
    setFile(path);
    setTip("已打开项目: " + path);
    showSidePane("explorer");
  } catch (e) {
    setTip("打开失败: " + e.message);
  }
}

// ===== Help =====
function showHelp() {
  try {
    const txt = atob(WIKI_B64);
    openModal({ title: "IDE1.0 — 完整 wiki", body: txt, buttons: [{ label: "关闭", cmd: "modal-close" }] });
  } catch (e) {
    openModal({ title: "帮助", body: String(e) });
  }
}

// ===== Command router =====
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-cmd]");
  if (!btn) return;
  const cmd = btn.dataset.cmd;
  if (cmd === "open-folder") openFolder();
  else if (cmd === "save") saveActive();
  else if (cmd === "close-tab" && activeTabId) closeTab(activeTabId);
  else if (cmd === "new-terminal") createTerminal();
  else if (cmd === "toggle-bottom") document.querySelector("[data-cmd='toggle-bottom']").click();
  else if (cmd === "help") showHelp();
  else if (cmd === "modal-close") closeModal();
});

// ===== Global keyboard =====
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
  if (e.key === "F1") { e.preventDefault(); showHelp(); }
  if (e.ctrlKey && e.key.toLowerCase() === "s") { e.preventDefault(); saveActive(); }
  if (e.ctrlKey && e.key === "`") {
    e.preventDefault();
    const bp = document.getElementById("bottom-panel");
    if (bp.getAttribute("data-collapsed") === "true") bp.setAttribute("data-collapsed", "false");
    else bp.setAttribute("data-collapsed", "true");
  }
  if (e.key === "Escape") edContent.focus();
});

// ===== Welcome page =====
function showWelcome() {
  const ed = document.getElementById('ed-content');
  if (!ed) return;
  ed.innerHTML = '<div id="welcome"><h1>IDE1.0</h1><button class="open-btn" data-cmd="open-folder">打开文件夹</button><div class="shortcuts"><kbd>i</kbd>/<kbd>a</kbd> INSERT · <kbd>v</kbd> VISUAL · <kbd>Esc</kbd> NORMAL · <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存 · <kbd>Ctrl</kbd>+<kbd>`</kbd> 终端 · <kbd>F1</kbd> 帮助</div></div>';
}
showWelcome();

// ===== Bootstrap =====
window.addEventListener("DOMContentLoaded", async function () {
(async function bootstrap() {
  try {
    const b = await invoke("kernel_banner");
    setTip("就绪 — " + b);
  } catch (e) { /* ignore */ }
  showSidePane("explorer");
  // Default mode NORMAL
  setMode("NORMAL");
  setPos("Ln 1, Col 1");
  setFile("无活动");
  setLang("Plain");
  edContent.focus();
})();
});
</script>
